[package]
name        = "portcullis-cli"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
description = "CLI for Portcullis. Phase 1: just the `validate` subcommand for atrium.toml manifests."

[[bin]]
name = "portcullis"
path = "src/main.rs"

[dependencies]
portcullis-toml   = { path = "../portcullis-toml" }
portcullis-jail   = { path = "../portcullis-jail" }
portcullis-policy = { path = "../portcullis-policy" }
portcullis-ipc    = { path = "../portcullis-ipc" }
