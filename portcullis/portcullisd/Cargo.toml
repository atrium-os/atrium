[package]
name        = "portcullisd"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
description = "Portcullis policy daemon. Long-running, holds the per-user grant policy in memory and serves authorize/grant/revoke requests over a Unix-domain socket."

[lib]
name = "portcullisd"
path = "src/lib.rs"

[[bin]]
name = "portcullisd"
path = "src/main.rs"

[[bin]]
name = "atrium-portcullisd-jclient"
path = "src/bin/jclient.rs"

[[bin]]
name = "atrium-portcullisd-bootstrap"
path = "src/bin/bootstrap.rs"

[[bin]]
name = "atrium-portcullisd-attach"
path = "src/bin/attach.rs"

[dependencies]
portcullis-toml   = { path = "../portcullis-toml" }
portcullis-jail   = { path = "../portcullis-jail" }
portcullis-policy = { path = "../portcullis-policy" }
portcullis-ipc    = { path = "../portcullis-ipc" }
jaild             = { path = "../jaild" }
atrium-volumes    = { path = "../atrium-volumes" }
libc              = "0.2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
toml              = "0.8"
log               = "0.4"
env_logger        = "0.11"

[dev-dependencies]
tempfile = "3"
