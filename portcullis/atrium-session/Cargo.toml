[package]
name        = "atrium-session"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
description = "Per-user session jail composer for Atrium. Builds a minimal-base jail with /apps + portcullisd socket bind-mounted, runs the user's shell inside it."

[[bin]]
name = "atrium-session"
path = "src/main.rs"

[dependencies]
portcullis-jail = { path = "../portcullis-jail" }
