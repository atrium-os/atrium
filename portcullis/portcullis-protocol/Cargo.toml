[package]
name        = "portcullis-protocol"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
description = "portcullisd opcode dictionary for aqueduct. Lets in-jail services request runtime mounts (and future capabilities) over the unified IPC envelope."

[lib]
name = "portcullis_protocol"
path = "src/lib.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
