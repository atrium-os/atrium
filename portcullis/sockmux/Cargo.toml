[package]
name        = "sockmux"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
description = "Single-threaded kqueue multiplexer for Atrium's privileged unix-socket brokers (jaild, atrium-volumes, portcullisd-daemon): every client connection stays open, one request per connection per round."

[dependencies]
libc = "0.2"
log  = "0.4"

[dev-dependencies]
tempfile = "3"
libc = "0.2"
