[package]
name        = "portcullis-ipc"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
description = "Wire protocol between portcullis-cli and portcullisd. Newline-delimited JSON over a Unix-domain socket."

[dependencies]
portcullis-toml   = { path = "../portcullis-toml" }
portcullis-policy = { path = "../portcullis-policy" }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
