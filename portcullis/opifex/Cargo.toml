[package]
name    = "opifex"
version = "0.1.0"
edition = "2021"

# opifex — Atrium's BINARY app installer for FreeBSD (the pkg-style counterpart to
# insula, which is the ports/Homebrew-style compile-from-source path). It places a
# pre-built, signed Insula bundle into the Portcullis app tree the jail launcher
# (portcullisd) reads. Jail-aware: it resolves the entry binary's shared-library
# closure into the app tree, because a Portcullis jail's rootfs IS only that tree.

[lib]
name = "opifex"
path = "src/lib.rs"

[[bin]]
name = "opifex"
path = "src/main.rs"

[[bin]]
name = "opifexd"
path = "src/bin/opifexd.rs"

[[bin]]
name = "opifex-check"
path = "src/bin/opifex-check.rs"

[[bin]]
name = "opifex-fetch"
path = "src/bin/opifex-fetch.rs"

[dependencies]
portcullis-toml = { path = "../portcullis-toml" }
portcullis-sig  = { path = "../portcullis-sig" }
portcullis-token = { path = "../portcullis-token" }
portcullis-trust = { path = "../portcullis-trust" }
# The launch registry: whose app a side-load's asker is.
portcullis-peer = { path = "../portcullis-peer" }
opifex-catalog  = { path = "../opifex-catalog" }
sha2   = "0.10"
base64 = "0.22"
toml   = "0.8"
serde  = { version = "1", features = ["derive"] }
serde_json = "1"
libc   = "0.2"
nuntius = { path = "../../nuntius" }
praeco  = { path = "../../praeco" }
atrium-fonts = { path = "../../atrium-fonts" }
blake3 = { version = "1", features = ["pure"] }
# Its devices.d rules, to check a driver package's file the way dispensatord will load it.
dispensator = { path = "../../dispensator" }
