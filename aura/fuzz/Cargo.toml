[package]
name = "aura-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
aura-proto = { path = "../aura-proto" }
aura-wlan-core = { path = "../aura-wlan-core" }

# Its own workspace, like every cargo-fuzz crate.
[workspace]

[[bin]]
name = "proto_decode"
path = "fuzz_targets/proto_decode.rs"
test = false
doc = false

[[bin]]
name = "wlan_rx"
path = "fuzz_targets/wlan_rx.rs"
test = false
doc = false
