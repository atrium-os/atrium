[package]
name = "aura-eap"
version = "0.1.0"
description = "Aura's EAP peer for WPA2/WPA3-Enterprise (docs/spec/wifi.md §7.4): PEAPv0/EAP-MSCHAPv2, EAP-TTLS (PAP, MSCHAPv2) and EAP-TLS on rustls, the server certificate always checked. No I/O."
edition.workspace = true
license.workspace = true

[features]
# The EAP peer and its helper binary. aura-keys turns it off: it needs only
# the profile and the helper's framing, not TLS.
default = ["peer"]
peer = ["dep:rustls", "dep:rustls-pki-types", "dep:webpki", "dep:md4", "dep:des", "dep:sha1", "dep:hmac"]

[[bin]]
name = "atrium-aura-eap"
required-features = ["peer"]

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std", "ring"], optional = true }
md4 = { version = "0.10", optional = true }
des = { version = "0.8", optional = true }
sha1 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
sha2 = "0.10"
zeroize = { version = "1", features = ["zeroize_derive"] }

[target.'cfg(target_os = "freebsd")'.dependencies]
libc = "0.2"

[dev-dependencies]
md-5 = "0.10"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
