# Aura, the Wi-Fi stack (docs/spec/wifi.md).
#
# Its own workspace with no path dependency outside aura/, so the user-space
# parts build on stock FreeBSD too (spec decision 12).
[workspace]
resolver = "2"
members = [
    "aura-proto",
    "aura-wlan-core",
    "aura-sim-check",
    "aura-rsn",
    "aura-air",
    "aura-ipc",
    "aura-mlme",
    "aura-keys",
    "aura-ctl",
    "aura-regdb",
]

[workspace.package]
edition = "2021"
license = "BSD-2-Clause"
