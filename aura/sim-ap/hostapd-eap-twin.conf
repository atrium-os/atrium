# The evil twin of hostapd-eap.conf: the same name and security, its own CA and a
# server certificate for the same name (scripts/aura-sim-gate.sh w7).
interface=wlan0
driver=nl80211
ctrl_interface=/run/hostapd
ssid=aura-corp
country_code=US
hw_mode=g
channel=1
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-EAP-SHA256
rsn_pairwise=CCMP
ieee80211w=2
ieee8021x=1
eap_server=1
eap_user_file=/tmp/eap-users
ca_cert=/tmp/eap-evil-ca.pem
server_cert=/tmp/eap-twin.pem
private_key=/tmp/eap-twin.key
logger_stdout=-1
logger_stdout_level=1
