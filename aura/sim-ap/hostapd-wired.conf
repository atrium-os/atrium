# Wired 802.1X (docs/spec/wifi.md §7.5): hostapd as the office switch's
# port, on the cable from the FreeBSD VM (scripts/aura-ap-vm.sh wired
# sets the interface). Its own EAP server, with the w7 gate's certificates
# and users in /tmp/eap-*.
interface=cable0
driver=wired
ctrl_interface=/run/hostapd-wired
ieee8021x=1
use_pae_group_addr=1
eap_reauth_period=0
eap_server=1
eap_user_file=/tmp/eap-users
ca_cert=/tmp/eap-ca.pem
server_cert=/tmp/eap-server.pem
private_key=/tmp/eap-server.key
logger_stdout=-1
logger_stdout_level=1
