# WPA2-Enterprise (802.1X, AKM 1, no PMF) with hostapd's own EAP
# server, on hwsim radio 1 (scripts/aura-sim-gate.sh w7). The gate makes
# the certificates and the user file and copies them to /tmp/eap-*.
interface=wlan1
driver=nl80211
ctrl_interface=/run/hostapd
ssid=aura-corp2
country_code=US
hw_mode=g
channel=11
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-EAP
rsn_pairwise=CCMP
ieee80211w=0
ieee8021x=1
eap_server=1
eap_user_file=/tmp/eap-users
ca_cert=/tmp/eap-ca.pem
server_cert=/tmp/eap-server.pem
private_key=/tmp/eap-server.key
logger_stdout=-1
logger_stdout_level=1
