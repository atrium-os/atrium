# WPA3-Personal only: SAE with hash-to-element only (sae_pwe=1: the BSS
# membership selector is in the rates), PMF required, and an anti-clogging
# token demanded on every commit (threshold 0) so the token path runs.
interface=wlan0
driver=nl80211
channel=6
ctrl_interface=/run/hostapd
ssid=aura-test
country_code=US
ieee80211d=1
hw_mode=g
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
rsn_pairwise=CCMP
wpa_passphrase=correct horse battery staple
wpa_group_rekey=60
logger_stdout=-1
logger_stdout_level=1
wpa_key_mgmt=SAE
ieee80211w=2
sae_pwe=1
sae_groups=19
sae_anti_clogging_threshold=0
