# WPA2-PSK, PMF required, on hwsim radio 0 (scripts/aura-ap-vm.sh).
interface=wlan0
driver=nl80211
ctrl_interface=/run/hostapd
ssid=aura-test
country_code=US
hw_mode=g
channel=6
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK WPA-PSK-SHA256
rsn_pairwise=CCMP
ieee80211w=2
wpa_passphrase=correct horse battery staple
# Rekey the group key every 60 s so the gate sees a group handshake.
wpa_group_rekey=60
logger_stdout=-1
logger_stdout_level=1
