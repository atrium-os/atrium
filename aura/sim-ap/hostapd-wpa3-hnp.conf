# WPA3-Personal with hunting-and-pecking only (sae_pwe=0, no RSNXE), PMF
# required, anti-clogging token on every commit.
interface=wlan0
driver=nl80211
channel=6
ctrl_interface=/run/hostapd
ssid=aura-test
country_code=US
hw_mode=g
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
rsn_pairwise=CCMP
wpa_passphrase=correct horse battery staple
wpa_group_rekey=60
logger_stdout=-1
logger_stdout_level=1
wpa_key_mgmt=SAE
ieee80211w=2
sae_pwe=0
sae_groups=19
sae_anti_clogging_threshold=0
