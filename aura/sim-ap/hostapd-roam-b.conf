# Roaming: one of two BSSs of the same WPA3 network (H2E offered) on
# channels 1 and 6; aura/sim-ap/air-hwsim.py sets what signal each has.
interface=wlan0
driver=nl80211
channel=6
ctrl_interface=/run/hostapd
ssid=aura-test
country_code=US
hw_mode=g
ieee80211n=1
wmm_enabled=1
auth_algs=1
wpa=2
rsn_pairwise=CCMP
wpa_passphrase=correct horse battery staple
wpa_group_rekey=60
logger_stdout=-1
logger_stdout_level=1
wpa_key_mgmt=SAE
ieee80211w=2
sae_pwe=2
sae_groups=19
