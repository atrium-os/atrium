# /etc/atrium/services.d/38-atrium-monstratord.toml
#
# The jailed launch of monstratord, the link opener
# (docs/spec/opening-links.md §6). atrium-portcullisd-bootstrap reads this,
# asks jaild to create the jail and supervises monstratord inside it.
#
# monstratord runs NON-ROOT (_monstrator) with no devices (ruleset 4), no
# network and none of anyone's files. It reaches six socket directories: its own
# (/atrium/sockets/monstrator/, which apps with `open-uri` and the Navigator
# see) and portcullisd's, which takes LinkGrant and DeliverLink only from
# this user, and frescod's and its activation socket for its sheet (a
# choice among apps; its presses are its own, PROMPT), and Tabula's, for Copy
# address (the address copied for the app that asked, in its persona;
# tabulad takes that from _monstrator only), and the install sheet's, for an
# atrium-app: link to an app that isn't installed (the sheet takes the asking
# app from _monstrator only; opening-links.md §4.3). It can't launch
# anything or spend an app's press: portcullisd does both.
#
# REQUIRES (scripts/monstrator-service.sh does all of it):
#   1. The _monstrator (65038) system user, in jaild.policy's allowed_system_uids.
#   2. /atrium/sockets/monstrator, owned _monstrator, 0755.
#   3. The rootfs mountpoint dirs: <path>/{dev,libexec,lib,usr/lib,usr/local/bin,atrium/sockets/{monstrator,portcullis,fresco,fresco-activation,clipboard,opifex-sheet}}.

enabled       = true
name          = "atrium-monstratord"
path          = "/var/lib/atrium/jails/monstratord"
children_max  = 0
devfs_ruleset = 4                                # devfsrules_jail: no devices

[[mounts]]
source = "/libexec"
dest   = "libexec"
kind   = "ro_nullfs"
[[mounts]]
source = "/lib"
dest   = "lib"
kind   = "ro_nullfs"
[[mounts]]
source = "/usr/lib"
dest   = "usr/lib"
kind   = "ro_nullfs"
[[mounts]]
source = "/usr/local/bin"
dest   = "usr/local/bin"
kind   = "ro_nullfs"
[[mounts]]
source = "/atrium/sockets/monstrator"             # rw: binds monstrator.sock
dest   = "atrium/sockets/monstrator"
kind   = "rw_nullfs"
[[mounts]]
source = "/atrium/sockets/portcullis"             # rw: connects to portcullisd
dest   = "atrium/sockets/portcullis"
kind   = "rw_nullfs"
[[mounts]]
source = "/atrium/sockets/fresco"                 # rw: its sheet's window
dest   = "atrium/sockets/fresco"
kind   = "rw_nullfs"
[[mounts]]
source = "/atrium/sockets/fresco-activation"      # rw: spends the sheet's presses (PROMPT, its own)
dest   = "atrium/sockets/fresco-activation"
kind   = "rw_nullfs"
[[mounts]]
source = "/atrium/sockets/clipboard"              # rw: Copy address, through Tabula
dest   = "atrium/sockets/clipboard"
kind   = "rw_nullfs"
[[mounts]]
source = "/atrium/sockets/opifex-sheet"           # rw: the install sheet, for atrium-app: links (L5)
dest   = "atrium/sockets/opifex-sheet"
kind   = "rw_nullfs"

[exec]
path = "/usr/local/bin/atrium-monstratord"
argv = ["atrium-monstratord"]
uid  = 65038   # _monstrator
gid  = 65038
# portcullisd: /atrium/sockets/portcullis/portcullis.sock, the client's first choice.
