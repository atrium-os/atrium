[package]
name = "monstrator"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Monstrator, the link opener (docs/spec/opening-links.md): monstratord takes every request to open a link in another app, checks the link in its jail, and has portcullisd hand it over, one press each."

[[bin]]
name = "monstratord"
path = "src/bin/monstratord.rs"

[dependencies]
atrium-links = { path = "../atrium-links" }
portcullis-ipc = { path = "../portcullis/portcullis-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[workspace]
