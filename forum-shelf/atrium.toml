# Forum shelf — notification toasts. A Forum chrome app: it subscribes to
# praecod (only Forum's uid may) and draws toasts in Fresco's notification
# layer (frescod grants the role only to uids in FRESCOD_NOTIFY_UIDS).
# It holds no window-management.
[app]
id          = "org.atrium.forum-shelf"
name        = "Forum Shelf"
version     = "0.1.0"
entry       = "bin/forum-shelf"
description = "Notification toasts."
icon        = "bell"

[capabilities]
graphics = "fresco"
notify   = true
# Starts an app whose notification action was pressed while it wasn't
# running (tabula.md §5.3); portcullisd does the checks, as for the dock.
app-launch = true
# frescod's activation socket, to grant a press on a toast's action to the
# app that posted it (restricted: Forum's shelf only).
notification-shelf = true
network  = "none"
# Limen roles it embeds. Without this key a platform bundle keeps every role.
embeds = []

[supervision]
restart    = "on-crash"
keep-alive = true
instances  = "single"
