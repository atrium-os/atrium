# R9700 bare metal (docs/spec/r9700-bare-metal.md). First boots: no GPU
# driver is loaded; vgapci + efifb give the console on the IPMI KVM.
vfs.root.mountfrom="ufs:/dev/ufs/atriumroot"
autoboot_delay="5"
console="efi"
kern.racct.enable=1
# Stage 2 (probe) needs /dev/mem only. The atrium-gpu-amd modules are in
# /boot/atrium-gpu-amd, outside the module path, until stage 3.
