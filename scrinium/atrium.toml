# Scrinium, the file manager (docs/spec/scrinium.md). The window lists the
# sticks dispensatord serves into its jail and hands files to the apps that
# open them; the system picker (the catalogue's `picker` provider) stays a
# system service. It holds what its code uses, and vm-scrinium-check.sh
# grants and checks the same (uid 50603).
[app]
id          = "org.atrium.scrinium"
name        = "Files"
version     = "0.1.0"
entry       = "bin/scrinium"
description = "Your files, USB sticks and network shares."
icon        = "files"

[capabilities]
graphics        = "fresco"
removable-files = true   # every stick served for the session, in its jail; eject
file-picker     = true   # hand a picked file or folder to the app that asked
home-files      = true   # the person's folders at /atrium/home, and their workspaces
arca            = true   # its saved network shares (the server, its key, the password item)
network         = "none"
# Limen roles the window embeds (app-composition.md §3): quick look's
# viewers and print sheet (with a picker for Save as PDF), and Arca's fields.
embeds          = ["doc-viewer", "pdf-viewer", "media-player", "credential", "print", "picker"]

[supervision]
restart   = "on-crash"
instances = "single"
