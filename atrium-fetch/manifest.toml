# Insula manifest for atrium-fetch.
#
# This sample app makes HTTP GET requests over Insula's
# atrium_net_connect API. The default manifest below
# allows raw network so the tool can be pointed at
# arbitrary hosts; production use of a similar tool
# would scope [network].hosts to specific endpoints.

[app]
name = "com.atrium-os.atrium-fetch"
version = "0.1.0"
sdk-version = "1.x"

[bundle]
form = "native"
arches = ["aarch64-darwin"]
entry = "bin/atrium-fetch"

[storage]
data = "1MB"

[network]
raw-network = true
