[package]
name        = "atrium-gpu-app"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
publish     = false
description = "The broker side of the app GPU path (F6, docs/spec/gpu-app-path-f6.md): validates app code headers and dispatch records and builds every PM4 packet itself."

[lib]
path = "src/lib.rs"

[dependencies]
atrium-rdna4-cmd = { path = "../atrium-rdna4-cmd" }
atrium-gpu-rs    = { path = "../atrium-gpu-rs", optional = true }
atrium-rdna4-isa = { path = "../atrium-rdna4-isa", optional = true }
libc             = { version = "0.2", optional = true }

[features]
# The on-device end-to-end check (FreeBSD guest with the driver loaded).
e2e = ["device", "dep:atrium-rdna4-isa"]
# The atrium-gpu-amd session backend (session::amd).
device = ["dep:atrium-gpu-rs", "dep:libc"]

[[bin]]
name = "app-path-e2e"
path = "src/bin/app_path_e2e.rs"
required-features = ["e2e"]
