[package]
name = "pergola-richtext"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "RichTextEditor (docs/spec/officina.md §10.1): Pergola's rich-text editor over officina-text. A headless editing core (caret, selection, motions, typing, formatting, undo) and a paged view that draws only the pages near the viewport."

[dependencies]
pergola = { path = "../pergola" }
pergola-document = { path = "../pergola-document" }
officina-core = { path = "../officina-core" }
officina-text = { path = "../officina-text" }
navigator-image = { path = "../navigator-image" }
unicode-segmentation = "1"

[dev-dependencies]
png = "0.17"

# navigator-fonts vendors a one-line fix to pathfinder_simd (see its
# vendor/README.md); a dependent crate must repeat the patch.
[patch.crates-io]
pathfinder_simd = { path = "../navigator-fonts/vendor/pathfinder_simd" }

[profile.release]
debug = 1
