[package]
name = "lyra-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Lyra audio control protocol (Aqueduct class 5, audio-control). The wire dictionary choragusd speaks to lyrad: routing/level changes the policy layer asks the RT engine to apply. Shared by both so neither daemon crate depends on the other."

[lib]
name = "lyra_protocol"
path = "src/lib.rs"
