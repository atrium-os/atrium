[package]
name = "mail-smime"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "S/MIME for Mail (docs/spec/mail.md §10.1): verify a detached signature and its chain (in the parse jail), build a signature around a signature someone else makes (Sigillum's token, Arca's key), and encrypt to and decrypt from CMS EnvelopedData with a content key someone else unwraps. Holds no private key. RustCrypto CMS/X.509 types and ring; no OpenSSL."

[features]
# Synthetic prototype only. Mail's reader does not opt in.
legacy-receive-prototype = []
legacy-receive-worker = ["legacy-receive-prototype", "dep:libc", "dep:zeroize"]

[dependencies]
cms = { version = "0.2.3", default-features = false, features = ["std"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }
der = { version = "0.7", features = ["std", "oid"] }
spki = "0.7"
ring = "0.17"
aes = "0.8"
cbc = { version = "0.1", features = ["std"] }
rsa = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }

libc = { version = "0.2", optional = true }
zeroize = { version = "1", optional = true }

[[bin]]
name = "mail-legacy-smime-worker"
path = "src/bin/legacy_worker.rs"
required-features = ["legacy-receive-worker"]

[dev-dependencies]
rcgen = "0.13"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
sha2 = { version = "0.10", features = ["oid"] }

[profile.dev.package.num-bigint-dig]
opt-level = 3
