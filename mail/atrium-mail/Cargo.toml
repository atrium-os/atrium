[package]
name = "atrium-mail"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Mail's windows (docs/spec/mail.md §9, §15): places, the message list, the reader, and compose windows (drafts, Send as a press, Send later, mailto: links)."

# Workers built in a crate this one doesn't link (cargo atrium run, bundle
# and check): the parse jail talks to the engine over its socket.
[package.metadata.atrium.workers]
parse = "../mail-parse"
office-copy = "../mail-office-copy"

[lib]
name = "atrium_mail"
path = "src/lib.rs"

[[bin]]
name = "atrium-mail"
path = "src/bin/atrium-mail.rs"

[features]
# Signed disposable bundle only. The installed production manifest omits the role.
legacy-smime-integration = ["mail-smime/legacy-receive-prototype"]

[dependencies]
mail-office-copy = { path = "../mail-office-copy", default-features = false }
pergola = { path = "../../pergola" }
fresco-client = { path = "../../fresco-client" }
mail-engine = { path = "../mail-engine" }
mail-smime = { path = "../mail-smime" }
mail-compose = { path = "../mail-compose" }
# Rich text in compose (mail.md §9.1): RichTextEditor over officina-text.
pergola-richtext = { path = "../../pergola-richtext" }
officina-text = { path = "../../officina-text" }
officina-pdf = { path = "../../officina-pdf" }
# mailto: links from Monstrator, on the document channel (mail.md §9.1).
atrium-open = { path = "../../atrium-open" }
# Attachments (mail.md §8): their type from their bytes, never their name alone.
atrium-types = { path = "../../atrium-types" }
# Open in… (mail.md §8.2): OpenAttachment to portcullisd, a sealed memory file.
portcullis-ipc = { path = "../../portcullis/portcullis-ipc" }
mail-store = { path = "../mail-store" }
mail-schema = { path = "../mail-schema" }
# The doc-viewer role for HTML bodies (mail.md §7.3).
limen = { path = "../../limen" }
libc = "0.2"
# Remote pictures, only when asked (mail.md §7.4): Mail's own fetcher.
nuntius = { path = "../../nuntius" }
praeco = { path = "../../praeco" }
# S/MIME signing with a token: sigillumd shows the sheet and asks the PIN.
sigillum-proto = { path = "../../sigillum/sigillum-proto" }
# The link bar (mail.md §7.6): peeling, the registrable domain, the link
# check Monstrator applies, and Monstrator itself for Open.
url = "2"
psl = "2"
atrium-links = { path = "../../atrium-links" }
monstrator = { path = "../../monstrator" }

# Accounts (mail.md §5): every connection is an Arca courier; Arca keeps
# the password from its own field (KEEP_FOR).
mail-sync = { path = "../mail-sync" }
arca-courier = { path = "../../arca/arca-courier" }
atrium-worker = { path = "../../sdk/atrium-worker" }
# Whether the store is encrypted at rest (mail.md §6.4a A2), from portcullisd.
atrium-storage = { path = "../../sdk/atrium-storage" }
arca-courierd = { path = "../../arca/arca-courierd" }
arca-store = { path = "../../arca/arca-store" }
arcad = { path = "../../arca/arcad" }

[dev-dependencies]
tempfile = "3"
# A stand-in for the token in the signing test.
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }

# navigator-fonts vendors a one-line fix to pathfinder_simd (see its
# vendor/README.md); a dependent crate must repeat the patch.
[patch.crates-io]
pathfinder_simd = { path = "../../navigator-fonts/vendor/pathfinder_simd" }
