# Mail (docs/spec/mail.md). It has no network of its own: accounts are
# reached through Arca's mail courier, and remote pictures, only when the
# person asks (§7.4), through its own Nuntius fetcher (net-fetch). HTML
# bodies are drawn by a jailed doc-viewer in a slot (§7.3). It takes
# mailto: links (§13, opening-links.md §4.1). Attachments are never written
# to a temporary file (§8.2): quick look and Open get sealed memory files,
# Save goes through the system picker.
[app]
id          = "org.atrium.mail"
name        = "Mail"
version     = "0.1.0"
entry       = "bin/atrium-mail"
description = "Read and write email."
icon        = "envelope"

[capabilities]
graphics  = "fresco"
arca-courier = true  # brokered IMAP, submission and HTTPS under Mail’s identity
arca      = true  # begin the PKCE session under Mail’s signed identity
network   = "none"
net-fetch = true   # remote pictures, only when asked
# Open in… (§8.2): a sealed, read-only memory file to portcullisd with a
# press; it picks the person's default app from the bytes' type.
open-attachments = true
# New mail and the Later review through Praeco (§12): quiet by default,
# never a storm after a gap.
notify = true
# The roles Mail embeds through limend: the system picker (attach, Save),
# a doc-viewer for HTML bodies, reply quotes and image thumbnails, a pdf-viewer
# and a media-player for quick look, the credential sheet (sign-in), and
# the print sheet.
embeds = ["picker", "doc-viewer", "pdf-viewer", "pdf-sanitizer", "media-player", "credential", "mail-sign-in", "print", "smime-provision"]

# The parser (§4): every message is parsed here, in a jail of its own as
# a uid of its own, with no capability (app-composition.md §4).
[[workers]]
name   = "parse"
entry  = "bin/mail-parse-jail"
memory = "512M"

# Sync (§4): one account's session (IMAP, SMTP submission or JMAP), in a
# jail of its own with no capability. The engine relays the courier's
# bytes (or makes its HTTP requests) and answers its store calls; it parses
# every byte the server sends. One per session, kept while the session
# lasts (an IDLE waits up to 25 minutes).
[[workers]]
name     = "sync"
entry    = "bin/mail-sync-worker"
lifetime = "session"
memory   = "256M"

# Foreign document parsers see only the selected sealed attachment.
[[workers]]
name = "office-copy"
entry = "bin/mail-office-copy"
input = "fd"
memory = "512M"
cpu = "30s"

[[links]]
schemes = ["mailto"]

[supervision]
restart   = "on-crash"
instances = "single"
