[package]
name = "mail-proto-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mail-proto = { path = ".." }

[[bin]]
name = "imap"
path = "fuzz_targets/imap.rs"
test = false
doc = false
bench = false

[[bin]]
name = "smtp"
path = "fuzz_targets/smtp.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
