[package]
name = "mail-store"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Mail's store (docs/spec/mail.md §6.2): raw messages as files by content hash, and the engine's index (redb): folders, messages, flags, the list newest first. Holds parsed summaries only; parses nothing."

[dependencies]
mail-schema = { path = "../mail-schema" }
postcard = { version = "1.1.3", features = ["use-std"] }
redb = "2"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
