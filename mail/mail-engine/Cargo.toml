[package]
name = "mail-engine"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Mail's engine (docs/spec/mail.md §4, §6): the store and index for one instance, fed by mail-sync; every message is parsed in a parse jail (mail-parse-jail) and only the checked summary is kept. No network of its own (remote pictures go through the caller's Nuntius channel), parses nothing itself."

[dependencies]
portcullis-ipc = { path = "../../portcullis/portcullis-ipc" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
libc = "0.2"
# The parser as Mail's `parse` worker when installed (dev-tools-plan.md M5).
atrium-worker = { path = "../../sdk/atrium-worker" }
mail-compose = { path = "../mail-compose" }
mail-smime = { path = "../mail-smime" }
# OpenPGP (§10.2): encrypting to keys, and reading a key the person gives.
mail-pgp = { path = "../mail-pgp" }
mail-schema = { path = "../mail-schema" }
mail-store = { path = "../mail-store" }
mail-sync = { path = "../mail-sync" }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
# Private addresses (§13.3): their random part.
getrandom = "0.2"
# Remote pictures (§7.4) go through the caller's Nuntius channel.
nuntius = { path = "../../nuntius", default-features = false }
# First contact and look-alikes (§7.5): UTS #39 skeletons, domains in
# their own letters.
unicode-security = "0.1"
idna = "1"
atrium-links = { path = "../../atrium-links" }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
mail-proto = { path = "../mail-proto" }
# S/MIME round trips with a software key.
rsa = "0.9"
sha2 = { version = "0.10", features = ["oid"] }
# OpenPGP: keys and signatures made as senders would.
pgp = { version = "0.21", default-features = false }
rand = "0.8"
# DKIM: messages signed as a sender would.
ring = "0.17"
# The end-to-end test: a real Dovecot over TLS, through the real Arca mail
# courier, into the engine with real parse jails.
arca-courier = { path = "../../arca/arca-courier" }
arca-store = { path = "../../arca/arca-store" }
navigator-fetch = { path = "../../navigator-fetch" }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
