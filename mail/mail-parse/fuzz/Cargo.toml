[package]
name = "mail-parse-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mail-parse = { path = ".." }

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false

[patch.crates-io]
pathfinder_simd = { path = "../../../navigator-fonts/vendor/pathfinder_simd" }
