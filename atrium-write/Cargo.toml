[package]
name = "atrium-write"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "atrium-write, Atrium's word processor (docs/spec/officina.md §7): officina-text's engine in Pergola's RichTextEditor, files through the system picker, an autosave journal for crash recovery."

[lib]
name = "atrium_write"
path = "src/lib.rs"

[[bin]]
name = "atrium-write"
path = "src/bin/atrium_write.rs"

[dependencies]
navigator-image = { path = "../navigator-image", features = ["office"] }
officina-core = { path = "../officina-core" }
# Writers, protection and the launcher: the readers run in the convert worker.
officina-convert = { path = "../officina-convert", default-features = false }
officina-text = { path = "../officina-text" }
officina-pdf = { path = "../officina-pdf" }
officina-spell = { path = "../officina-spell" }
pergola = { path = "../pergola" }
pergola-richtext = { path = "../pergola-richtext" }
limen = { path = "../limen" }
# Files opened in Write from Scrinium (opening-files.md §6.2).
atrium-open = { path = "../atrium-open" }
libc = "0.2"

# navigator-fonts vendors a one-line fix to pathfinder_simd (see its
# vendor/README.md); a dependent crate must repeat the patch.
[patch.crates-io]
pathfinder_simd = { path = "../navigator-fonts/vendor/pathfinder_simd" }

[profile.release]
# What ships in the bundle: no debug info, symbols stripped.
strip = true

# `--profile profiling`: release code with line tables, for perf and the
# stall probes.
[profile.profiling]
inherits = "release"
debug = 1
strip = false

[dev-dependencies]
# Tests make foreign sample files with the readers' crate.
officina-convert = { path = "../officina-convert", features = ["read"] }
png = "0.17"
