[package]
name        = "tabellarius-macos"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "macOS adapter for Tabellarius's push-delivery role (docs/spec/tabellarius.md). v0 daemon that serves CLASS_TABELLARIUS subscribe/unsubscribe/list ops over Aqueduct. Mints per-subscription keypairs, persists them to disk so apps see stable pub keys across daemon restart. Actual relay connection + wake-on-push are Phase B work; v0 closes the libatrium ABI shape so apps can publish their pubkeys to their own backends and have the keypair survive."
publish     = false

[[bin]]
name = "tabellarius-macos"
path = "src/main.rs"

[dependencies]
aqueduct      = { path = "../aqueduct" }
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
rand          = { version = "0.8", default-features = false, features = ["std", "std_rng"] }

[dev-dependencies]
libatrium = { path = "../libatrium" }
tempfile  = "3"
