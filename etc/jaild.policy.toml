# /etc/atrium/jaild.policy.toml
#
# Atrium jaild allow-list. Single source of truth for what the
# privileged jail-creation broker (jaild) will permit. Spec:
# docs/spec/jaild-policy.md.
#
# Conservative by default. Each entry explicit. No wildcards
# except where called out.

schema_version = 1


# ---------------------------------------------------------------
# Filesystem mount sources permitted to be nullfs-mounted into a
# jail. Children of jaild-jail can only have mounts whose source
# path is in one of these sets, with the matching ro/rw flag.
# ---------------------------------------------------------------
[mount_sources]
ro_paths = [
    # Base system libs + the dynamic linker — the minimal rootfs a
    # per-jail-root app needs to exec (the §9.1 isolation fix; see
    # ostiarius session_rootfs_mounts).
    "/libexec",
    "/lib",
    "/usr/lib",
    # The service-socket directory, mounted whole into a session
    # app's per-jail root (per-cap scoping is a later refinement).
    "/atrium/sockets",

    # Atrium runtime libs, bundles, fonts (read by every jailed
    # process).
    "/usr/local/lib",
    "/usr/local/share/atrium",
    "/usr/local/etc/fonts",
    "/usr/local/share/fonts",

    # Installed Atrium service/app binaries — every jailed service
    # ro-mounts this so its exec target (atrium-memoryd / atrium-memfed
    # / atrium-frescod / ...) is reachable in the jail.
    "/usr/local/bin",

    # Vulkan ICD manifests — the jailed compositor (frescod) reads
    # icd.d/*.json here to find its software/GPU vulkan drivers.
    "/usr/local/share/vulkan",

    # libLLVM.so.19.1 — the lavapipe/radeon vulkan ICDs frescod loads
    # are linked against it (FreeBSD llvm19 port installs it here).
    "/usr/local/llvm19/lib",

    # Auth state — only mounted into vestibulum, but the source
    # must be on the allow-list to be eligible.
    "/etc/master.passwd",
    "/etc/login.conf",
    "/etc/group",
    "/etc/pam.d",

    # Atrium config (jaild policy itself, services manifests).
    "/etc/atrium",

    # Per-capability service-socket directories. Each grants the
    # jail rendezvous with one Atrium service. Bootstrap derives
    # the mount from the manifest's [capabilities] block; jails
    # without the grant simply don't see the directory. See
    # docs/spec/aqueduct.md §6.1.
    "/var/run/atrium/caps/portcullisd/",
    # The Portcullis launch registry (uid -> user, app id), one file, for
    # services that name their peers by uid: choragusd, arcad.
    "/var/run/atrium/app-registry",
    # Arca's courier registry (courier uid -> user, persona, endpoint), one
    # file, written by the courier launcher; read by arcad (arca.md §4.1).
    "/var/run/atrium/courier-registry",
    # Users' approved grants (<user>/policy.toml, 0644), read by choragusd to
    # check audio capabilities. The host identity key here is root 0600.
    "/var/db/atrium",
]
rw_paths = [
    # Aqueduct service-socket directory (all jails that talk to
    # frescod / portcullisd / etc. mount this rw to bind/connect
    # their respective sockets).
    "/var/run/aqueduct",

    # The live service-socket tree. A jailed SERVICE rw-mounts this to
    # BIND its socket under its per-cap subdir (frescod -> fresco/ +
    # fresco-wm/, owned by _frescod); clients ro-mount it to connect.
    # The top dir is root:wheel 0755 so a non-root service can only
    # write its own (pre-chowned) subdir — the rw mount is scoped by
    # those dir perms, not by the mount.
    "/atrium/sockets",

    # Atrium logs.
    "/var/log/atrium",

    # Arca's per-user secret stores (0700 _arca), mounted only into arcad,
    # and its own socket dir: arcad gets that one dir rw, not the whole
    # socket tree.
    "/var/db/arca",
    "/atrium/sockets/arca",

    # choragusd's users' volumes (<user>.toml; _choragus 0700).
    "/var/db/choragus",

    # Atrium shared state — session records, jaild persistent
    # state, etc.
    "/var/run/atrium",
]
rw_patterns = [
    # Per-jail root directories — the per-jail-root isolation fix
    # (§9.1). ostiarius/JaildLauncher creates <id> under here and
    # uses it as the session app's jail path (single-segment glob).
    "/var/lib/atrium/jails/*",

    # Per-user home — mounted only into that user's supervisor
    # jail and into apps the user grants the `home` capability to.
    "/usr/home/*",

    # Per-user persistent state under Atrium control (db, prefs).
    "/var/db/atrium/users/*",
]

# Prefix-match subtrees for atrium-volumes-managed allocation
# paths. atrium-volumes nests two levels deep
# (/var/lib/atrium/storage/jails/<jail>/<vol>); rw_patterns'
# trailing-* glob is single-segment, so we use the prefix
# allow-list here.
rw_subtrees = [
    "/var/lib/atrium/storage/jails/",
]


# ---------------------------------------------------------------
# Devfs rulesets permitted in jail specs. Names are defined in
# /etc/devfs.rules; jaild does not parse those — it just refuses
# names not in this list.
# ---------------------------------------------------------------
[devfs_rulesets]
allowed = [
    "atrium-baseline",   # null, zero, random, urandom, tty
    "atrium-gpu",        # baseline + atrium-gpu0
    "atrium-display",    # atrium-gpu + atrium-display0; pinned to frescod
    "atrium-input",      # baseline + hidraw*, atkbd*, bpsm*; pinned to tactusd
    "atrium-tty",        # baseline + a specific allocated tty
]
# Numeric ruleset ids jaild may mount a jail's devfs with. The rulesets
# themselves live in etc/atrium.devfs.rules (installed and loaded at boot by
# scripts/bootstrap-atrium.sh); jail_set takes a number, the names above are
# operator documentation.
#
# ★★★ jaild also REFUSES an allowed id whose ruleset the kernel does not have
# loaded (no rules). Mounting devfs with an unloaded ruleset number succeeds
# and hides NOTHING — measured 2026-09-22, a jail on unloaded ruleset 20/21/99
# saw the host's raw disks, mem/kmem and bpf. Being on this list is necessary,
# not sufficient.
#
#  4 = devfsrules_jail (FreeBSD-standard, /etc/defaults/devfs.rules) — session
#      apps' per-jail devfs (ostiarius SESSION_DEVFS_RULESET).
# 20 = atrium_governor — basics + /dev/pressure (memoryd, memfed).
# 21 = atrium_gpu      — basics + gpu0 (no display, no input).
# 22 = atrium_app      — basics + pty/fd; portcullis apps and one-shot workers,
#      with each capability's unhide rules applied to that jail's own mount.
# 23 = atrium_display  — atrium_gpu + display0: frescod's alone (pinned below).
# 24 = atrium_audio    — dsp*, mixer*, laminar: lyrad's alone (pinned below).
# 26 = atrium_input    — hidraw*, atkbd*, bpsm*: tactusd's alone (pinned below).
allowed_ids = [4, 20, 21, 22, 23, 24, 26]

# The display belongs to frescod. Only the frescod service may mount the
# ruleset that shows /dev/atrium-display0, and before it starts jaild writes
# the display lease (dev.atrium_gpu_amd_display.N.lease = "atrium-frescod:65010"),
# so the driver refuses every other opener, root on the host included, even
# while frescod restarts. ISOLATION.md "Display lease".
[[devfs_rulesets.pinned]]
id        = 23
jail_name = "atrium-frescod"
exec_path = "/usr/local/bin/atrium-frescod"
uid       = 65010
leases    = ["dev.atrium_gpu_amd_display.0.lease"]

# The sound card belongs to lyrad (lyra-v1.md §3): only the lyrad service may
# mount the ruleset that shows /dev/dsp*. Apps reach audio through choragusd.
[[devfs_rulesets.pinned]]
id        = 24
jail_name = "atrium-lyrad"
exec_path = "/usr/local/bin/atrium-lyrad"
uid       = 65016

# Input devices belong to tactusd (atrium-input.md §2): only the tactusd
# service may mount the ruleset that shows /dev/hidraw*, atkbd*, bpsm*. frescod and apps get
# input from it, never from the devices.
[[devfs_rulesets.pinned]]
id        = 26
jail_name = "atrium-tactusd"
exec_path = "/usr/local/bin/atrium-tactusd"
uid       = 65018


# ---------------------------------------------------------------
# Binary paths jaild may execve. Prefix match.
# ---------------------------------------------------------------
[exec_paths]
allowed_prefixes = [
    "/usr/local/bin/atrium-",
    "/usr/local/sbin/atrium-",
    "/usr/local/share/atrium/apps/",   # installed Atrium apps
]
# ★ One-shot INSTANCE ROOTS (portcullis.md §6.5.4): a jail named `app-...` whose
# root is exactly <instance_root_dir>/<name> runs the entry of an app tree
# portcullis signature-verified and mounted there, so its entry may be any
# absolute path inside that tree (no `..`) rather than one of the prefixes
# above. The only kind of jail that may also take its caller's stdio
# (ExecSpec.stdio). Remove the line to turn the rule off.
instance_root_dir = "/var/lib/atrium/jails"


# ---------------------------------------------------------------
# Arca's couriers (docs/spec/arca.md §5): arca-courierd (root) asks for one
# jail per courier, named <name_prefix><uid> at <instance_root_dir>/<name>,
# running exactly exec_path as that uid. Only these may take their caller's
# stdio besides one-shot instances, and they may lock memory.
# ---------------------------------------------------------------
[couriers]
name_prefix = "system-arca-courier-"
exec_path   = "/usr/local/bin/atrium-arca-courier"
uid_first   = 64000
uid_last    = 64999


# ---------------------------------------------------------------
# Environment variable allow-list for execve. Anything not
# matching is dropped.
# ---------------------------------------------------------------
[env]
allowed_keys = [
    "USER", "HOME", "LOGNAME", "PATH", "SHELL",
    "TERM", "LANG", "LC_ALL", "TZ",
    # Runtime lib search path for services that dlopen libs from the
    # mounted /usr/local/lib (e.g. frescod loading the vulkan loader).
    # A jail can only point this at its own ro, operator-curated mounts,
    # so it adds no library-injection surface.
    "LD_LIBRARY_PATH",
    # stoad's control-socket path (points into its own /atrium/sockets
    # mount). STOA_BROKER defaults correctly so it needs no env.
    "STOA_CTL",
    # stoad's persistent session-state dir (points into its own /atrium-data
    # data volume). Where session metadata + scrollback are persisted (S3a).
    "STOA_STATE",
    # arcad: the system uids allowed to unlock stores (ostiarius) and to
    # grant (Arca's trusted UI). ARCA_ALLOW_UNSIGNED is deliberately NOT
    # here: a jailed arcad can never be told to serve unsigned apps.
    "ARCA_VESTIBULUM_UID",
    "ARCA_UI_UID",
    # arcad and arca-courierd: the web broker's app id and publisher, the
    # one app that issues web tickets (arca.md §8.2).
    "ARCA_WEB_BROKER",
    # arcad: the system services the machine store serves, `name=uid,...`
    # (arca.md §6.4; vinculumd's Bluetooth bonds).
    "ARCA_SERVICES",
]
allowed_prefixes = [
    "ATRIUM_",        # all Atrium-namespaced vars
]


# ---------------------------------------------------------------
# UID / GID constraints.
# ---------------------------------------------------------------
[uid]
min_user_uid        = 1000
max_user_uid        = 65000
allowed_system_uids = [
    # Atrium's system uids sit above the user range and below nobody
    # (65534), clear of base and ports: 65 and 66, reserved here at first,
    # are FreeBSD's _dhcp and uucp.
    65010,   # _frescod: the compositor (fresco-renderer-bundle.sh creates it)
    65011,   # _fresco-render: frescod's window renderers, started for it by
             # portcullisd under the system policy's worker rule
    # 65012 = _atrium-devevents   (reserved)
    # 65013 = _atrium-portcullisd (reserved)
    65014,   # _aqueduct-gpu: the GPU broker (aqueduct-gpu-bundle.sh creates it)
    65015,   # _aqueduct-gpu-app: per-app GPU executors, started for it by
             # portcullisd under the system policy's worker rule
    65016,   # _lyra: the audio engine, lyrad (lyra-service.sh creates it)
    65017,   # _choragus: the audio policy daemon, choragusd
    65018,   # _tactus: the input service, tactusd (tactus-service.sh creates it)
    65020,   # _arca: the secret store (docs/spec/arca.md)
    65022,   # _limen: the embed broker, limend (docs/spec/limen.md); choragusd
             # knows it by this uid (--limen-uid) for embedded players' audio tickets
    65023,   # _nuntius: the system fetcher, started per app by portcullisd
             # (OpenFetcher) under the system worker rule (nuntius-bundle.sh)
    # 65024 = _vinculum        (reserved: Bluetooth host, docs/spec/bluetooth.md §4)
    # 65025 = _vinculum-hci    (reserved: Bluetooth transport, one per controller)
    # 65026 = _vinculum-audio  (reserved: Bluetooth audio profiles)
]

[gid]
allowed_system_gids = [
    # mirrors uid table
    65010,   # _frescod
    65011,   # _fresco-render
    65014,   # _aqueduct-gpu
    65015,   # _aqueduct-gpu-app
    65016,   # _lyra
    65017,   # _choragus
    65018,   # _tactus
    65020,   # _arca
    65022,   # _limen
    65023,   # _nuntius
]


# ---------------------------------------------------------------
# Memory locking (allow.mlock), allowlisted per jail. Arca keeps every
# clear secret in mlocked memory so none reaches swap or the zram
# compressor (docs/spec/arca.md §6.3), and refuses to serve without it.
# ---------------------------------------------------------------
[mlock]
allow_jails = ["atrium-arcad"]


# ---------------------------------------------------------------
# Maximum children.max value any single jail may declare.
# ---------------------------------------------------------------
[children_max]
max = 64


# ---------------------------------------------------------------
# Network policy.
# ---------------------------------------------------------------
[network]
allow_disable = true       # ip4=disable always permitted
allow_host    = false      # cannot share host stack (use VNET or disable)
allowed_addrs_on_lo0 = [
    "127.10.0.0/16",       # loopback range reserved for atrium services
]
# Jails permitted to use ip4=inherit (share the host's network stack). Only
# network-facing system daemons that must bind on/off-host addresses belong
# here; the jail still gets filesystem + process isolation. stoad needs it
# (per-session UDP for remote clients). A future mysqld-class jail would use
# VNET instead (own stack + per-jail firewall).
allow_inherit_jails = [
    "atrium-stoad",
]


# ---------------------------------------------------------------
# GPU driver attestation. Direct-GPU capability cannot be granted
# until the bound driver is `production` AND
# `isolation_test_passed`.
# ---------------------------------------------------------------
[gpu_drivers.attested.atrium-virtio-gpu]
status                  = "production"
isolation_test_passed   = true
isolation_test_date     = "2026-05-07"
isolation_test_commit   = "0000000"          # fill at test-run time
notes = """
D0 path. Isolation enforced by layered chain: kmod per-fd handle
table → virtio-gpu spec context ownership → host venus
per-VkInstance → MoltenVK MTLDevice context → Apple GPU IOMMU on
M4 Max. See docs/spec/gpu-isolation.md.
"""

# Not granted: status is experimental until test_gpu_isolation passes on the
# R9700. The run below was gpusim in the amd64 cloud VM.
[gpu_drivers.attested.atrium-gpu-amd]
status                  = "experimental"
isolation_test_passed   = true
isolation_test_date     = "2026-11-06"
isolation_test_commit   = "8e99b77babe0"
abi_rev                 = 4
notes = """
RDNA4 driver against gpusim 52fe4c7 (display on DCN 4.0.1 registers, D4; display lease; NOTE_RESET; flip on in-fence; display 3.1 span sync groups with flip lock and one VRR range; freed VRAM scrubbed by a kernel GPU fill before reuse, isolation part F). The five 2026-11-03 isolation breaks
are fixed, plus per-queue completions and the hang watchdog (review A2.2,
A2.6; atrium-gpu-amd/ISOLATION.md), VM faults that fail their work at
once and read-only binds (F6 G1), CAP_ISA (ABI rev 4). Shared gfx/compute queues until per-VM
MES queues land.
"""


# ---------------------------------------------------------------
# Named profiles for system services. portcullisd may only ask
# jaild to start a service if the request matches one of these
# stanzas; jaild rejects with EPERM otherwise.
# ---------------------------------------------------------------
[services.frescod]
exec_path             = "/usr/local/bin/atrium-frescod"
allowed_devfs_ruleset = "atrium-display"
required_mounts_ro    = [
    "/usr/local/lib",
    "/usr/local/share/atrium",
    "/usr/local/etc/fonts",
]
required_mounts_rw    = [
    "/var/run/aqueduct",
    "/var/log/atrium",
]
network      = "disable"
uid          = "_frescod"      # the atrium_display ruleset opens its nodes to it
children_max = 0

[services.atrium-devevents]
exec_path             = "/usr/local/bin/atrium-devevents"
allowed_devfs_ruleset = "atrium-input"
required_mounts_ro    = [
    "/usr/local/lib",
]
required_mounts_rw    = [
    "/var/run/aqueduct",
    "/var/log/atrium",
]
network      = "disable"
uid          = "root"
children_max = 0

[services.vestibulum]
exec_path             = "/usr/local/bin/atrium-vestibulum"
allowed_devfs_ruleset = "atrium-baseline"
required_mounts_ro    = [
    "/usr/local/lib",
    "/usr/local/share/atrium",
    "/usr/local/etc/fonts",
    "/etc/master.passwd",
    "/etc/login.conf",
    "/etc/group",
]
required_mounts_rw    = [
    "/var/run/aqueduct",
]
network      = "disable"
uid          = "root"          # needs to read /etc/master.passwd
children_max = 0

[services.atrium-supervisor]
# Per-user supervisor. uid is overridden per-instance to the
# logged-in user; here we just declare "user" rather than a
# specific uid.
exec_path             = "/usr/local/bin/atrium-supervisor"
allowed_devfs_ruleset = "atrium-baseline"
required_mounts_ro    = [
    "/usr/local/lib",
    "/usr/local/share/atrium",
    "/usr/local/etc/fonts",
]
required_mounts_rw    = [
    "/var/run/aqueduct",
    # /usr/home/<user>     filled in per-instance
    # /var/db/atrium/users/<user>     filled in per-instance
]
allowed_extra_mounts_rw = [
    # User-supervisor may also rw-mount these globs at jaild's
    # discretion when portcullisd asks; matched against
    # mount_sources.rw_patterns.
    "/usr/home/*",
    "/var/db/atrium/users/*",
]
network      = "disable"
uid          = "user"          # overridden by request to specific uid
children_max = 32              # for app jails


# ---------------------------------------------------------------
# Constraints for user-launched apps (per-app jails). The actual
# capability set comes from each app's atrium.toml; jaild enforces
# the outer envelope.
# ---------------------------------------------------------------
[apps]
allowed_exec_root         = "/usr/local/share/atrium/apps"
default_devfs_ruleset     = "atrium-baseline"
max_simultaneous_per_user = 32


# ---------------------------------------------------------------
# Per-jail system call filter (docs/spec/jail-sysfil.md §5). A request names
# a class in CreateJailRequest.syscall_profile; jaild hands the kernel the
# resolved lists as sysfil.* jail parameters when it creates the jail, and
# they can never be widened after that. Each class's lists are its includes'
# lists plus its own. A list left out is unrestricted; [] allows nothing.
#
# The base set was learned in log mode (sysfil.mode=1) from
# scripts/sysfil/sysfil-probe (Rust std: threads, files, unix sockets,
# poll, time) launched the way jaild launches (attach, setgroups/setgid/
# setuid, execve inside the jail), plus kqueue/kevent for mio-style event
# loops. Learn a real app's needs the same way:
#   sh scripts/sysfil/learn.sh <class> <binary> [args...]
# Never in an app class: ktrace, ptrace, setcred, jail_*, kqueuex, sigqueue,
# thr_kill2, procctl, aio/lio_listio, sendfile, mount; tty control ioctls
# outside "terminal"; route/key/netlink sockets; IPv6 multicast filter,
# accept-filter, reuseport-LB and KTLS socket options; largepage shm.
# ---------------------------------------------------------------
[sysfil]
mode     = 2        # 1 = log only (development), 2 = deny, 3 = deny + SIGSYS
required = false    # true once every launcher names a class

[sysfil.profiles.base]
syscalls = [
    # process and memory
    "_exit", "getpid", "getppid", "getuid", "geteuid", "getgid", "getegid",
    "issetugid", "mmap", "munmap", "mprotect", "madvise", "minherit",
    "sysarch", "__sysctl", "__sysctlbyname", "getrlimit", "getrusage",
    "cpuset_getaffinity", "cap_getmode", "cap_enter", "cap_rights_limit",
    "cap_ioctls_limit", "cap_fcntls_limit", "exterrctl", "getrandom",
    "umask",
    # the launcher, which runs inside the jail before execve
    "setgroups", "setgid", "setuid", "execve",
    # threads and signals (libthr)
    "thr_new", "thr_exit", "thr_self", "thr_kill", "thr_wake",
    "thr_set_name", "_umtx_op", "rtprio_thread", "sigaltstack",
    "sigprocmask", "sigaction", "sigreturn", "getcontext", "setcontext",
    "sigfastblock", "kill", "sigwait", "sigtimedwait", "sigsuspend",
    # time
    "clock_gettime", "clock_getres", "clock_nanosleep", "nanosleep",
    "gettimeofday",
    # files and directories
    "read", "write", "readv", "writev", "pread", "pwrite", "preadv",
    "pwritev", "open", "openat", "close", "close_range", "lseek", "fstat",
    "fstatat", "fstatfs", "getdirentries", "fcntl", "flock", "fsync",
    "fdatasync", "ftruncate", "dup", "dup2", "pipe2", "chdir", "fchdir",
    "__getcwd", "readlink", "readlinkat", "__realpathat", "mkdir",
    "mkdirat", "rename", "renameat", "unlink", "unlinkat", "rmdir",
    "access", "faccessat", "chmod", "fchmod", "fchmodat", "futimens",
    "utimensat", "symlinkat", "linkat", "posix_fallocate", "ioctl",
    # sockets (the families list decides which kinds)
    "socket", "socketpair", "bind", "listen", "accept", "accept4",
    "connect", "shutdown", "sendto", "recvfrom", "sendmsg", "recvmsg",
    "getsockname", "getpeername", "getsockopt", "setsockopt",
    # waiting
    "poll", "ppoll", "select", "pselect", "kqueue", "kevent",
]
ioctls = [
    "0x20006601",   # FIOCLEX
    "0x20006602",   # FIONCLEX
    "0x4004667f",   # FIONREAD
    "0x8004667e",   # FIONBIO
    "0x402c7413",   # TIOCGETA (isatty)
    "0x40087468",   # TIOCGWINSZ
]
sockopts = [
    "0xffff:4",     # SO_REUSEADDR
    "0xffff:8",     # SO_KEEPALIVE
    "0xffff:128",   # SO_LINGER
    "0xffff:2048",  # SO_NOSIGPIPE
    "0xffff:4097",  # SO_SNDBUF
    "0xffff:4098",  # SO_RCVBUF
    "0xffff:4101",  # SO_SNDTIMEO
    "0xffff:4102",  # SO_RCVTIMEO
    "0xffff:4103",  # SO_ERROR
    "0xffff:4104",  # SO_TYPE
    "0:1",          # LOCAL_PEERCRED (getpeereid); level 0 is also IPPROTO_IP
]
families = ["unix"]

# Fresco renderers, decoders, the Tier-2 executor, Navigator workers.
[sysfil.profiles.renderer]
include = ["base"]

# Ordinary apps.
[sysfil.profiles.app]
include = ["base"]

# Nuntius fetchers and apps with the network capability.
[sysfil.profiles.networked]
include  = ["base"]
families = ["inet", "inet6"]
sockopts = [
    "6:1",          # TCP_NODELAY
    "6:256",        # TCP_KEEPIDLE
    "6:512",        # TCP_KEEPINTVL
    "6:1024",       # TCP_KEEPCNT
    "41:27",        # IPV6_V6ONLY
    "0:3",          # IP_TOS
    "0:4",          # IP_TTL
    "41:4",         # IPV6_UNICAST_HOPS
]

# The shell and what it runs.
[sysfil.profiles.terminal]
include  = ["networked"]
syscalls = [
    "fork", "vfork", "pdfork", "wait4", "wait6", "setsid", "setpgid",
    "getpgid", "getpgrp", "getsid", "copy_file_range", "ktimer_create",
    "ktimer_settime", "ktimer_gettime", "ktimer_delete", "setitimer",
    "getitimer", "setpriority", "getpriority", "chown", "fchown", "lchown",
    "fchownat", "statfs", "getfsstat", "pathconf", "fpathconf",
]
ioctls = [
    "0x20007461",   # TIOCSCTTY
    "0x20007471",   # TIOCNOTTY
    "0x802c7414",   # TIOCSETA
    "0x802c7415",   # TIOCSETAW
