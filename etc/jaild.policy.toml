# ---------------------------------------------------------------
# Memory locking (allow.mlock), allowlisted per jail. Arca keeps every
# clear secret in mlocked memory so none reaches swap or the zram
# compressor (docs/spec/arca.md §6.3), and refuses to serve without it.
# ---------------------------------------------------------------
[mlock]
allow_jails = ["atrium-arcad", "atrium-ssh-agent"]


# ---------------------------------------------------------------
# The Tessera keyring (allow.tessera_keys, registered by tessera.ko). A jail
# with it may load volume keys into the kernel and drop them
# (docs/spec/tessera-encryption.md §4.3). arcad alone: it holds the keys and
# is the keyring's only writer. The kernel refuses every other jail even if
# a devfs ruleset failed to hide /dev/tesserakeys.
# ---------------------------------------------------------------
[tessera_keys]
allow_jails = ["atrium-arcad"]


# ---------------------------------------------------------------
# Maximum children.max value any single jail may declare.
# ---------------------------------------------------------------
[children_max]
max = 64


# ---------------------------------------------------------------
# Network policy.
# ---------------------------------------------------------------
[network]
allow_disable = true       # ip4=disable always permitted
allow_host    = false      # cannot share host stack (use VNET or disable)
allowed_addrs_on_lo0 = [
    "127.10.0.0/16",       # loopback range reserved for atrium services
]
# Jails permitted to use ip4=inherit (share the host's network stack). Only
# network-facing system daemons that must bind on/off-host addresses belong
# here; the jail still gets filesystem + process isolation. stoad needs it
# (per-session UDP for remote clients). A future mysqld-class jail would use
# VNET instead (own stack + per-jail firewall).
allow_inherit_jails = [
    "atrium-stoad",
]


# ---------------------------------------------------------------
# GPU driver attestation. Direct-GPU capability cannot be granted
# until the bound driver is `production` AND
# `isolation_test_passed`.
# ---------------------------------------------------------------
[gpu_drivers.attested.atrium-virtio-gpu]
status                  = "experimental"     # legacy; never attested at a real commit
isolation_test_passed   = false
notes = """
Legacy D0 path (superseded by atrium-gpu-amd), not grantable.
D0 path. Isolation enforced by layered chain: kmod per-fd handle
table → virtio-gpu spec context ownership → host venus
per-VkInstance → MoltenVK MTLDevice context → Apple GPU IOMMU on
M4 Max. See docs/spec/gpu-isolation.md.
"""

# Not granted: status is experimental until test_gpu_isolation passes on the
# R9700. The run below was gpusim in the amd64 cloud VM.
[gpu_drivers.attested.atrium-gpu-amd]
status                  = "experimental"
isolation_test_passed   = true
isolation_test_date     = "2026-11-06"
isolation_test_commit   = "8e99b77babe0"
abi_rev                 = 4
notes = """
RDNA4 driver against gpusim 52fe4c7 (display on DCN 4.0.1 registers, D4; display lease; NOTE_RESET; flip on in-fence; display 3.1 span sync groups with flip lock and one VRR range; freed VRAM scrubbed by a kernel GPU fill before reuse, isolation part F). The five 2026-11-03 isolation breaks
are fixed, plus per-queue completions and the hang watchdog (review A2.2,
A2.6; atrium-gpu-amd/ISOLATION.md), VM faults that fail their work at
once and read-only binds (F6 G1), CAP_ISA (ABI rev 4). Shared gfx/compute queues until per-VM
MES queues land.
"""


# ---------------------------------------------------------------
# Named profiles for system services. portcullisd may only ask
# jaild to start a service if the request matches one of these
# stanzas; jaild rejects with EPERM otherwise.
# ---------------------------------------------------------------
[services.frescod]
exec_path             = "/usr/local/bin/atrium-frescod"
allowed_devfs_ruleset = "atrium-display"
required_mounts_ro    = [
    "/usr/local/lib",
    "/usr/local/share/atrium",
    "/usr/local/etc/fonts",
]
required_mounts_rw    = [
    "/var/run/aqueduct",
    "/var/log/atrium",
]
network      = "disable"
uid          = "_frescod"      # the atrium_display ruleset opens its nodes to it
children_max = 0

[services.atrium-devevents]
exec_path             = "/usr/local/bin/atrium-devevents"
allowed_devfs_ruleset = "atrium-input"
required_mounts_ro    = [
    "/usr/local/lib",
]
required_mounts_rw    = [
    "/var/run/aqueduct",
    "/var/log/atrium",
]
network      = "disable"
uid          = "root"
children_max = 0

[services.vestibulum]
exec_path             = "/usr/local/bin/atrium-vestibulum"
allowed_devfs_ruleset = "atrium-baseline"
required_mounts_ro    = [
    "/usr/local/lib",
    "/usr/local/share/atrium",
    "/usr/local/etc/fonts",
    "/etc/master.passwd",
    "/etc/login.conf",
    "/etc/group",
]
required_mounts_rw    = [
    "/var/run/aqueduct",
]
network      = "disable"
uid          = "root"          # needs to read /etc/master.passwd
children_max = 0

[services.atrium-supervisor]
# Per-user supervisor. uid is overridden per-instance to the
# logged-in user; here we just declare "user" rather than a
# specific uid.
exec_path             = "/usr/local/bin/atrium-supervisor"
allowed_devfs_ruleset = "atrium-baseline"
required_mounts_ro    = [
    "/usr/local/lib",
    "/usr/local/share/atrium",
    "/usr/local/etc/fonts",
]
required_mounts_rw    = [
    "/var/run/aqueduct",
    # /usr/home/<user>     filled in per-instance
    # /var/db/atrium/users/<user>     filled in per-instance
]
allowed_extra_mounts_rw = [
    # User-supervisor may also rw-mount these globs at jaild's
    # discretion when portcullisd asks; matched against
    # mount_sources.rw_patterns.
    "/usr/home/*",
    "/var/db/atrium/users/*",
]
network      = "disable"
uid          = "user"          # overridden by request to specific uid
children_max = 32              # for app jails


# ---------------------------------------------------------------
# Constraints for user-launched apps (per-app jails). The actual
# capability set comes from each app's atrium.toml; jaild enforces
# the outer envelope.
# ---------------------------------------------------------------
[apps]
allowed_exec_root         = "/usr/local/share/atrium/apps"
default_devfs_ruleset     = "atrium-baseline"
max_simultaneous_per_user = 32
# The capability sockets an app jail (class `app`, app-jails-via-jaild.md
# §3.1) may be given read-write: <sockets_dir>/<name>, one directory per
# service an app capability reaches (portcullis-jail apply_socket). A
# portcullisd test checks every name it mounts is listed here.
# Where a classed jail's root may be: an app's (and the console beside
# it) under jails/, a workspace under its owner's, an empty console its
# owner's own. {owner} is the request's class owner.
class_roots = [
    "/var/lib/atrium/jails/*",
    "/var/lib/atrium/workspaces/{owner}/*",
    "/var/lib/atrium/empty/{owner}",
]
# What portcullisd mounts into a classed jail beside its capabilities:
# the owner's own files (folders, personas, workspaces' work, object cache,
# Sheets recovery), document channels, and a workspace's or console's
# tools and base system. Subtrees; `{owner}` is the class's owner.
class_rw_subtrees = [
    "/home/{owner}",
    "/usr/home/{owner}",
    "/atrium/sockets/opens",
]
class_ro_subtrees = [
    "/var/run/atrium/fasti",
    "/var/run/atrium/ide/{owner}",
    "/atrium/sockets/ssh-agent",
    "/var/lib/atrium/apps",
    "/var/lib/atrium/debug",
    "/var/lib/atrium/layers",
    "/var/db/atrium/console",
    "/var/db/atrium/workspace-bin",
    "/bin", "/sbin", "/libexec",
    "/usr/bin", "/usr/sbin", "/usr/include", "/usr/lib32", "/usr/libdata", "/usr/libexec", "/usr/share",
]
sockets_dir = "/atrium/sockets"
sockets = [
    "aqueduct-gpu", "arca", "arca-courier", "audio", "audio-capture",
    "audio-control", "audio-device", "audio-monitor", "bluetooth-control",
    "clipboard", "device-list", "display-settings", "forum-ctl",
    "forum-status", "fresco", "fresco-activation", "fresco-chrome",
    "fresco-wm", "limen", "media-control", "monstrator", "navigator",
    "navigator-page", "network-configure", "network-details", "network-read",
    "network-wifi", "notify", "opifex", "opifex-sheet", "ostiarius-lock",
    "portcullis", "print", "removable-media", "sigillum", "vpn-configure",
    "vpn-read", "vpn-use", "wifi-nearby", "workers",
]


# ---------------------------------------------------------------
# Per-jail system call filter (docs/spec/jail-sysfil.md §5). A request names
# a class in CreateJailRequest.syscall_profile; jaild hands the kernel the
# resolved lists as sysfil.* jail parameters when it creates the jail, and
# they can never be widened after that. Each class's lists are its includes'
# lists plus its own. A list left out is unrestricted; [] allows nothing.
#
# The base set was learned in log mode (sysfil.mode=1) from
# scripts/sysfil/sysfil-probe (Rust std: threads, files, unix sockets,
# poll, time) launched the way jaild launches (attach, setgroups/setgid/
# setuid, execve inside the jail), plus kqueue/kevent for mio-style event
# loops. Learn a real app's needs the same way:
#   sh scripts/sysfil/learn.sh <class> <binary> [args...]
# Never in an app class: ktrace, ptrace, setcred, jail_*, kqueuex, sigqueue,
# thr_kill2, procctl, aio/lio_listio, sendfile, mount; tty control ioctls
# outside "terminal"; route/key/netlink sockets; IPv6 multicast filter,
# accept-filter, reuseport-LB and KTLS socket options; largepage shm.
# ---------------------------------------------------------------
[sysfil]
# 1 = log only, 2 = deny, 3 = deny + SIGSYS.  Log only until the profiles
# have been run against the real apps (scripts/sysfil/learn.sh; the kernel
# logs each missing call as "sysfil: ... would deny ..."); then 2.
mode     = 1
required = false    # true once every launcher names a class

[sysfil.profiles.base]
syscalls = [
    # process and memory
    "_exit", "getpid", "getppid", "getuid", "geteuid", "getgid", "getegid",
    "issetugid", "mmap", "munmap", "mprotect", "madvise", "minherit",
    "sysarch", "__sysctl", "__sysctlbyname", "getrlimit", "getrusage",
    "cpuset_getaffinity", "cap_getmode", "cap_enter", "cap_rights_limit",
    "cap_ioctls_limit", "cap_fcntls_limit", "exterrctl", "getrandom",
    "umask", "getpgrp", "getsid", "getpriority", "sched_yield",
    "msync", "mlock", "munlock",
    # shared memory: SHM_ANON / memfd_create buffers (Lyra rings, Fresco
    # surfaces, the player); largepage objects stay gated by FIOSSHMLPGCNF
    "shm_open2",
    # the launcher, which runs inside the jail before execve: jaild's
    # (setgroups, setgid, setuid) and jail(8)'s setusercontext(3), which also
    # sets the login class, priority, limits and effective ids; jaild then
    # reads the groups back (getgroups) to check the drop took
    "setgroups", "getgroups", "setgid", "setuid", "execve", "setloginclass",
    "setpriority", "setrlimit", "seteuid", "setegid",
    # threads and signals (libthr)
    "thr_new", "thr_exit", "thr_self", "thr_kill", "thr_wake",
    "thr_set_name", "_umtx_op", "rtprio_thread", "sigaltstack",
    "sigprocmask", "sigaction", "sigreturn", "getcontext", "setcontext",
    "sigfastblock", "kill", "sigwait", "sigtimedwait", "sigsuspend",
    "sigpending",
    # time
    "clock_gettime", "clock_getres", "clock_nanosleep", "nanosleep",
    "gettimeofday",
    # files and directories
    "read", "write", "readv", "writev", "pread", "pwrite", "preadv",
    "pwritev", "open", "openat", "close", "close_range", "lseek", "fstat",
    "fstatat", "fstatfs", "getdirentries", "fcntl", "flock", "fsync",
    "fdatasync", "ftruncate", "dup", "dup2", "pipe2", "chdir", "fchdir",
    "__getcwd", "readlink", "readlinkat", "__realpathat", "mkdir",
    "mkdirat", "rename", "renameat", "unlink", "unlinkat", "rmdir",
    "access", "faccessat", "chmod", "fchmod", "fchmodat", "futimens",
    "utimensat", "symlinkat", "linkat", "posix_fallocate", "ioctl",
    "statfs", "pathconf", "fpathconf", "lpathconf",
    # sockets (the families list decides which kinds)
    "socket", "socketpair", "bind", "listen", "accept", "accept4",
    "connect", "shutdown", "sendto", "recvfrom", "sendmsg", "recvmsg",
    "getsockname", "getpeername", "getsockopt", "setsockopt",
    # waiting
    "poll", "ppoll", "select", "pselect", "kqueue", "kevent",
]
ioctls = [
    "0x20006601",   # FIOCLEX
    "0x20006602",   # FIONCLEX
    "0x4004667f",   # FIONREAD
    "0x8004667e",   # FIONBIO
    "0x402c7413",   # TIOCGETA (isatty)
    "0x40087468",   # TIOCGWINSZ
]
sockopts = [
    "0xffff:4",     # SO_REUSEADDR
    "0xffff:8",     # SO_KEEPALIVE
    "0xffff:128",   # SO_LINGER
    "0xffff:2048",  # SO_NOSIGPIPE
    "0xffff:4097",  # SO_SNDBUF
    "0xffff:4098",  # SO_RCVBUF
    "0xffff:4101",  # SO_SNDTIMEO
    "0xffff:4102",  # SO_RCVTIMEO
    "0xffff:4103",  # SO_ERROR
    "0xffff:4104",  # SO_TYPE
    "0:1",          # LOCAL_PEERCRED (getpeereid); level 0 is also IPPROTO_IP
]
families = ["unix"]

# Fasti validates its inherited listener with getsockopt(SO_ACCEPTCONN).
[sysfil.profiles.calendar-store]
include = ["base"]
sockopts = ["0xffff:2"]

# Fresco renderers, decoders, the Tier-2 executor, Navigator workers.
[sysfil.profiles.renderer]
include = ["base"]

# Per-device drivers (sigillum.md §4): Sigillum's FIDO driver. base plus the
# read-only hidraw ioctls it uses; no network families beyond unix (it
# connects once to sigillumd's driver socket, then enters Capsicum).
[sysfil.profiles.device]
include = ["base"]
ioctls = [
    "0x40085520",   # HIDIOCGRAWINFO
    "0x40805521",   # HIDIOCGRAWNAME(128)
    "0x41705570",   # USB_GET_DEVICEINFO (u2f(4): vendor, product, name)
]

# USB driver jails that drive their device through libusb on its ugen node
# (bluetooth.md §8): Vinculum's vinculum-hci, one per Bluetooth controller.
# base plus the libusb20 ugen backend's calls for what vinculum-hci does
# (enumerate, descriptors, configuration, the driver query, transfers,
# clear-stall), read from FreeBSD's lib/libusb/libusb20_ugen20.c with sizes
# from sys/dev/usb/usb_ioctl.h (LP64; the same on arm64 and amd64). Left
# out on purpose: USB_DEVICEENUMERATE (reset), USB_SET_POWER_MODE,
# USB_IFACE_DRIVER_DETACH/ATTACH (dispensatord detaches the base driver),
# port enable/disable, templates, quirks, streams. Enforced ahead of the
# policy-wide mode ([sysfil_class_modes] at the end of this file): a jail
# that tries anything else gets EPERM.
[sysfil.profiles.usb-driver]
include = ["base"]
# eventfd(2): FreeBSD's libusb_init makes its event fd with it (libc's
# eventfd is __specialfd(SPECIALFD_EVENTFD)); found enforcing on the Mac.
syscalls = ["__specialfd"]
ioctls = [
    "0x8010557f",   # USB_READ_DIR (on /dev/usbctl: the device list)
    "0x4004557e",   # USB_GET_PLUGTIME
    "0x40125569",   # USB_GET_DEVICE_DESC
    "0x41705570",   # USB_GET_DEVICEINFO
    "0x40235586",   # USB_GET_DEV_PORT_PATH
    "0xc020556d",   # USB_GET_FULL_DESC (configuration descriptors)
    "0x40045564",   # USB_GET_CONFIG
    "0x80045565",   # USB_SET_CONFIG (a device left unconfigured)
    "0x8004557c",   # USB_IFACE_DRIVER_ACTIVE
    "0xc018556f",   # USB_DO_REQUEST (string descriptors)
    "0x801055c3",   # USB_FS_INIT
    "0x800155c4",   # USB_FS_UNINIT
    "0xc01055c5",   # USB_FS_OPEN
    "0x800155c6",   # USB_FS_CLOSE
    "0x800155c0",   # USB_FS_START
    "0x800155c1",   # USB_FS_STOP
    "0x400155c2",   # USB_FS_COMPLETE
    "0x800155c7",   # USB_FS_CLEAR_STALL_SYNC
]

# The removable-storage FUSE server, atrium-capsa-fuse (device-assignment.md
# §4.6): it holds the partition and /dev/fuse, both opened by jaild, asks the
# partition's geometry, then enters Capsicum. No sockets are ever opened.
[sysfil.profiles.fuse-server]
include = ["base"]
ioctls = [
    "0x40046480",   # DIOCGSECTORSIZE
    "0x40086481",   # DIOCGMEDIASIZE
]

# Network share servers (network-shares.md §4.4 item 3): one per mounted
# share, jailed with its own vnet. They hold /dev/fuse (opened by jaild) and
# one TCP connection to the share's host: base plus inet/inet6 and the TCP
# keepalive options, no disk ioctls and none of networked's IP options.
[sysfil.profiles.share-server]
include  = ["base"]
# The WebDAV server forks a dialer before entering Capsicum (HTTP servers
# close idle connections; capability mode can't open new ones).
syscalls = ["fork", "wait4"]
families = ["inet", "inet6"]
sockopts = [
    "6:1",          # TCP_NODELAY
    "6:256",        # TCP_KEEPIDLE
    "6:512",        # TCP_KEEPINTVL
    "6:1024",       # TCP_KEEPCNT
    "41:27",        # IPV6_V6ONLY
]

# Ordinary apps.
[sysfil.profiles.app]
include = ["base"]

# Nuntius fetchers and apps with the network capability.
#
# ★ The jail's vnet is set up from the host with `ifconfig -j`, `route -j`
# and `sysctl -j` (portcullis-jail), which attach to the jail and so run under
# its filter: hence the interface ioctls, netlink and the read-only module
# queries (learnt in log mode, M0 gate). Setting flags or an address needs
# PRIV_NET_* as the jail's root; the app's own user gets EPERM.
[sysfil.profiles.networked]
include  = ["base"]
families = ["inet", "inet6", "netlink"]
syscalls = ["modstat", "modfnext", "modfind", "kldnext", "kldfirstmod", "kldstat", "kldfind"]
ioctls = [
    "0xc0206911",   # SIOCGIFFLAGS
    "0x80206910",   # SIOCSIFFLAGS (priv)
    "0x8020693c",   # SIOCSIFLLADDR (priv)
    "0xc0206920",   # SIOCGIFINDEX
]
sockopts = [
    "6:1",          # TCP_NODELAY
    "6:256",        # TCP_KEEPIDLE
    "6:512",        # TCP_KEEPINTVL
    "6:1024",       # TCP_KEEPCNT
    "41:27",        # IPV6_V6ONLY
    "0:3",          # IP_TOS
    "0:4",          # IP_TTL
    "41:4",         # IPV6_UNICAST_HOPS
    "6:4",          # TCP_NOPUSH (fetch(3), pkg)
    "270:11",       # NETLINK_EXT_ACK (ifconfig, route)
]

# The shell and what it runs. rfork: posix_spawn(3) is rfork(RFSPAWN)
# (cc runs its compiler and linker that way; M0 gate).
[sysfil.profiles.terminal]
include  = ["networked"]
syscalls = [
    "fork", "vfork", "pdfork", "rfork", "wait4", "wait6", "setsid", "setpgid",
    "getpgid", "getpgrp", "getsid", "copy_file_range", "ktimer_create",
    "ktimer_settime", "ktimer_gettime", "ktimer_delete", "setitimer",
    "getitimer", "setpriority", "getpriority", "chown", "fchown", "lchown", "eaccess", "symlink",
    "fchownat", "statfs", "getfsstat", "pathconf", "fpathconf",
]
ioctls = [
    "0x20007461",   # TIOCSCTTY
    "0x20007471",   # TIOCNOTTY
    "0x802c7414",   # TIOCSETA
    "0x802c7415",   # TIOCSETAW
    "0x802c7416",   # TIOCSETAF
    "0x80087467",   # TIOCSWINSZ
    "0x80047476",   # TIOCSPGRP
    "0x40047477",   # TIOCGPGRP
    "0x40047463",   # TIOCGSID
    "0x4004741a",   # TIOCGETD (stty reads the line discipline first)
]

# Workspaces (dev-tools.md §7.1, dev-tools-plan.md M0): the shell and what it
# runs, plus debugging the workspace's own processes. Set by portcullisd for
# workspace jails only; a manifest naming it is refused. ptrace reaches only
# the workspace's uid in its own jail (allow.unprivileged_proc_debug on that
# jail alone; the host keeps security.bsd.unprivileged_proc_debug=0).
[sysfil.profiles.develop]
include  = ["terminal"]
syscalls = [
    "ptrace", "ktrace", "utrace", "procctl", "thr_kill2", "sigqueue",
    "posix_openpt",
    # pkg, as the workspace jail's root, clears flags on what it replaces
    # (M2); the jail has allow.chflags off, so no system flag can be set.
    "chflags", "lchflags", "fchflags", "chflagsat",
]
# A pty of its own: lldb gives the program it runs one (learnt in log mode,
# M0 gate), and so do tmux and script(1).
ioctls = [
    "0x2000741c",   # TIOCPTMASTER (grantpt, unlockpt)
    "0x80106678",   # FIODGNAME (ptsname)
]

# ---------------------------------------------------------------
# Classes that enforce ahead of [sysfil] mode, once their profile has been
# learned (jail-sysfil.md §5): never looser than that mode. A top-level
# table so that a jaild older than it ignores it (and keeps these classes
# at the policy-wide mode) instead of refusing the policy.
# ---------------------------------------------------------------
[sysfil_class_modes]
usb-driver = 2
