# /etc/atrium/jaild.policy.toml
#
# Atrium jaild allow-list. Single source of truth for what the
# privileged jail-creation broker (jaild) will permit. Spec:
# docs/spec/jaild-policy.md.
#
# Conservative by default. Each entry explicit. No wildcards
# except where called out.

schema_version = 1


# ---------------------------------------------------------------
# Filesystem mount sources permitted to be nullfs-mounted into a
# jail. Children of jaild-jail can only have mounts whose source
# path is in one of these sets, with the matching ro/rw flag.
# ---------------------------------------------------------------
[mount_sources]
ro_paths = [
    # Base system libs + the dynamic linker — the minimal rootfs a
    # per-jail-root app needs to exec (the §9.1 isolation fix; see
    # ostiarius session_rootfs_mounts).
    "/libexec",
    "/lib",
    "/usr/lib",
    # The service-socket directory, mounted whole into a session
    # app's per-jail root (per-cap scoping is a later refinement).
    "/atrium/sockets",

    # Atrium runtime libs, bundles, fonts (read by every jailed
    # process).
    "/usr/local/lib",
    "/usr/local/libexec/atrium/fasti",
    "/usr/local/share/atrium",
    "/usr/local/etc/fonts",
    "/usr/local/share/fonts",

    # Installed Atrium service/app binaries — every jailed service
    # ro-mounts this so its exec target (atrium-memoryd / atrium-memfed
    # / atrium-frescod / ...) is reachable in the jail.
    "/usr/local/bin",

    # Vulkan ICD manifests — the jailed compositor (frescod) reads
    # icd.d/*.json here to find its software/GPU vulkan drivers.
    "/usr/local/share/vulkan",

    # libLLVM.so.19.1 — the lavapipe/radeon vulkan ICDs frescod loads
    # are linked against it (FreeBSD llvm19 port installs it here).
    "/usr/local/llvm19/lib",

    # Auth state — only mounted into vestibulum, but the source
    # must be on the allow-list to be eligible.
    "/etc/master.passwd",
    "/etc/login.conf",
    "/etc/group",
    "/etc/pam.d",

    # Atrium config (jaild policy itself, services manifests).
    "/etc/atrium",

    # The system trust store (public certificates only), for the WebDAV
    # share server (network-shares.md S2).
    "/etc/ssl",

    # Per-capability service-socket directories. Each grants the
    # jail rendezvous with one Atrium service. Bootstrap derives
    # the mount from the manifest's [capabilities] block; jails
    # without the grant simply don't see the directory. See
    # docs/spec/aqueduct.md §6.1.
    "/var/run/atrium/caps/portcullisd/",
    # The Portcullis launch registry (uid -> user, app id), one file, for
    # services that name their peers by uid: choragusd, arcad.
    "/var/run/atrium/app-registry",
    # Sigillum's driver socket directory, the one socket path a security
    # key's driver jail sees (sigillum.md §4).
    "/atrium/sockets/sigillum-dev",
    # Sigillum's client socket directory, for arcad: verify-each-use items
    # are asked of sigillumd first (arca.md §6.2, sigillum.md §8).
    "/atrium/sockets/sigillum",
    # Arca's courier registry (courier uid -> user, persona, endpoint), one
    # file, written by the courier launcher; read by arcad (arca.md §4.1).
    "/var/run/atrium/courier-registry",
    # Users' approved grants (<user>/policy.toml, 0644), read by choragusd to
    # check audio capabilities. The host identity key here is root 0600.
    "/var/db/atrium",
    # Aura (wifi.md §8.3): aura-mlme connects to aura-keys' socket dir;
    # aura-keys connects to arcad's for Wi-Fi credentials.
    "/atrium/sockets/aura-keys",
    "/atrium/sockets/arca",
    # Vinculum (bluetooth.md §5): each controller's vinculum-hci jail
    # connects through vinculumd's transport dir and reads the controller
    # firmware it loads at power-up (Realtek's, unmodified, with its licence).
    "/atrium/sockets/vinculum-hci",
    "/usr/local/share/atrium/firmware/bluetooth",
    "/var/lib/atrium/apps",          # limend: installed manifests (embeds, roles); the share sheet: share-targets and icons
    "/etc/pwd.db",                   # limend: a worker rule's run_as -> uid (no hashes)
]
rw_paths = [
    # Aqueduct service-socket directory (all jails that talk to
    # frescod / portcullisd / etc. mount this rw to bind/connect
    # their respective sockets).
    "/var/run/aqueduct",

    # The live service-socket tree. A jailed SERVICE rw-mounts this to
    # BIND its socket under its per-cap subdir (frescod -> fresco/ +
    # fresco-wm/, owned by _frescod); clients ro-mount it to connect.
    # The top dir is root:wheel 0755 so a non-root service can only
    # write its own (pre-chowned) subdir — the rw mount is scoped by
    # those dir perms, not by the mount.
    "/atrium/sockets",

    # Atrium logs.
    "/var/log/atrium",

    # Arca's per-user secret stores (0700 _arca), mounted only into arcad,
    # and its own socket dir: arcad gets that one dir rw, not the whole
    # socket tree.
    "/var/db/arca",
    "/atrium/sockets/arca",

    # Aura's two daemons (wifi.md §8.3), each binding in its own dir:
    # aura-mlme's mlme.sock, aura-keys' keys.sock.
    "/atrium/sockets/aura",
    "/atrium/sockets/aura-keys",
    # Arca's SSH agent (arca.md §9.1): its control socket and a folder per
    # workspace, which portcullisd mounts read-only into that workspace.
    "/atrium/sockets/ssh-agent",
    # navigatord's ticket socket, the Navigator page jail's one capability
    # (`navigator-page`, navigator-ui.md §2.1).
    "/atrium/sockets/navigator-page",
    # Monstrator, the link opener (opening-links.md §6): monstratord binds
    # in it; apps with `open-uri` and the Navigator connect through it.
    "/atrium/sockets/monstrator",
    # portcullisd's own directory (its socket is world-connectable, peer uid
    # checked): monstratord asks it for link grants.
    "/atrium/sockets/portcullis",
    # frescod's socket and its activation socket: monstratord's sheet.
    "/atrium/sockets/fresco",
    "/atrium/sockets/fresco-activation",
    # Tabula's socket: monstratord's Copy address (personas.md §6).
    "/atrium/sockets/clipboard",
    # The install sheet's: monstratord, for atrium-app: links (L5).
    "/atrium/sockets/opifex-sheet",
    "/atrium/sockets/limen",
    "/atrium/sockets/audio-attribution",

    # vinculumd's sockets (bluetooth.md §5, §10, §13): the controller
    # transport, the trusted UI's control socket and HID devices for tactusd,
    # each peer-uid checked; and its power switch across restarts (machine
    # state only: pairing keys are in Arca's machine store).
    "/atrium/sockets/vinculum-hci",
    "/atrium/sockets/bluetooth-control",
    "/atrium/sockets/bluetooth-hid",
    "/var/db/vinculum",

    # choragusd's users' volumes (<user>.toml; _choragus 0700).
    "/var/db/choragus",

    # sigillumd's users' enrolled login keys (<user>.json; _sigillum 0700,
    # public keys and sign counts only: sigillum.md §16.6).
    "/var/db/sigillum",

    # Atrium shared state — session records, jaild persistent
    # state, etc.
    "/var/run/atrium",
]
rw_patterns = [
    # Fasti gets one publisher's store in the selected persona and the
    # directory for its supervisor-bound Calendar socket (peer UID checked).
    "/usr/home/*/.atrium/apps/.fasti/*",
    "/usr/home/*/.atrium/persona-apps/*/.fasti/*",
    "/home/*/.atrium/apps/.fasti/*",
    "/home/*/.atrium/persona-apps/*/.fasti/*",
    "/root/.atrium/apps/.fasti/*",
    "/root/.atrium/persona-apps/*/.fasti/*",
    "/var/run/atrium/fasti/*",


    # A folder of a USB stick granted into an app's jail: dispensatord's
    # FUSE mount of the stick's own server (device-assignment.md §4.8).
    "/media/.grants/*",

    # Per-jail root directories — the per-jail-root isolation fix
    # (§9.1). ostiarius/JaildLauncher creates <id> under here and
    # uses it as the session app's jail path (single-segment glob).
    "/var/lib/atrium/jails/*",

    # Per-user home — mounted only into that user's supervisor
    # jail and into apps the user grants the `home` capability to.
    "/usr/home/*",

    # A session component's state in the person's home
    # (~/.atrium/state/<component>, homes.md §2; `.atrium` and `state` are
    # root's). root's own home on dev machines, where root logs in.
    "/usr/home/*/.atrium/state/*",
    "/root/.atrium/state/*",

    # Per-user persistent state under Atrium control (db, prefs).
    "/var/db/atrium/users/*",
]

# One app's settings-pane data (curia.md §15), mounted only into a jail
# that runs as the folder's own uid: that app's, or its pane's.
rw_owned_patterns = [
    "/usr/home/*/.atrium/apps/.pane-data/*",
    "/usr/home/*/.atrium/persona-apps/*/.pane-data/*",
    "/home/*/.atrium/apps/.pane-data/*",
    "/home/*/.atrium/persona-apps/*/.pane-data/*",
    "/root/.atrium/apps/.pane-data/*",
    "/root/.atrium/persona-apps/*/.pane-data/*",
]

# Prefix-match subtrees for atrium-volumes-managed allocation
# paths. atrium-volumes nests two levels deep
# (/var/lib/atrium/storage/jails/<jail>/<vol>); rw_patterns'
# trailing-* glob is single-segment, so we use the prefix
# allow-list here.
# A catalog driver's own package folder, read-only, in its jail (one folder
# below, never the drivers folder itself: a driver sees only its own files).
ro_subtrees = [
    "/usr/local/libexec/atrium/drivers/",
]

# A workspace's work, read-only (and noexec) in an editor plugin's jail
# (dev-tools.md §3.8, D28): portcullisd mounts it only for a workspace the
# IDE the plugin serves picked, for a plugin whose manifest asks.
ro_patterns = [
    "/home/*/.atrium/workspaces/*/work",
    "/usr/home/*/.atrium/workspaces/*/work",
]

rw_subtrees = [
    "/var/lib/atrium/storage/jails/",
    # Session components' own state, one folder per person and component
    # (/var/db/atrium/state/<person>/<component>, docs/spec/forum.md §6.1).
    "/var/db/atrium/state/",
]


# ---------------------------------------------------------------
# Devfs rulesets permitted in jail specs. Names are defined in
# /etc/devfs.rules; jaild does not parse those — it just refuses
# names not in this list.
# ---------------------------------------------------------------
[devfs_rulesets]
allowed = [
    "atrium-baseline",   # null, zero, random, urandom, tty
    "atrium-display",    # atrium-gpu + atrium-display0; pinned to frescod
    "atrium-input",      # baseline + atkbd*, bpsm* (+ input hidraw per node); pinned to tactusd
    "atrium-identity",   # baseline (+ one hidraw per jail); pinned to sigillum-fido
    "atrium-tty",        # baseline + a specific allocated tty
    "atrium-wifi-mlme",  # baseline + aura/ctl*; pinned to aura-mlme
    "atrium-wifi-keys",  # baseline + aura/key*; pinned to aura-keys
    "atrium-arca",       # baseline + tesserakeys; pinned to arcad
    "atrium-driver",     # baseline (+ one device per jail); catalog drivers
    "atrium-bluetooth",  # baseline (+ one USB controller per jail); pinned to vinculum-hci
]
# Numeric ruleset ids jaild may mount a jail's devfs with. The rulesets
# themselves live in etc/atrium.devfs.rules (installed and loaded at boot by
# scripts/bootstrap-atrium.sh); jail_set takes a number, the names above are
# operator documentation.
#
# ★★★ jaild also REFUSES an allowed id whose ruleset the kernel does not have
# loaded (no rules). Mounting devfs with an unloaded ruleset number succeeds
# and hides NOTHING — measured 2026-09-22, a jail on unloaded ruleset 20/21/99
# saw the host's raw disks, mem/kmem and bpf. Being on this list is necessary,
# not sufficient.
#
#  4 = devfsrules_jail (FreeBSD-standard, /etc/defaults/devfs.rules) — session
#      apps' per-jail devfs (ostiarius SESSION_DEVFS_RULESET).
# 20 = atrium_governor — basics + /dev/pressure (memoryd, memfed).
# 21 = atrium_gpu      — basics + gpu0 (no display, no input). NOT allowed: no
#      service uses it, and the GPU client node must be reachable only through
#      frescod's pinned ruleset 23 (gpu-security-model.md §2). Pin it to a
#      service before adding it back.
# 22 = atrium_app      — basics + pty/fd; portcullis apps and one-shot workers,
#      with each capability's unhide rules applied to that jail's own mount.
# 23 = atrium_display  — atrium_gpu + display0: frescod's alone (pinned below).
# 24 = atrium_audio    — dsp*, mixer*, laminar: lyrad's alone (pinned below).
# 25 = atrium_bluetooth — basics only: one vinculum-hci jail per Bluetooth
#      controller, shown its own ugen nodes through devfs_grants (pinned below).
# 26 = atrium_input    — atkbd*, bpsm*: tactusd's alone (pinned below). HID
#      nodes are NOT in it: portcullisd shows tactusd each hidraw node the
#      kernel classified as input, in that jail's mount (sigillum.md §5.1).
# 27 = atrium_identity — basics only: one jail per security key, each shown
#      its own hidraw node through the request's devfs_grant (pinned below).
# 28 = atrium_wifi_mlme — basics + aura/ctl*: aura-mlme's alone (pinned below).
# 29 = atrium_wifi_keys — basics + aura/key*: aura-keys' alone (pinned below).
# 32 = atrium_arca     — basics + tesserakeys: arcad's alone (pinned below).
# 33 = atrium_driver   — basics only: the catalog's drivers, one jail per
#      device, each shown its own device through devfs_grant (pinned below).
allowed_ids = [4, 20, 22, 23, 24, 25, 26, 27, 28, 29, 31, 32, 33]

# The display belongs to frescod. Only the frescod service may mount the
# ruleset that shows /dev/atrium-display0, and before it starts jaild writes
# the display lease (dev.atrium_gpu_amd_display.N.lease = "atrium-frescod:65010"),
# so the driver refuses every other opener, root on the host included, even
# while frescod restarts. ISOLATION.md "Display lease".
[[devfs_rulesets.pinned]]
id        = 23
jail_name = "atrium-frescod"
exec_path = "/usr/local/bin/atrium-frescod"
uid       = 65010
leases    = ["dev.atrium_gpu_amd_display.0.lease"]

# The sound card belongs to lyrad (lyra-v1.md §3): only the lyrad service may
# mount the ruleset that shows /dev/dsp*. Apps reach audio through choragusd.
[[devfs_rulesets.pinned]]
id        = 24
jail_name = "atrium-lyrad"
exec_path = "/usr/local/bin/atrium-lyrad"
uid       = 65016

# Input devices belong to tactusd (atrium-input.md §2): only the tactusd
# service may mount the ruleset that shows /dev/hidraw*, atkbd*, bpsm*. frescod and apps get
# input from it, never from the devices.
[[devfs_rulesets.pinned]]
id        = 26
jail_name = "atrium-tactusd"
exec_path = "/usr/local/bin/atrium-tactusd"
uid       = 65018

# Security keys belong to Sigillum's FIDO driver (sigillum.md §4, §5.1): one
# jail per key, named atrium-sigillum-fido-<hidraw unit>, each running the
# driver as _sigillum-dev and shown exactly one node (devfs_grant): the key's
# /dev/u2f/N when u2f(4) drives it (FreeBSD 15+), else its hidraw node.
[[devfs_rulesets.pinned]]
id          = 27
jail_name   = "atrium-sigillum-fido-"
name_prefix = true
exec_path   = "/usr/local/bin/atrium-sigillum-fido"
uid         = 65029
grant_nodes = ["hidraw#", "u2f/#"]   # u2f/N: keys u2f(4) drives (FreeBSD 15+)

# Bluetooth controllers (bluetooth.md §4, §5.3): one jail per controller,
# named atrium-vinculum-hci-<B-A-I>, running the transport as _vinculum-hci,
# shown only that controller's ugen node and its usb/ endpoint directory, so
# vinculumd never touches the radio and cannot send vendor commands that are
# not on the transport's allowlist.
[[devfs_rulesets.pinned]]
id          = 25
jail_name   = "atrium-vinculum-hci-"
name_prefix = true
exec_path   = "/usr/local/bin/atrium-vinculum-hci"
uid         = 65025
grant_nodes = ["ugen#.#", "usb/#.#.0"]

# Removable storage (device-assignment.md §4.6): one Capsa FAT/exFAT server
# jail per USB-disk partition, as _capsa. jaild opens the partition (da#p#
# GPT, da#s# MBR) and /dev/fuse itself and mounts fusefs directly under
# /media; the jail is shown no device node at all.
[[devfs_rulesets.pinned]]
id                = 31
jail_name         = "atrium-capsa-"
name_prefix       = true
exec_path         = "/usr/local/bin/atrium-capsa-fuse"
uid               = 65031
fuse_devices      = ["da#p#", "da#s#", "da#"]  # da#: a stick with no partition table
fuse_mount_prefix = "/media"

# Wi-Fi radios (wifi.md §8.3): the control nodes belong to aura-mlme, the key
# nodes to aura-keys. Neither may mount the other's ruleset, so a parser bug
# in aura-mlme cannot reach keys or EAPOL, and aura-keys cannot scan or send
# management frames.
[[devfs_rulesets.pinned]]
id        = 28
jail_name = "atrium-aura-mlme"
exec_path = "/usr/local/bin/atrium-aura-mlme"
uid       = 65033

[[devfs_rulesets.pinned]]
id        = 29
jail_name = "atrium-aura-keys"
exec_path = "/usr/local/bin/atrium-aura-keys"
uid       = 65032

# The Tessera keyring belongs to arcad (tessera-encryption.md §4.3): only the
# arcad service may mount the ruleset that shows /dev/tesserakeys.
[[devfs_rulesets.pinned]]
id        = 32
jail_name = "atrium-arcad"
exec_path = "/usr/local/bin/atrium-arcad"
uid       = 65020

# Drivers from the package catalog (opifex.md §8.2, decided by Shankar
# 2026-11-18: one shared ruleset, packages never add to this policy). One
# jail per device, named atrium-driver-<package's name>-<instance>, running a
# program from its package's own folder as that package's uid (61000-61499,
# checked unique at install by opifex), shown only the USB device or HID node
# dispensatord grants it.
[[devfs_rulesets.pinned]]
id          = 33
jail_name   = "atrium-driver-"
name_prefix = true
exec_path   = "/usr/local/libexec/atrium/drivers/"
exec_dir    = true
uid         = 61000
uid_last    = 61499
grant_nodes = ["ugen#.#", "usb/#.#.0", "hidraw#"]


# ---------------------------------------------------------------
# Binary paths jaild may execve. Prefix match.
# ---------------------------------------------------------------
[exec_paths]
allowed_prefixes = [
    "/usr/local/bin/atrium-",
    "/usr/local/sbin/atrium-",
    "/usr/local/share/atrium/apps/",   # installed Atrium apps
    "/usr/local/libexec/atrium/drivers/",   # catalog drivers (ruleset 33 holds them to their package folder)
]
# ★ One-shot INSTANCE ROOTS (portcullis.md §6.5.4): a jail named `app-...` whose
# root is exactly <instance_root_dir>/<name> runs the entry of an app tree
# portcullis signature-verified and mounted there, so its entry may be any
# absolute path inside that tree (no `..`) rather than one of the prefixes
# above. The only kind of jail that may also take its caller's stdio
# (ExecSpec.stdio). Remove the line to turn the rule off.
instance_root_dir = "/var/lib/atrium/jails"


# ---------------------------------------------------------------
# Arca's couriers (docs/spec/arca.md §5): arca-courierd (root) asks for one
# jail per courier, named <name_prefix><uid> at <instance_root_dir>/<name>,
# running exactly exec_path as that uid. Only these may take their caller's
# stdio besides one-shot instances, and they may lock memory.
# ---------------------------------------------------------------
[couriers]
name_prefix = "system-arca-courier-"
exec_path   = "/usr/local/bin/atrium-arca-courier"
uid_first   = 64000
uid_last    = 64999

# ---------------------------------------------------------------
# Network share servers (docs/spec/network-shares.md §4.1, §6.1):
# dispensatord asks for one jail per mounted share, named <name_prefix><uid>
# at <instance_root_dir>/<name>, running exactly one of exec_paths (one per
# protocol) as that uid. jaild
# opens /dev/fuse and mounts fusefs at exactly <mount_prefix>/share-<uid>; the
# server gets that descriptor (fd 3) and no device. Its uids are Arca's share
# registry range (arcad::share).
# ---------------------------------------------------------------
[share_servers]
name_prefix  = "system-share-"
exec_paths   = ["/usr/local/bin/atrium-share-sftp", "/usr/local/bin/atrium-share-webdav", "/usr/local/bin/atrium-share-smb"]
uid_first    = 63000
uid_last     = 63499
mount_prefix = "/media"

# ---------------------------------------------------------------
# Trusted sticks' servers (tessera-encryption.md §7.2a): a sealed stick is
# the kernel's to mount, at <media_prefix>/<part>, as its owner's. So that
# apps can be given its folders like any stick's, dispensatord asks for one
# jail per such stick, named <name_prefix><part> at
# <instance_root_dir>/<name>, running exactly exec_path as the owner's uid
# (a person's: uid_first..uid_last, clear of every system range). The jail
# has no filesystem of its own: jaild opens the stick's mount (it must be
# a Tessera mount's root) and hands it over as a directory descriptor, and
# mounts fusefs at exactly <media_prefix>/.sticks/<part>, for grants.
# ---------------------------------------------------------------
[stick_servers]
name_prefix  = "system-stick-"
exec_path    = "/usr/local/bin/atrium-capsa-local"
uid_first    = 1001
uid_last     = 59999
media_prefix = "/media"

# ---------------------------------------------------------------
# Prelum's workers (docs/spec/printing.md §6.1, §6.3): prelumd asks for one
# jail per job conversion (render_exec, no network) and per printer
# connection (ipp_exec, a routed vnet passing only the printer's address and
# port), named <name_prefix><uid> at <instance_root_dir>/<name>, running
# exactly that binary as that uid with prelumd's socket as its stdio.
# ---------------------------------------------------------------
[print_workers]
name_prefix = "system-prelum-"
render_exec = "/usr/local/bin/atrium-prelum-render"
ipp_exec    = "/usr/local/bin/atrium-prelum-ipp"
browse_exec = "/usr/local/bin/atrium-prelum-browse"
uid_first   = 62000
uid_last    = 62499

# ---------------------------------------------------------------
# Crypta's tunnel engines (docs/spec/vpn.md §3): cryptad (root) asks for one
# jail per live tunnel, named <name_prefix><uid> at
# <instance_root_dir>/<name>, running exactly exec_path as that uid with
# cryptad's socket as its stdio and the tunnel's tun as fd 3 (no device
# node). Its network is a routed vnet passing only UDP to the gateway's
# address and port, tagged CRYPTA_OUTER so atrium-net's atrium/vpn anchor
# lets exactly those flows out past block-when-not-connected. No resolver,
# nothing inbound. Only these may tag their flows.
# ---------------------------------------------------------------
[crypta_engines]
name_prefix = "system-crypta-"
exec_path   = "/usr/local/bin/atrium-crypta-wg"
ac_exec_path = "/usr/local/bin/atrium-crypta-ac"
uid_first   = 61000
uid_last    = 61499

# ---------------------------------------------------------------
# Fenestra's sessions (docs/spec/fenestra.md §3.2, §11.3): fenestrad asks
# for one jail per remote viewing session, named <name_prefix><uid> at
# <instance_root_dir>/<name>, running exactly exec_path as that uid with
# fenestrad's link as its stdio and the mint socket as fd 3. Its network is
# a routed vnet whose one grant is a UDP listen port in port_first..
# port_last from a local network: nothing outbound, no peers, no resolver.
# ---------------------------------------------------------------
[fenestra_sessions]
name_prefix = "system-fenestra-"
exec_path   = "/usr/local/bin/atrium-fenestra-session"
uid_first   = 60500
uid_last    = 60599
port_first  = 24300
port_last   = 24315

# ---------------------------------------------------------------
# Environment variable allow-list for execve. Anything not
# matching is dropped.
# ---------------------------------------------------------------
[env]
allowed_keys = [
    "USER", "HOME", "LOGNAME", "PATH", "SHELL",
    "TERM", "LANG", "LC_ALL", "TZ",
    # Runtime lib search path for services that dlopen libs from the
    # mounted /usr/local/lib (e.g. frescod loading the vulkan loader).
    # A jail can only point this at its own ro, operator-curated mounts,
    # so it adds no library-injection surface.
    "LD_LIBRARY_PATH",
    # stoad's control-socket path (points into its own /atrium/sockets
    # mount). STOA_BROKER defaults correctly so it needs no env.
    "STOA_CTL",
    # stoad's persistent session-state dir (points into its own /atrium-data
    # data volume). Where session metadata + scrollback are persisted (S3a).
    "STOA_STATE",
    # arcad: the system uids allowed to unlock stores (ostiarius) and to
    # grant (Arca's trusted UI). ARCA_ALLOW_UNSIGNED is deliberately NOT
    # here: a jailed arcad can never be told to serve unsigned apps.
    "ARCA_VESTIBULUM_UID",
    "ARCA_UI_UID",
    # arcad and arca-courierd: the web broker's app id and publisher, the
    # one app that issues web tickets (arca.md §8.2).
    "ARCA_WEB_BROKER",
    # arcad and limend: trusted signed Mail publisher for the S/MIME path.
    "ARCA_MAIL_PUBLISHER",
    # sigillumd: the system uids that may ask VerifyUser (Arca, ostiarius)
    # and the web broker's app id and publisher, the one app that may run
    # WebAuthn for any RP ID (sigillum.md §7.1). Socket paths and the
    # driver/UI uids are compiled in and deliberately not settable here.
    "SIGILLUM_ARCA_UID",
    "SIGILLUM_OSTIARIUS_UID",
    "SIGILLUM_WEB_BROKER",
    # sigillumd: the mail apps that may sign mail with a token (S/MIME).
    "SIGILLUM_MAIL_SIGNERS",
    # sigillumd: where users' enrolled login keys are kept (§16.6).
    "SIGILLUM_KEY_DIR",
    # arcad: the system services the machine store serves, `name=uid,...`
    # (arca.md §6.4; vinculumd's Bluetooth bonds).
    "ARCA_SERVICES",
]
allowed_prefixes = [
    "ATRIUM_",        # all Atrium-namespaced vars
]


# ---------------------------------------------------------------
# UID / GID constraints.
# ---------------------------------------------------------------
[uid]
min_user_uid        = 1000
max_user_uid        = 65000
allowed_system_uids = [
    65055,   # _fasti: Calendar store service
    65056,   # _imagedec: the system's image decoder, started per call by
             # portcullisd (SystemWorker) under the system worker rule
             # (image-decode-bundle.sh; app-composition.md C6)
    # Atrium's system uids sit above the user range and below nobody
    # (65534), clear of base and ports: 65 and 66, reserved here at first,
    # are FreeBSD's _dhcp and uucp.
    65010,   # _frescod: the compositor (fresco-renderer-bundle.sh creates it)
    65011,   # _fresco-render: frescod's window renderers, started for it by
             # portcullisd under the system policy's worker rule
    # 65012 = _atrium-devevents   (reserved)
    # 65013 = _atrium-portcullisd (reserved)
    65014,   # _aqueduct-gpu: the GPU broker (aqueduct-gpu-bundle.sh creates it)
    65015,   # _aqueduct-gpu-app: per-app GPU executors, started for it by
             # portcullisd under the system policy's worker rule
    65016,   # _lyra: the audio engine, lyrad (lyra-service.sh creates it)
    65017,   # _choragus: the audio policy daemon, choragusd
    65018,   # _tactus: the input service, tactusd (tactus-service.sh creates it)
    65020,   # _arca: the secret store (docs/spec/arca.md)
    65022,   # _limen: the embed broker, limend (docs/spec/limen.md); choragusd
             # knows it by this uid (--limen-uid) for embedded players' audio tickets
    65023,   # _nuntius: the system fetcher, started per app by portcullisd
             # (OpenFetcher) under the system worker rule (nuntius-bundle.sh)
    65024,   # _vinculum: the Bluetooth host, vinculumd (docs/spec/bluetooth.md §4;
             # vinculum-service.sh creates it)
    65025,   # _vinculum-hci: the Bluetooth transport, one jail per controller,
             # started by dispensatord (vinculum/etc/devices.d/25-vinculum.toml)
    # 65026 = _vinculum-audio  (reserved: Bluetooth audio profiles, B5)
    65027,   # _hospes-cdm: content decryption module hosts, started per app by
             # portcullisd (OpenCdm) under the system worker rule (hospes-cdm-bundle.sh)
    65028,   # _sigillum: Sigillum's broker, sigillumd (docs/spec/sigillum.md §4)
    65029,   # _sigillum-dev: Sigillum's per-device drivers, one jail each,
             # started by portcullisd's identity-device agent (sigillum-service.sh)
    65030,   # _sigillum-ui: Sigillum's trusted sheets
    65031,   # _capsa: removable-storage FUSE servers, one jail per partition,
             # started by dispensatord (capsa-service.sh creates it)
    65032,   # _aura-keys: Aura's key daemon, aura-keys (wifi.md §8.3)
    65033,   # _aura: Aura's MLME daemon, aura-mlme (docs/spec/wifi.md §8.3)
    # 65034 = _atrium-lease    (atrium-net's DHCP/RA parser: chroot + setuid +
    #                           Capsicum by atrium-net, no jail; atrium-net.md §5)
    # 65036 = _atrium-netconf  (atrium-net's settings front, same, §7.1)
    65035,   # _navpage: the Navigator's page children, one jail per page, started
             # by limend under the system worker rule (navigator-page-bundle.sh)
    65037,   # _navui: the Navigator's window, started by navigatord under the
             # system worker rule (navigator-ui-bundle.sh, navigator-ui.md §2.3a)
    65038,   # _monstrator: the link opener, monstratord (opening-links.md §6;
             # monstrator-service.sh creates it)
    # 65041 = _opifex          (opifexd's archive worker, opifex-check: chroot +
    #                           setuid by opifexd itself, no jail; opifex.md §7.2)
    65042,   # _opifexsheet: the install sheet, opifex-sheetd (opifex.md §7.1;
             # opifex-sheet-service.sh creates it)
    65044,   # _egress: a `registries` workspace's proxy, nuntius-egress, one
             # jail per running workspace, started by portcullisd under the
             # system worker rule (nuntius-egress-bundle.sh; dev-tools.md §5.2)
    65045,   # _share: the share sheet, Limen's `share` provider
             # (share-sheet.md; share-sheet-service.sh creates it)
    65047,   # _arca-ssh: Arca's SSH agent, atrium-ssh-agent (arca.md §9.1;
             # ssh-agent-service.sh creates it)
    # 65048 = _atrium-probe    (atrium-net's connectivity probe: chroot + setuid
    #                           + Capsicum, no jail; atrium-net.md §4.2)
    # 65049 = _atrium-mdns     (atrium-net's .local answerer, same, §6.1)
    # 65052 = _crypta-key      (cryptad's Arca key helper: setuid by cryptad
    #                           itself, no jail; vpn.md "V1 as built")
    # 65054 = _crypta-ctl      (cryptad's settings front, atrium-crypta-ctl:
    #                           setuid + Capsicum by itself, no jail; vpn.md §7.2)
]

[gid]
allowed_system_gids = [
    65055,   # _fasti
    65056,   # _imagedec
    # mirrors uid table
    65010,   # _frescod
    65011,   # _fresco-render
    65014,   # _aqueduct-gpu
    65015,   # _aqueduct-gpu-app
    65016,   # _lyra
    65017,   # _choragus
    65018,   # _tactus
    65020,   # _arca
    65022,   # _limen
    65023,   # _nuntius
    65024,   # _vinculum
    65025,   # _vinculum-hci
    65027,   # _hospes-cdm
    65028,   # _sigillum
    65029,   # _sigillum-dev
    65030,   # _sigillum-ui
    65031,   # _capsa
    65032,   # _aura-keys
    65033,   # _aura
    65035,   # _navpage
    65037,   # _navui
    65038,   # _monstrator
    65042,   # _opifexsheet
    65044,   # _egress
    65045,   # _share
