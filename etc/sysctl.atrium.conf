# sysctl.atrium.conf -- kernel hardening knobs every Atrium host sets.
#
# Installed as /etc/sysctl.conf.local
# by scripts/kernel-hardening.sh install.  scripts/kernel-hardening.sh check
# reads the live values back and fails on any mismatch.
#
# Rationale: docs/reviews/2026-11-07-freebsd-kernel-security-rust.md step 0
# and docs/spec/kernel-hardening.md.  The kernel side (stripped ATRIUM config,
# INIT_ALL=zero) lives in atrium-os/freebsd-src: sys/conf/std.atrium.

# Debugging other processes (ptrace, procfs, ktrace of another process) is
# root only.  Removes unprivileged reach to the ptrace/exec advisory rows.
security.bsd.unprivileged_proc_debug=0

# No mapping may be writable and executable at once.  Atrium's shader JIT
# (atrium-spv-loader jitmap.rs) maps RW, copies, then mprotects RX, so it is
# unaffected.
kern.elf64.allow_wx=0

# A process sees only its own uid's and gid's processes and sockets, and a
# jail's processes are invisible from a parent that is not root.
security.bsd.see_other_uids=0
security.bsd.see_other_gids=0
security.bsd.see_jail_proc=0

# The kernel message buffer can carry kernel addresses: root only.
security.bsd.unprivileged_read_msgbuf=0

# No hard links to files the caller does not own.
security.bsd.hardlink_check_uid=1
security.bsd.hardlink_check_gid=1

# Random PIDs.
kern.randompid=1

# ASLR (all on by default on 64-bit FreeBSD; set explicitly so `check`
# catches a regression).
kern.elf64.aslr.enable=1
kern.elf64.aslr.pie_enable=1
kern.elf64.aslr.stack=1
kern.elf64.aslr.shared_page=1
kern.elf64.nxstack=1

# No KTLS: Atrium's TLS is rustls in user space.  KERN_TLS is compiled out of
# the ATRIUM kernels; on a GENERIC kernel this turns it off.
kern.ipc.tls.enable=0
