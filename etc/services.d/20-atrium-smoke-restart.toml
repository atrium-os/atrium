# /etc/atrium/services.d/20-atrium-smoke-restart.toml
#
# V2 smoke service: an exec'd jail that exits cleanly after each
# launch, with restart = "always" so the supervisor relaunches
# every cycle. Used to verify the kqueue + EVFILT_PROCDESC +
# restart loop end-to-end.

enabled       = true
name          = "atrium-smoke-restart"
path          = "/var/lib/atrium/jails/atrium-smoke-restart"   # a real per-jail root; jaild refuses "/"
children_max  = 0
devfs_ruleset = 0

# Minimal per-jail rootfs (portcullis.md §9.1): the dynamic linker, the
# libraries the exec target links (ldd: all under /lib), and the binary.
[[mounts]]
source = "/libexec"
dest   = "libexec"
kind   = "ro_nullfs"
[[mounts]]
source = "/lib"
dest   = "lib"
kind   = "ro_nullfs"
[[mounts]]
source = "/usr/lib"
dest   = "usr/lib"
kind   = "ro_nullfs"
[[mounts]]
source = "/usr/local/bin"
dest   = "usr/local/bin"
kind   = "ro_nullfs"
[[mounts]]
source = "/etc/atrium"
dest   = "etc/atrium"
kind   = "ro_nullfs"

[exec]
path = "/usr/local/bin/atrium-jaild"
argv = ["atrium-jaild", "check-policy",
        "--policy", "/etc/atrium/jaild.policy.toml"]
uid  = 1001
gid  = 1001

[[exec.env]]
key   = "PATH"
value = "/bin:/usr/bin"

[supervision]
restart                 = "always"
restart_after_secs      = 1
max_restarts_per_minute = 30
