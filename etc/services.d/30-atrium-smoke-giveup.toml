# /etc/atrium/services.d/30-atrium-smoke-giveup.toml
#
# V3 smoke service: always-fast-fail. Every launch exits cleanly
# in ~10 ms, well under min_lifetime_for_success_secs. Combined
# with restart = "always" + max_consecutive_failures = 3, the
# supervisor should give up after the third consecutive
# fast-failure, log a PERMANENTLY FAILED error, and stop trying
# (rather than the V2 behavior of restarting forever).

enabled       = true
name          = "atrium-smoke-giveup"
path          = "/var/lib/atrium/jails/atrium-smoke-giveup"   # a real per-jail root; jaild refuses "/"
children_max  = 0
devfs_ruleset = 0

# Minimal per-jail rootfs (portcullis.md §9.1): the dynamic linker, the
# libraries the exec target links (ldd: all under /lib), and the binary.
[[mounts]]
source = "/libexec"
dest   = "libexec"
kind   = "ro_nullfs"
[[mounts]]
source = "/lib"
dest   = "lib"
kind   = "ro_nullfs"
[[mounts]]
source = "/usr/lib"
dest   = "usr/lib"
kind   = "ro_nullfs"
[[mounts]]
source = "/usr/local/bin"
dest   = "usr/local/bin"
kind   = "ro_nullfs"
[[mounts]]
source = "/etc/atrium"
dest   = "etc/atrium"
kind   = "ro_nullfs"

[exec]
path = "/usr/local/bin/atrium-jaild"
argv = ["atrium-jaild", "check-policy",
        "--policy", "/etc/atrium/jaild.policy.toml"]
uid  = 1001
gid  = 1001

[[exec.env]]
key   = "PATH"
value = "/bin:/usr/bin"

[supervision]
restart                       = "always"
restart_after_secs            = 1
# Fast-fail mode: small budget. Each launch dies in ~10 ms,
# costing ~5s deficit per attempt → ~3 retries before give-up.
failure_budget_secs           = 12
min_lifetime_for_success_secs = 5
