# /etc/atrium/services.d/90-atrium-smoke-aq.toml
#
# End-to-end aqueduct smoke. Validates the full chain spec'd in
# `docs/spec/aqueduct.md` §6 and `storage.md` §6.2:
#
#   bootstrap reads [capabilities] attach_mount = true → derives a
#       ro_nullfs mount of /var/run/atrium/caps/portcullisd/
#       → /atrium/sockets/portcullisd/ in the jail.
#   bootstrap launches the jail with that mount + the exec
#       being the aqueduct client itself (atrium-portcullisd-aq).
#   inside the jail: the client opens
#       /atrium/sockets/portcullisd/portcullisd.sock, sends a
#       CLASS_PORTCULLIS / OP_ATTACH_MOUNT request, gets back
#       MountReply::Ok.
#   on the host: portcullisd-daemon receives the request, runs
#       this manifest's [capabilities] gate, forwards to jaild,
#       jaild applies the runtime nullfs mount.
#
# This is the first time anything Atrium-shaped runs aqueduct
# end-to-end in the production socket topology — capability =
# directory mount, no daemon-side trust check on the path.
#
# uid 1099, not the 1001 every other smoke uses. portcullisd maps a peer
# uid back to exactly one manifest; with nine manifests on 1001 it refused
# the attach ("peer uid 1001 matches 9 manifests … cannot determine owning
# jail"), so this smoke had been failing before it tested anything.

enabled       = true
name          = "atrium-aq-photoeditor"
path          = "/var/lib/atrium/jails/atrium-aq-photoeditor"   # a real per-jail root; jaild refuses "/"
children_max  = 0
devfs_ruleset = 0

# Minimal per-jail rootfs (portcullis.md §9.1): the dynamic linker, the
# libraries the exec target links (ldd: all under /lib), and the binary.
[[mounts]]
source = "/libexec"
dest   = "libexec"
kind   = "ro_nullfs"
[[mounts]]
source = "/lib"
dest   = "lib"
kind   = "ro_nullfs"
[[mounts]]
source = "/usr/lib"
dest   = "usr/lib"
kind   = "ro_nullfs"
[[mounts]]
source = "/usr/local/bin"
dest   = "usr/local/bin"
kind   = "ro_nullfs"

[exec]
# attach + linger 60s. The linger gives a SIGTERM-driven
# shutdown smoke time to interrupt before the service exits
# naturally. With restart="never" and a normal aq exit, the
# service still retires cleanly after the sleep ends.
path = "/usr/local/bin/atrium-portcullisd-aq"
argv = ["atrium-portcullisd-aq",
        "attach", "atrium-aq-photoeditor",
        "/var/lib/atrium/storage/jails/atrium-attach-source",
        "/atrium-via-aq",
        "rw_nullfs",
        "--sleep-after", "60"]
uid  = 1099
gid  = 1099

[[exec.env]]
key   = "PATH"
value = "/bin:/usr/bin"

[capabilities]
attach_mount         = true
attach_mount_sources = ["/var/lib/atrium/storage/jails/"]

[supervision]
restart                       = "never"
failure_budget_secs           = 0
min_lifetime_for_success_secs = 1
