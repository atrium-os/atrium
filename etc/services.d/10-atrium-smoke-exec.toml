# /etc/atrium/services.d/10-atrium-smoke-exec.toml
#
# V1 smoke service: an exec'd jail running `atrium-jaild
# check-policy` as a 1001:1001 user, exits cleanly. Validates
# the full V1a path (mounts + pdfork + execve + SCM_RIGHTS for
# procdesc).

enabled       = true
name          = "atrium-smoke-exec"
path          = "/var/lib/atrium/jails/atrium-smoke-exec"   # a real per-jail root; jaild refuses "/"
children_max  = 0
devfs_ruleset = 0          # 0 = inherit; production uses non-zero

# Minimal per-jail rootfs (portcullis.md §9.1): the dynamic linker, the
# libraries the exec target links (ldd: all under /lib), and the binary.
[[mounts]]
source = "/libexec"
dest   = "libexec"
kind   = "ro_nullfs"
[[mounts]]
source = "/lib"
dest   = "lib"
kind   = "ro_nullfs"
[[mounts]]
source = "/usr/lib"
dest   = "usr/lib"
kind   = "ro_nullfs"
[[mounts]]
source = "/usr/local/bin"
dest   = "usr/local/bin"
kind   = "ro_nullfs"
[[mounts]]
source = "/etc/atrium"
dest   = "etc/atrium"
kind   = "ro_nullfs"

[exec]
path = "/usr/local/bin/atrium-jaild"
argv = ["atrium-jaild", "check-policy",
        "--policy", "/etc/atrium/jaild.policy.toml"]
uid  = 1001
gid  = 1001

[[exec.env]]
key   = "PATH"
value = "/bin:/usr/bin"
