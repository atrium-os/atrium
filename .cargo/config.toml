# Cross-compile config for aarch64-unknown-freebsd (Tier-3 rustc target).
#
# Strategy: explicit linker invocation via rust-lld, with FreeBSD's CRT
# objects (Scrt1.o, crti.o, crtbeginS.o, crtendS.o, crtn.o) added as
# link args. macOS's bundled clang doesn't ship aarch64-freebsd support
# as a cross target, so we drive the linker ourselves.
#
# - Scrt1.o provides _start + `environ` + __progname (needed by libc).
# - crti.o / crtn.o bracket the .init / .fini sections.
# - crtbeginS.o / crtendS.o register C++ static dtors etc. (S = shared/PIE).
# - --dynamic-linker is FreeBSD's rtld, NOT Linux's /lib/ld-linux-*.
# - build-std rebuilds Rust std for the target (Tier-3 has no prebuilt std).

[target.aarch64-unknown-freebsd]
linker = "rust-lld"
rustflags = [
    "-C", "link-arg=--sysroot=/Users/girivs/src/bsd/sysroot",
    "-C", "link-arg=-L/Users/girivs/src/bsd/sysroot/lib",
    "-C", "link-arg=-L/Users/girivs/src/bsd/sysroot/usr/lib",
    "-C", "link-arg=--dynamic-linker=/libexec/ld-elf.so.1",

    # FreeBSD CRT objects, in the order ld(1) wants them.
    "-C", "link-arg=/Users/girivs/src/bsd/sysroot/usr/lib/Scrt1.o",
    "-C", "link-arg=/Users/girivs/src/bsd/sysroot/usr/lib/crti.o",
    "-C", "link-arg=/Users/girivs/src/bsd/sysroot/usr/lib/crtbeginS.o",
    "-C", "link-arg=-lc",
    "-C", "link-arg=/Users/girivs/src/bsd/sysroot/usr/lib/crtendS.o",
    "-C", "link-arg=/Users/girivs/src/bsd/sysroot/usr/lib/crtn.o",
]

[unstable]
build-std = ["std", "panic_abort"]
