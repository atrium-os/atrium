[package]
name = "memfed"
version = "0.1.0"
edition = "2021"
description = "Atrium memory federation — water-fill shared RAM across jails by weight, enforced as per-jail RCTL memoryuse caps (the proactive containment layer)"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "memfed"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# The portcullisd app protocol — used in --broker mode to send GovernSetRctl to
# portcullisd (which forwards to jaild) instead of running rctl(8) directly, so a
# *jailed* memfed can set per-jail caps across jail boundaries. §9.5.
portcullis-ipc = { path = "../portcullis/portcullis-ipc" }
