# DNS over TLS to the machine's own servers (docs/spec/atrium-net.md §6).
# Without a bundle unbound takes any certificate, so atrium-net refuses
# DNS over TLS until this is set. The bundle is a copy of /etc/ssl/cert.pem
# inside unbound's chroot, so a reload (after chroot) still finds it.
# Installed as /var/unbound/conf.d/atrium-tls.conf by atrium-net-service.sh.
server:
    tls-cert-bundle: "/var/unbound/atrium-ca.pem"
