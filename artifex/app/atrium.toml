# Artifex (docs/spec/dev-tools.md §3.4, dev-tools-plan.md M11): the code
# editor. It edits the `work` of workspaces the person picks in it (a press;
# mounted at /work/<name>) and runs builds, git and language servers in the
# workspace with `workspace-exec`. It holds no toolchain and no network of
# its own. The terminal button opens the picked workspace's terminal.
[app]
id          = "org.atrium.artifex"
name        = "Artifex"
version     = "0.1.0"
entry       = "bin/artifex"
description = "Edit code in your workspaces, build and run it there."
icon        = "code"

[capabilities]
graphics       = "fresco"
workspace-exec = true
clipboard      = true
network        = "none"
# Asset previews (dev-tools.md §3.5): pictures are decoded by the system's
# image decoder in a jail of its own, never in Artifex.
decoders       = ["image"]
# Limen: only its plugins (dev-tools.md §3.8). The terminal button asks
# portcullisd for the workspace's console, not an embed.
embeds         = ["editor-extension"]

[supervision]
restart   = "on-crash"
instances = "single"
