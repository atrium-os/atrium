[package]
name = "artifex"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Artifex, Atrium's code editor: edits a workspace's work and runs builds, git and language servers in the workspace (dev-tools.md §3.4, plan M11)."

[lib]
name = "artifex"
path = "src/lib.rs"

[[bin]]
name = "artifex"
path = "src/main.rs"

[dependencies]
artifex-syntax = { path = "../syntax" }
pergola = { path = "../../pergola" }
# Plugins: editor-extension embeds (dev-tools.md §3.8).
limen = { path = "../../limen" }
fresco-protocol = { path = "../../fresco-protocol" }
portcullis-ipc = { path = "../../portcullis/portcullis-ipc" }
# Previews: the system's image decoder, never a decoder in Artifex.
atrium-assets = { path = "../../sdk/atrium-assets" }
atrium-worker = { path = "../../sdk/atrium-worker" }
serde_json = "1"
toml = "0.8"
libc = "0.2"
# The Package view hands the install sheet a descriptor (opifex.md §7.4).
atrium-fdpass = { path = "../../atrium-fdpass" }

[dev-dependencies]
# The dock's own check, to prove what the icon editor writes is drawn.
atrium-icon = { path = "../../sdk/atrium-icon" }
