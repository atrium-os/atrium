[package]
name        = "arcad"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
publish     = false
description = "Arca, the system secret store (docs/spec/arca.md): the daemon. Identity from the kernel peer uid and the launch registry; keys used, never read; app-held values only with a user grant. No network."

[lib]
name = "arcad"
path = "src/lib.rs"

[[bin]]
name = "arcad"
path = "src/bin/arcad.rs"

[features]
# Run the native S/MIME test with host OpenSSL 3. FreeBSD uses base libcrypto.
host-openssl-tests = []
# Compiles the synthetic gate only. No socket or UI dispatch is enabled.
legacy-smime-prototype = ["dep:mail-smime", "dep:subtle"]
# Integration lab only. Daemon dispatch requires a separate synthetic setup.
legacy-smime-integration = ["dep:subtle", "dep:mail-smime", "dep:portcullis-ipc"]

# Signed synthetic HTTPS fixture only, with no default build or production route.
legacy-jmap-worker = ["legacy-smime-integration", "dep:mail-proto", "dep:serde", "dep:serde_json", "dep:rustls"]

[dependencies]
arca-store      = { path = "../arca-store" }
portcullis-peer = { path = "../../portcullis/portcullis-peer" }
ed25519-dalek   = { version = "2", default-features = false, features = ["zeroize"] }
x25519-dalek    = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize         = "1"
sigillum-proto  = { path = "../../sigillum/sigillum-proto" }
p256            = { version = "0.13", features = ["ecdsa"] }
libc            = "0.2"
getrandom       = { version = "0.2", features = ["std"] }
sha2            = "0.10"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
psl = "2"

mail-smime      = { path = "../../mail/mail-smime", optional = true, features = ["legacy-receive-prototype"] }
portcullis-ipc = { path = "../../portcullis/portcullis-ipc", optional = true }
subtle         = { version = "2.6", optional = true }

mail-proto = { path = "../../mail/mail-proto", optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[dev-dependencies]
mail-proto = { path = "../../mail/mail-proto" }
serde = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
libc = "0.2"

[[bin]]
name = "arca-probe"
path = "src/bin/arca-probe.rs"


[[bin]]
name = "arca-jmap-proof"
path = "src/bin/arca-jmap-proof.rs"
required-features = ["legacy-jmap-worker"]
