[package]
name = "frescod"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Fresco scene-server daemon for FreeBSD — Vulkan SPIR-V bundle dispatch + atrium-gpu-rs scanout + envelope-based wire protocol."

[[bin]]
name = "frescod"
path = "src/main.rs"

[[bin]]
name = "frescod-vulkan-smoke"
path = "src/bin/vulkan_smoke.rs"

# Aqueduct-gpu smoke test: paint a fresco-protocol scene directly to
# the scanout BO via the new aqueduct-gpu stack (no venus, no
# HeadlessRenderer, no fresco-vulkan). Intermediate target between
# the bridge's PNG demo and the eventual frescod main-binary swap.
[[bin]]
name = "frescod-aqueduct-smoke"
path = "src/bin/aqueduct_smoke.rs"

# Full frescod rewire: multi-window, fresco-protocol clients,
# input readers — but drives the aqueduct-gpu stack instead of
# fresco-vulkan's HeadlessRenderer. Coexists with the venus-based
# `frescod` binary during transition.
[[bin]]
name = "frescod-aqueduct"
path = "src/bin/frescod_aqueduct.rs"

[[bin]]
name = "lane-client"
path = "src/bin/lane_client.rs"

# Headless WM harness — the socket server + EnvelopeFrontend without the GPU,
# for exercising the F0 window-management path over a real socket in-VM.
[[bin]]
name = "frescod-wm-harness"
path = "src/bin/frescod_wm_harness.rs"

# One client connection's window renderer, spawned by frescod in split
# mode (F4b, docs/spec/fresco-f4-split.md).
[[bin]]
name = "fresco-renderer"
path = "src/bin/fresco_renderer.rs"

[features]
# Compile the compute renderer's kernels in-process (Cranelift) when
# atrium-spv-compile is not installed.
cranelift = ["fresco-compute/cranelift"]

[dependencies]
atrium-gpu-rs       = { path = "../atrium-gpu-rs" }
atrium-devevents    = { path = "../atrium-devevents" }
fresco-scene-server = { path = "../fresco-scene-server" }
fresco-vulkan       = { path = "../fresco-vulkan" }
fresco-compute      = { path = "../fresco-compute", features = ["rdna4"] }
atrium-rdna4        = { path = "../atrium-rdna4" }
atrium-spv-loader   = { path = "../atrium-spv-loader" }
fresco-protocol     = { path = "../fresco-protocol" }
aqueduct            = { path = "../aqueduct" }
aqueduct-gpu        = { path = "../aqueduct-gpu" }
aqueduct-gpu-client = { path = "../aqueduct-gpu-client" }
aqueduct-gpu-host   = { path = "../aqueduct-gpu-host" }
fresco-aqueduct-bridge = { path = "../fresco-aqueduct-bridge" }
fresco-text         = { path = "../fresco-text" }
fresco-split        = { path = "../fresco-split" }
atrium-trace        = { path = "../atrium-trace/rust" }
# Note: frescod no longer depends on portcullis-peer/policy. window-management is
# granted by REACHABILITY of the dedicated wm socket (the TCB mounts it only for
# cap holders), so frescod reads no registry/policy. See socket_server::spawn.
image               = { version = "0.25", default-features = false, features = ["png"] }
libc       = "0.2"
env_logger = "0.11"
log = "0.4"
