[package]
name        = "limen"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Limen, the cross-jail embed broker (docs/spec/limen.md): role catalogue and messages, the limend daemon, and the parent and child clients."
publish     = false

[lib]
name = "limen"
path = "src/lib.rs"

[[bin]]
name = "limend"
path = "src/bin/limend.rs"

[features]
legacy-smime-integration = []

[dependencies]
aqueduct        = { path = "../aqueduct" }
portcullis-peer = { path = "../portcullis/portcullis-peer" }
fresco-protocol = { path = "../fresco-protocol" }
portcullis-ipc  = { path = "../portcullis/portcullis-ipc" }
portcullis-toml  = { path = "../portcullis/portcullis-toml" }
portcullis-policy = { path = "../portcullis/portcullis-policy" }
libc            = "0.2"
# The socket the supervisor binds at boot (fast-boot.md §5).
atrium-listen   = { path = "../atrium-listen" }
# choragusd's attribution wire (embedded players play as their parent).
lyra-protocol   = { path = "../lyra-protocol" }
# The one parser for your own server's addresses (background-apps.md §4.4).
navigator-control = { path = "../navigator-control" }
serde    = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }

[dev-dependencies]
nuntius = { path = "../nuntius", default-features = false }
fresco-client = { path = "../fresco-client" }

[[example]]
name = "limen-embed-probe"
path = "examples/embed_probe.rs"

[[example]]
name = "limen-arca-probe"
path = "examples/arca_fill_probe.rs"

[[example]]
name = "limend-dev"
path = "examples/limend_dev.rs"

[[example]]
name = "limen-view-probe"
path = "examples/view_probe.rs"

[[example]]
name = "limen-show-probe"
path = "examples/show_probe.rs"

[[example]]
name = "limen-usage-probe"
path = "examples/usage_probe.rs"
