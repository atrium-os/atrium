[package]
name = "navigator-image"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The Navigator's image decoders (PNG, JPEG, GIF, WebP, strict-profile SVG), bounded on the header and checked against the content address, for jailed workers."

[dependencies]
# Image decoders: pure Rust, permissively licensed, memory-safe as built.
# zune-jpeg WITHOUT its x86/neon features (its SIMD intrinsics, its
# `unsafe`); the scalar path decodes the same images. gif without
# `color_quant` (an encoder concern).
png = "0.17"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
image-webp = "0.2.4"
gif = { version = "0.14.2", default-features = false, features = ["std"] }
# SVG, rasterised like any image (src/svg.rs). LICENCE DECISION
# (2026-11-06): resvg/usvg are Apache-2.0 OR MIT since 0.36; roxmltree MIT
# OR Apache-2.0; tiny-skia BSD-3. All default features OFF: no system fonts,
# no svgz, no embedded raster decoders, no text (v1). The strict profile
# is checked on roxmltree's tree BEFORE usvg parses anything.
resvg = { version = "0.49", default-features = false }
usvg = { version = "0.49", default-features = false }
# The strict profile itself, shared with the vector (NSG path) route.
navigator-svg = { path = "../navigator-svg" }
# The content address images travel by.
blake3 = { version = "1", features = ["pure"] }
# The profile's ceilings (MAX_IMAGE_DIMENSION, MAX_DECODED_IMAGE_BYTES).
navigator-dom = { path = "../navigator-dom" }
