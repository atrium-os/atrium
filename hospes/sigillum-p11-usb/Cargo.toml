[package]
name = "sigillum-p11-usb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "S5 P4 gate on a Linux guest: a real CCID token over usbfs, relayed to sigillum-p11, which it drives as sigillumd would (test tool, never in CI)"

[dependencies]
libc = "0.2"
sigillum-proto = { path = "../../sigillum/sigillum-proto" }
sigillumd = { path = "../../sigillum/sigillumd" }
zeroize = "1"
