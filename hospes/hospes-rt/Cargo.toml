[package]
name = "hospes-rt"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "no_std, libc-free runtime and loader for Hospes (raw syscalls, allocator, TLS, threads)"

[dependencies]
hospes-elf = { path = "../hospes-elf" }

[features]
default = ["global"]
# For host binaries: our _start, the #[global_allocator] and the panic handler.
# Libraries (hospes-glibc) depend on hospes-rt without it, so their tests can use std.
global = []

[lib]
# A no_std runtime with its own _start, allocator and panic handler: it is exercised by the
# loader fixtures through hospes-fixture-runner, not by the host test harness.
test = false
doctest = false
