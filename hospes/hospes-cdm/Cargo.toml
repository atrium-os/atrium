[package]
name = "hospes-cdm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hosts a Chromium-interface CDM under Hospes, in capability mode, for the player"

[[bin]]
name = "hospes-cdm"
path = "src/main.rs"
test = false

[dependencies]
hospes-rt = { path = "../hospes-rt" }
hospes-glibc = { path = "../hospes-glibc" }
hospes-proto = { path = "../hospes-proto" }
