[package]
name = "hospes-codec"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Hosts Cisco's OpenH264 binary under Hospes, in capability mode, for the player's decode worker"

[[bin]]
name = "hospes-codec"
path = "src/main.rs"
test = false

[dependencies]
hospes-rt = { path = "../hospes-rt" }
hospes-glibc = { path = "../hospes-glibc" }
hospes-codec-wire = { path = "../hospes-codec-wire" }
