[workspace]
resolver = "2"
members = ["hospes-elf", "hospes-rt", "hospes-glibc", "hospes-codec-wire", "hospes-codec", "hospes-proto", "hospes-cdm", "hospes-cdm-check", "hospes-fixture-runner", "hospes-install", "sigillum-p11", "sigillum-p11-check"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

# panic=abort for the no_std runtime is passed by scripts/hospes-build.sh (cargo --config),
# because tests need unwinding and the repo builds std with build-std.
[profile.release]
debug = 1
opt-level = 2

# unwinding 0.2.11 with one fix (vendor/unwinding/ATRIUM.md): strip AArch64 pointer
# authentication codes from return addresses while unwinding.
[patch.crates-io]
unwinding = { path = "vendor/unwinding" }
