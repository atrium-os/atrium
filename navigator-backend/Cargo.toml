[package]
name = "navigator-backend"
version = "0.1.0"
edition = "2021"
description = "Consumes atrium-navigator-recording/1: the converter's output, ingested as UNTRUSTED input (docs/spec/atrium-navigator-backend.md §4.0, §4.2)."

[dependencies]
# ★ A mature parser rather than a hand-written one, deliberately. The emitter
# in navigator-prerender is hand-written because field ORDER must be fixed for
# content-addressing; a parser has no such requirement and every reason to be
# something already attacked by other people. This input is untrusted by rule
# (spec §4.2), including when it comes from our own converter — a recording
# arrives from a shared store, and the store does not vouch for it.
serde_json = "1"
# ★ The SAME parser the converter used. A recording carries serialized HTML,
# so the backend re-parses what the converter already parsed; two parsers
# would eventually disagree about the same bytes, and a disagreement between
# the producer of an artifact and its renderer is not found by testing either.
navigator-dom = { path = "../navigator-dom" }
# The content address a saved session and its recording travel by — the same
# hash, and the same pure-Rust build, as navigator-prerender's subresources
# (spec §5: the store is Tessera, and Tessera is content-addressed).
blake3 = { version = "1", features = ["pure"] }
# ★ The DISPLAY PATH (backend §4.8, bands; `display`): the worker normalizes
# its document and lays out its first screen with the same crates the
# converter's tools measure. The layout crates do not depend back on this one
# (pergola.md §10.3).
navigator-normalize = { path = "../navigator-normalize" }
# Which views are cookied, and their partition (legacy-web §5.4.1e).
navigator-cookies = { path = "../navigator-cookies" }
navigator-render = { path = "../navigator-render" }
navigator-style = { path = "../navigator-style" }
# The WHATWG URL parser, for the one decision the broker makes on a URL: where
# an activated link may go (src/links.rs). The converter resolves every URL it
# meets with the same crate.
url = "2"
# ★ Image decoders for the worker, which is where images decode (src/image.rs,
# threat model §2.4). Pure-Rust, permissively licensed, and chosen for being
# memory-safe: zune-jpeg is built WITHOUT its x86/neon features, which are
# the crate's SIMD intrinsics (its `unsafe`); the scalar path decodes the
# same images. gif without `color_quant` (an encoder concern).
png = "0.17"
libc = "0.2"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
image-webp = "0.2.4"
gif = { version = "0.14.2", default-features = false, features = ["std"] }
# ★ SVG, rasterised in the worker like any image (src/svg.rs, threat model
# §2.4). LICENCE DECISION (2026-11-06): resvg/usvg are Apache-2.0 OR MIT
# since 0.36 (they were MPL-2.0 before, which this project avoided, as it
# avoided cssparser); roxmltree is MIT OR Apache-2.0; tiny-skia BSD-3. All
# default features OFF: no system fonts (a render must not depend on the
# host), no svgz (no decompressor of hostile input), no embedded raster
# decoders (an <image> is refused by the profile before usvg sees it), no
# text (v1; see svg.rs). The strict profile is checked on roxmltree's tree
# BEFORE usvg parses anything.
resvg = { version = "0.49", default-features = false }
# The strict profile itself lives in navigator-svg, shared with the vector
# (NSG path node) route, so bitmap and vector check the same thing.
navigator-svg = { path = "../navigator-svg" }
usvg = { version = "0.49", default-features = false }
# The broker's byte search of a recording (src/carried.rs): a 10 MB miss
# took 25.6 ms with `windows().any()`, and the broker is single-threaded.
memchr = "2"

[features]
# ★ Unconfined brokers (`Navigatord::unconfined_for_testing`) exist only in
# test builds: this crate's tests, its examples, and anything that turns this
# on deliberately. A shipped navigatord has `Navigatord::start` alone, which
# refuses an unconfined host (threat model §2.3).
unconfined-for-testing = []

[dev-dependencies]
jpeg-encoder = "0.7.1"
# Tests and examples get the unconfined constructor; the library does not.
navigator-backend = { path = ".", features = ["unconfined-for-testing"] }
png = "0.17"
libc = "0.2"

# navigator-fonts vendors a one-line fix to pathfinder_simd; a dependent crate
# must repeat the patch, because [patch] only applies at the build root.
[patch.crates-io]
pathfinder_simd = { path = "../navigator-fonts/vendor/pathfinder_simd" }
