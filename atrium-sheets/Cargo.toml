[package]
name = "atrium-sheets"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "atrium-sheets, Atrium's spreadsheet (docs/spec/officina.md §8): officina-grid's engine in a Pergola GridView, files through the system picker, an autosave journal for crash recovery."

[lib]
name = "atrium_sheets"
path = "src/lib.rs"

[[bin]]
name = "atrium-sheets"
path = "src/bin/atrium_sheets.rs"

[[example]]
name = "scroll_cost"
path = "examples/scroll_cost.rs"

[dependencies]
atrium-open = { path = "../atrium-open" }
officina-core = { path = "../officina-core" }
officina-grid = { path = "../officina-grid" }
# Writers, protection and the launcher: the readers run in the convert worker.
officina-convert = { path = "../officina-convert", default-features = false }
officina-draw = { path = "../officina-draw" }
# Printing: the sheet as PDF (no in-process picture decoder).
officina-pdf = { path = "../officina-pdf", default-features = false }
pergola = { path = "../pergola" }
limen = { path = "../limen" }
monstrator = { path = "../monstrator" }
fresco-protocol = { path = "../fresco-protocol" }
# Ctrl+P, caught before the window sees it.
fresco-client = { path = "../fresco-client" }
libc = "0.2"

[profile.release]
# What ships in the bundle: no debug info, symbols stripped.
strip = true

# `--profile profiling`: release code with line tables, for perf and the
# stall probes.
[profile.profiling]
inherits = "release"
debug = 1
strip = false

[dev-dependencies]
# Tests make foreign sample files with the readers' crate.
officina-convert = { path = "../officina-convert", features = ["read"] }
