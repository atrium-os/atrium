[package]
name        = "fresco-bundle"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
publish     = false
description = "Fresco SPIR-V bundle format: manifest parsing, validation, dispatch table. Per docs/spec/fresco-rendering-stack.md §3.1-§3.4."

[lib]
name = "fresco_bundle"
path = "src/lib.rs"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
