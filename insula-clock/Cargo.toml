[package]
name        = "insula-clock"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Fifth sample Insula app — a windowed analog clock that composes multiple Pergola scene-node primitives per frame. Background rect, twelve tick-mark rects, two rotated path strokes for the hour + minute hands. Demonstrates the multi-node frame builder + rotated-quad path primitive in a real app loop. The Insula-platform sibling of the existing fresco-rs-based atrium-clock — same visual, different stack (portable libatrium C ABI instead of direct fresco-rs deps)."
publish     = false

[[bin]]
name = "insula-clock"
path = "src/main.rs"

[dependencies]
libatrium = { path = "../libatrium" }

[dev-dependencies]
aqueduct        = { path = "../aqueduct" }
fresco-protocol = { path = "../fresco-protocol" }
postcard        = { version = "1", features = ["use-std"] }
tempfile        = "3"
