[package]
name = "atrium-calendar"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
default-run = "atrium-calendar"

[features]
default = ["desktop"]
desktop = ["dep:atrium-open", "dep:limen", "dep:pergola", "dep:praeco"]

[[bin]]
name = "atrium-calendar"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "reminder_probe"
required-features = ["desktop"]

[dependencies]
portcullis-ipc = { path = "../portcullis/portcullis-ipc" }
atrium-message = { path = "../sdk/atrium-message" }
atrium-worker = { path = "../sdk/atrium-worker" }
sha2 = "0.10"
libc = "0.2"
atrium-listen = { path = "../atrium-listen" }
aqueduct = { path = "../aqueduct" }
portcullis-peer = { path = "../portcullis/portcullis-peer" }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }

[target.'cfg(target_os = "freebsd")'.dependencies]
praeco = { optional = true, path = "../praeco" }
atrium-open = { optional = true, path = "../atrium-open" }
limen = { optional = true, path = "../limen" }
pergola = { optional = true, path = "../pergola" }
