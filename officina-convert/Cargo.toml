[package]
name = "officina-convert"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Officina's converters for foreign formats (docs/spec/officina.md §5.2): a bounded ZIP reader and writer, .xlsx in and out. The reader runs in a sandboxed converter process (`officina-convert`); the writer runs in the document process over our own model."

[lib]
name = "officina_convert"
path = "src/lib.rs"

[[bin]]
name = "officina-convert"
path = "src/bin/officina_convert.rs"
required-features = ["read"]

[features]
# The readers of foreign files. They run in the converter; an app's core
# links the crate without them (default-features = false): the writers,
# protection and the launcher only, so no XML parser.
default = ["read"]
read = ["dep:quick-xml", "dep:navigator-image", "dep:navigator-dom", "dep:serde_json"]

[dependencies]
officina-core = { path = "../officina-core" }
officina-grid = { path = "../officina-grid" }
officina-text = { path = "../officina-text" }
officina-slides = { path = "../officina-slides" }
# Headers only (sizes, sniffing): the apps draw the pictures.
officina-pict = { path = "../officina-pict", default-features = false }
# Pure Rust deflate (MIT OR Zlib OR Apache-2.0); the repo already uses it via navigator-fonts.
miniz_oxide = "0.8"
# Streaming XML (MIT); bounded by our own limits on top.
quick-xml = { version = "0.37", optional = true }
# The pictures mode of the worker (pictures.rs): the Navigator's memory-safe
# decoders, with Office's WMF/EMF/BMP.
navigator-image = { path = "../navigator-image", features = ["office"], optional = true }
# HTML clipboard import runs in the worker. The parser's registry dependencies
# and serde_json are already used in-tree and dual MIT/Apache-2.0.
navigator-dom = { path = "../navigator-dom", optional = true }
serde_json = { version = "1", optional = true }
libc = "0.2"
# Run as the app's `convert` worker when installed (dev-tools-plan.md M5).
atrium-worker = { path = "../sdk/atrium-worker" }
# Password-protected documents (O7a): RustCrypto, MIT OR Apache-2.0.
aes = "0.8"
aes-gcm = "0.10"
sha1 = "0.10"
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
getrandom = "0.2"

[profile.release]
# What ships in the bundle: no debug info, symbols stripped.
strip = true

# `--profile profiling`: release code with line tables, for perf and the
# stall probes.
[profile.profiling]
inherits = "release"
debug = 1
strip = false
