# Curia, the Settings app (docs/spec/curia.md). A system app: it holds the
# restricted capabilities its pages need, approved for Curia only.
[app]
id          = "org.atrium.curia"
name        = "Settings"
version     = "0.1.0"
entry       = "bin/curia"
description = "Settings: network and Wi-Fi, Bluetooth, display, sound, devices, apps, printers, VPN."
icon        = "settings"

[capabilities]
graphics          = "fresco"
network-read      = true   # how the machine is online
network-details   = true   # interfaces, addresses, routes
network-wifi      = true   # join, forget, saved networks' settings
wifi-nearby       = true   # the networks around (tells where you are)
network-configure = true   # the Wi-Fi country (restricted: Curia only)
device-list       = true   # every device and its owner (restricted: Curia only)
display-settings  = true   # displays, text size, light/dark (restricted: Curia only)
audio-control     = true   # the volume, apps' levels, outputs (restricted: Forum, Curia)
app-grants        = true   # what each app may do; allow, remove (restricted: Curia only)
bluetooth-control = true   # pair, connect, forget Bluetooth devices (restricted: Curia, Forum bar)
printers-configure = true  # add, share, remove printers; print history (restricted: Curia only)
vpn-read          = true   # which tunnels there are and whether each is up
vpn-use           = true   # connect and disconnect them
vpn-configure     = true   # add, import, change, remove tunnels (restricted: Curia only)
network           = "none"
# Limen roles it embeds. Without this key a platform bundle keeps every role.
embeds = ["credential", "picker", "app-settings"]

[supervision]
restart   = "on-crash"
instances = "single"
