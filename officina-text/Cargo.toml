[package]
name = "officina-text"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Officina's word-processing engine (docs/spec/officina.md §7): the document model (an indexed tree of blocks, rich text runs, named styles), undoable ops, paragraph layout cached per paragraph, and pagination with checkpoints that stops when page breaks line up again. No UI."

[dependencies]
# Headers only: which picture a file is (picture::mime).
officina-pict = { path = "../officina-pict", default-features = false }
officina-core = { path = "../officina-core" }
officina-shapes = { path = "../officina-shapes" }
navigator-fontset = { path = "../navigator-fontset" }
atrium-fonts = { path = "../atrium-fonts" }
rustybuzz = "0.20"
ttf-parser = "0.25"
unicode-linebreak = "0.1.5"
unicode-bidi = "0.3.18"
# Automatic hyphenation: Knuth-Liang with the en-US TeX patterns built in
# (the same crate and patterns as pergola's wrapped text).
hyphenation = { version = "0.8", features = ["embed_en-us"] }

[profile.release]
debug = 1
