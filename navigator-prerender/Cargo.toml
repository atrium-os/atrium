[package]
name = "navigator-prerender"
version = "0.1.0"
edition = "2021"
description = "Tier-2 conversion instrument: run a page's scripts once, headlessly, and snapshot the resulting DOM. Its output is a measurement (docs/spec/atrium-navigator-legacy-web.md §11.4)."

[dependencies]
# ★ annex-b is NOT on by default, and without it every script wrapped in the
# legacy `<!-- ... //-->` HTML-comment idiom is a SyntaxError. That wrapper is
# standardised JavaScript (ECMAScript Annex B.1.1, HTML-like comments) and
# every browser accepts it in a classic script, so refusing it made real,
# valid pages look broken.
# intl_bundled ships ICU data in the binary. Without it there is NO `Intl`
# object, and `toLocaleDateString` silently degrades to the full
# `Date.toString()` — a page formatting a date gets garbage rather than an
# error. 33 of the corpus's 566 fetched scripts use Intl.
boa_engine = { version = "0.22", features = ["annex-b", "intl_bundled"] }
fixed_decimal = "0.7.2"
# ★ The DOM and the parser live in a shared crate so the converter and the
# backend cannot drift into two notions of what a document is. See
# navigator-dom/src/lib.rs.
navigator-dom = { path = "../navigator-dom" }
icu_experimental = "0.6.0"
icu_locale_core = "2.3.0"
url = "2"
# The content address a subresource travels by (§3.13 + Tessera CAS).
blake3 = { version = "1", features = ["pure"] }
# setrlimit + sysctlbyname for the jailed converter's self-checks (src/serve.rs).
libc = "0.2"
# ★ Layout geometry (legacy-web §5.4.5.6e): a script's getBoundingClientRect
# and offsetWidth are answered from the SAME normalizer and renderer the lane
# uses, run over the converter's live DOM — not from a second layout engine
# that would disagree with what the document is later drawn as.
navigator-normalize = { path = "../navigator-normalize" }
navigator-render = { path = "../navigator-render" }
navigator-style = { path = "../navigator-style" }

# navigator-fonts vendors a one-line fix to pathfinder_simd; a dependent
# crate must repeat the patch, because [patch] only applies at the build root.
[patch.crates-io]
pathfinder_simd = { path = "../navigator-fonts/vendor/pathfinder_simd" }

[[bin]]
name = "prerender"
path = "src/main.rs"
