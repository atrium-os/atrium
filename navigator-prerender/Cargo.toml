[package]
name = "navigator-prerender"
version = "0.1.0"
edition = "2021"
description = "Tier-2 conversion instrument: run a page's scripts once, headlessly, and snapshot the resulting DOM. Its output is a measurement (docs/spec/atrium-navigator-legacy-web.md §11.4)."

[dependencies]
# ★ annex-b is NOT on by default, and without it every script wrapped in the
# legacy `<!-- ... //-->` HTML-comment idiom is a SyntaxError. That wrapper is
# standardised JavaScript (ECMAScript Annex B.1.1, HTML-like comments) and
# every browser accepts it in a classic script, so refusing it made real,
# valid pages look broken.
# intl_bundled ships ICU data in the binary. Without it there is NO `Intl`
# object, and `toLocaleDateString` silently degrades to the full
# `Date.toString()` — a page formatting a date gets garbage rather than an
# error. 33 of the corpus's 566 fetched scripts use Intl.
boa_engine = { version = "0.22", features = ["annex-b", "intl_bundled"] }
fixed_decimal = "0.7.2"
html5ever = "0.39"
icu_experimental = "0.6.0"
icu_locale_core = "2.3.0"
markup5ever_rcdom = "0.39"
url = "2"

[[bin]]
name = "prerender"
path = "src/main.rs"
