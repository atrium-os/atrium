[package]
name = "navigator-prerender"
version = "0.1.0"
edition = "2021"
description = "Tier-2 conversion instrument: run a page's scripts once, headlessly, and snapshot the resulting DOM. Its output is a measurement (docs/spec/atrium-navigator-legacy-web.md §11.4)."

[dependencies]
boa_engine = "0.22"
html5ever = "0.39"
markup5ever_rcdom = "0.39"

[[bin]]
name = "prerender"
path = "src/main.rs"
