# Pin nightly + rust-src for build-std support across all crates in this
# tree. rust-src is needed because aarch64-unknown-freebsd is a Tier-3
# target — rustup doesn't ship prebuilt std for it, so we rebuild std
# from source on first cross-compile.
#
# Pinned (2026-11-18) so every machine builds with the same compiler:
# nightly-2026-11-14 is rustc 1.102.0-nightly (5f4effd57 2026-11-13), what
# the cloud sessions build with. Move it on purpose, for the whole tree,
# and tell every thread: `rustup toolchain install <date> --component rust-src`.
[toolchain]
channel = "nightly-2026-11-14"
components = ["rust-src"]
