[package]
name        = "atrium-netd-macos"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "macOS adapter for the Insula-introduced network broker (insula.md §4.2). Listens on a unix socket for CLASS_NET CONNECT requests, validates against an allowlist, resolves DNS, opens TCP, then byte-proxies between the app's local socket and the upstream connection. v0 allowlist is open (no hostname enforcement yet); the daemon shape closes the spec caveat about 'no hostname-aware broker exists today.'"
publish     = false

[[bin]]
name = "atrium-netd-macos"
path = "src/main.rs"

[dependencies]
aqueduct        = { path = "../aqueduct" }
insula-manifest = { path = "../insula-manifest" }
libc            = "0.2"

[dev-dependencies]
libatrium = { path = "../libatrium" }
libc      = "0.2"
tempfile  = "3"
