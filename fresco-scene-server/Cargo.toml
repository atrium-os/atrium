[package]
name = "fresco-scene-server"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Fresco scene-server library: IPC, scene-state authority, scene-graph processor, WM, bundle host, GPU coordinator. Consumed by frescod and other Atrium services."

[lib]
name = "fresco_scene_server"
path = "src/lib.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"

aqueduct        = { path = "../aqueduct" }
fresco-protocol = { path = "../fresco-protocol" }
fresco-vulkan   = { path = "../fresco-vulkan" }
