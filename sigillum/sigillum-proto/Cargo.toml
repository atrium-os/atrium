[package]
name = "sigillum-proto"
version = "0.1.0"
description = "Sigillum's two wires (sigillum.md §14): clients <-> sigillumd and drivers <-> sigillumd"
edition.workspace = true
license.workspace = true

[features]
default = ["std"]
# The read_msg/write_msg helpers over std::io. Without it the records and the codec are
# no_std + alloc, for the sigillum-p11 Hospes host (sigillum.md §16.5).
std = ["postcard/use-std", "serde/std", "zeroize/std"]

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
zeroize = { version = "1", default-features = false, features = ["serde", "alloc"] }
