# Sigillum, the identity verification service (docs/spec/sigillum.md).
#
# Its own workspace, so the device drivers and the broker build and test
# anywhere. The one path dependency outside sigillum/ is portcullis-peer
# (sigillumd's peer uids). sigillum-ui, which draws with Fresco, is outside
# the workspace.
[workspace]
resolver = "2"
# sigillum-ui draws with Fresco and has its own lock file.
exclude = ["sigillum-ui"]
members = [
    "sigillum-cbor",
    "sigillum-ctap",
    "sigillum-softkey",
    "sigillum-proto",
    "sigillum-fido",
    "sigillumd",
    "sigillum-webauthn",
    "sigillum-ccid",
    "sigillum-pcsc",
]

[workspace.package]
edition = "2021"
license = "BSD-2-Clause"

[workspace.dependencies]
p256     = { version = "0.13", features = ["ecdsa", "ecdh"] }
sha2     = "0.10"
hmac     = "0.12"
hkdf     = "0.12"
aes      = "0.8"
cbc      = "0.1"
getrandom = { version = "0.2", features = ["std"] }
zeroize  = "1"
serde    = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
