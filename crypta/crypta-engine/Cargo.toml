[package]
name        = "crypta-engine"
version     = "0.1.0"
edition.workspace = true
license.workspace = true
publish     = false
description = "Crypta's engine processes: WireGuard (atrium-crypta-wg) and AnyConnect (atrium-crypta-ac) (docs/spec/vpn.md §3): one per tunnel, in its own jail, on a tun descriptor and one UDP socket; its static key through cryptad, never held."

[[bin]]
name = "atrium-crypta-wg"
path = "src/main.rs"

[[bin]]
name = "atrium-crypta-ac"
path = "src/ac/main.rs"

[dependencies]
crypta-gp    = { path = "../crypta-gp" }
crypta-ac    = { path = "../crypta-ac" }
aura-ipc     = { path = "../../aura/aura-ipc" }
rustls       = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
ring         = "0.17"
crypta-wg    = { path = "../crypta-wg" }
crypta-proto = { path = "../crypta-proto" }
libc         = "0.2"
zeroize      = "1"

[dev-dependencies]
crypta-wg = { path = "../crypta-wg" }
aura-ipc  = { path = "../../aura/aura-ipc" }
