[package]
name        = "crypta-ctl"
version     = "0.1.0"
edition.workspace = true
license.workspace = true
publish     = false
description = "VPN tunnels on Aqueduct (CLASS_VPN, docs/spec/vpn.md §7.2): wire types, the client Curia and the bar use, and atrium-crypta-ctl, the unprivileged front that serves the capability sockets for cryptad."

[lib]
name = "crypta_ctl"
path = "src/lib.rs"

[[bin]]
name = "atrium-crypta-ctl"
path = "src/bin/atrium-crypta-ctl.rs"

[dependencies]
aqueduct = { path = "../../aqueduct" }
aura-ipc = { path = "../../aura/aura-ipc" }
serde    = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
libc     = "0.2"

[[bin]]
name = "atrium-vpnctl"
path = "src/bin/atrium-vpnctl.rs"
