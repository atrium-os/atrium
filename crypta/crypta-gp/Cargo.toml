[package]
name = "crypta-gp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
crypta-ac = { path = "../crypta-ac" }
crypta-proto = { path = "../crypta-proto" }
zeroize = "1"
aes = { version = "0.8", features = ["zeroize"] }
cbc = { version = "0.1", features = ["zeroize"] }
getrandom = "0.2"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
