[package]
name        = "crypta-proto"
version     = "0.1.0"
edition.workspace = true
license.workspace = true
publish     = false
description = "What Crypta's processes say to each other (docs/spec/vpn.md §3): the engine's messages to and from cryptad, and the WireGuard .conf importer (hostile input, fuzzed)."

[dependencies]
serde    = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
zeroize  = { version = "1" }
