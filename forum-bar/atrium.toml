# Forum bar — the top status strip. A Forum chrome app: it renders via Fresco
# (its own surface) and drives the WM over forum-ctl (`forum-control`). It holds
# no `window-management` — it can only ASK forum-wm, never touch windows itself.
[app]
id          = "org.atrium.forum-bar"
name        = "Forum Bar"
version     = "0.1.0"
entry       = "bin/forum-bar"
description = "The Forum top bar — wordmark, focused app, clock."
icon        = "settings"

[capabilities]
graphics      = "fresco"
forum-control = true
audio-control = true   # the volume control: levels and mutes, never samples
media-control = true   # now-playing: the active player's app, state and controls
removable-media = true # USB sticks served for the session, and eject
session-lock  = true   # the Lock button: ostiarius locks; only the lock screen unlocks
network-read  = true   # the network icon: online, how, Wi-Fi bars
network-wifi  = true   # its menu: the network's name, join a remembered one, disconnect
wifi-nearby   = true   # its menu: the networks around
network       = "none"

[supervision]
restart    = "on-crash"
keep-alive = true
instances  = "single"
