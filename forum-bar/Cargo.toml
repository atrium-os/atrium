[package]
name = "forum-bar"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "forum-bar — Forum's statusbar / indicators. An ordinary graphics-only Insula app holding no window-management capability: it asks the WM core (forum-wm) over forum-ctl for the session's surfaces and renders a status summary (focused app + window count). See docs/spec/forum.md §3."

[lib]
name = "forum_bar"
path = "src/lib.rs"

[[bin]]
name = "forum-bar"
path = "src/main.rs"

[dependencies]
# Now playing (choragusd media-control, atrium-player-pip-keys.md §4).
lyra-protocol = { path = "../lyra-protocol" }
forum-ctl = { path = "../forum-ctl" }
# USB sticks served for the session, and eject (dispensatord, device-assignment.md §6.6).
atrium-media = { path = "../dispensator/media" }
# forum-bar draws its bar via Pergola (the UI toolkit) → frescod, the same way any
# Atrium UI renders. It holds no window-management cap; it just draws + asks forum-ctl.
pergola = { path = "../pergola" }
fresco-client = { path = "../fresco-client" }
fresco-protocol = { path = "../fresco-protocol" }
