[package]
name = "atrium-test-client"
version = "0.1.0"
edition = "2021"
description = "Fresco protocol smoke clients — envelope wire (M2.7+)."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "atrium-test-client"
path = "src/main.rs"

[[bin]]
name = "atrium-rect-bouncer"
path = "src/bouncer.rs"

[[bin]]
name = "atrium-slot-demo"
path = "src/slot_demo.rs"

[[bin]]
name = "atrium-textured"
path = "src/textured.rs"

[[bin]]
name = "atrium-text-demo"
path = "src/text_demo.rs"

[[bin]]
name = "atrium-window-demo"
path = "src/window_demo.rs"

[[bin]]
name = "atrium-server-text-demo"
path = "src/server_text_demo.rs"

# Scene-complexity stress test. Emits N animated rects per frame
# so frescod-aqueduct's tier-1 wait-phase scaling can be measured.
[[bin]]
name = "atrium-stress"
path = "src/stress.rs"

# Text-heavy variant: LINES rows of CHARS chars per frame as
# separate glyph_run nodes. Closer to a terminal/editor workload.
[[bin]]
name = "atrium-glyph-stress"
path = "src/glyph_stress.rs"

# Multi-window scenario: N windows open, only ONE updates per
# frame (the "active" one cycles slowly). Verifies per-window
# dirty tracking actually skips un-dirty windows.
[[bin]]
name = "atrium-multiwindow-stress"
path = "src/multiwindow_stress.rs"

[dependencies]
fresco-client   = { path = "../fresco-client" }
fresco-protocol = { path = "../fresco-protocol" }
fresco-text     = { path = "../fresco-text" }
