[package]
name = "atrium-test-client"
version = "0.1.0"
edition = "2021"
description = "Minimal Fresco protocol client over Unix socket — D1 step 2(c.4) smoke"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "atrium-test-client"
path = "src/main.rs"

[[bin]]
name = "atrium-rect-bouncer"
path = "src/bouncer.rs"

[[bin]]
name = "atrium-slot-demo"
path = "src/slot_demo.rs"

[[bin]]
name = "atrium-textured"
path = "src/textured.rs"

[[bin]]
name = "atrium-text-demo"
path = "src/text_demo.rs"

[[bin]]
name = "atrium-window-demo"
path = "src/window_demo.rs"

[[bin]]
name = "atrium-keyboard"
path = "src/keyboard.rs"

[dependencies]
fresco-server = { path = "../../fresco" }
fresco-socket-rs = { path = "../fresco-socket-rs" }
fresco-text = { path = "../fresco-text" }
