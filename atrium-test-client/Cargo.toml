[package]
name = "atrium-test-client"
version = "0.1.0"
edition = "2021"
description = "Fresco protocol smoke clients — envelope wire (M2.7+)."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "atrium-test-client"
path = "src/main.rs"

[[bin]]
name = "atrium-rect-bouncer"
path = "src/bouncer.rs"

[[bin]]
name = "atrium-slot-demo"
path = "src/slot_demo.rs"

[[bin]]
name = "atrium-textured"
path = "src/textured.rs"

[[bin]]
name = "atrium-text-demo"
path = "src/text_demo.rs"

[[bin]]
name = "atrium-window-demo"
path = "src/window_demo.rs"

[dependencies]
fresco-client   = { path = "../fresco-client" }
fresco-protocol = { path = "../fresco-protocol" }
fresco-text     = { path = "../fresco-text" }
