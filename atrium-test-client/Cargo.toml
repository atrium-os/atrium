[package]
name = "atrium-test-client"
version = "0.1.0"
edition = "2021"
description = "Fresco protocol smoke clients — envelope wire (M2.7+)."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "atrium-test-client"
path = "src/main.rs"

[[bin]]
name = "atrium-gpu-fuzz"
path = "src/gpu_fuzz.rs"

[[bin]]
name = "atrium-rect-bouncer"
path = "src/bouncer.rs"

[[bin]]
name = "atrium-slot-demo"
path = "src/slot_demo.rs"

[[bin]]
name = "atrium-textured"
path = "src/textured.rs"

[[bin]]
name = "atrium-text-demo"
path = "src/text_demo.rs"

[[bin]]
name = "atrium-window-demo"
path = "src/window_demo.rs"

[[bin]]
name = "atrium-span-probe"
path = "src/span_probe.rs"

[[bin]]
name = "atrium-server-text-demo"
path = "src/server_text_demo.rs"

# Scene-complexity stress test. Emits N animated rects per frame
# so frescod-aqueduct's tier-1 wait-phase scaling can be measured.
[[bin]]
name = "atrium-stress"
path = "src/stress.rs"

# Text-heavy variant: LINES rows of CHARS chars per frame as
# separate glyph_run nodes. Closer to a terminal/editor workload.
[[bin]]
name = "atrium-glyph-stress"
path = "src/glyph_stress.rs"

# Multi-window scenario: N windows open, only ONE updates per
# frame (the "active" one cycles slowly). Verifies per-window
# dirty tracking actually skips un-dirty windows.
[[bin]]
name = "atrium-multiwindow-stress"
path = "src/multiwindow_stress.rs"

# Intra-window damage-rect scenario: one window with static
# corner rects + a small bouncing "cursor" rect. Verifies
# frescod-aqueduct's skip-hierarchy level 3 (partial redraw via
# SetScissor + no-clear renderpass) fires.
[[bin]]
name = "atrium-surfaces-demo"
path = "src/surfaces_demo.rs"

# The trusted chrome (F4d): plays the Navigator over frescod's chrome channel.
[[bin]]
name = "atrium-chrome-demo"
path = "src/chrome_demo.rs"

# F3: a hostile renderer and Navigator against frescod's broker.
[[bin]]
name = "atrium-split-fuzz"
path = "src/split_fuzz.rs"

[[bin]]
name = "atrium-partial-stress"
path = "src/partial_stress.rs"

[[bin]]
name = "atrium-vector-demo"
path = "src/vector_demo.rs"

[[bin]]
name = "atrium-scroll-demo"
path = "src/scroll_demo.rs"

# Tabula's activation tokens end to end against frescod (tabula.md §2).
[[bin]]
name = "atrium-activation-probe"
path = "src/activation_probe.rs"

[[bin]]
name = "atrium-video-probe"
path = "src/video_probe.rs"

[dependencies]
aqueduct        = { path = "../aqueduct" }
fresco-client   = { path = "../fresco-client" }
fresco-protocol = { path = "../fresco-protocol" }
fresco-split    = { path = "../fresco-split" }
atrium-gpu-app  = { path = "../atrium-gpu-app" }
atrium-rdna4-isa = { path = "../atrium-rdna4-isa" }
fresco-compute  = { path = "../fresco-compute" }
fresco-text     = { path = "../fresco-text" }
libc            = "0.2"
png             = "0.17"
