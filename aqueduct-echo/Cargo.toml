[package]
name        = "aqueduct-echo"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Smoke-test server + client for aqueduct — exercises the envelope, CAS upload, and event channel end-to-end."
publish     = false

[[bin]]
name = "aqueduct-echo-server"
path = "src/bin/server.rs"

[[bin]]
name = "aqueduct-echo-client"
path = "src/bin/client.rs"

[dependencies]
aqueduct = { path = "../aqueduct" }
