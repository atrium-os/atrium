[package]
name        = "fenestrad"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
publish     = false
description = "Fenestra's session daemon on the host (fenestra.md §3.2): no network; relays frescod's scene-stream records to and from per-session jails."

[dependencies]
fenestra-link   = { path = "../fenestra-link" }
fenestra-wire   = { path = "../fenestra-wire" }
portcullis-peer = { path = "../portcullis/portcullis-peer" }
libc            = "0.2"

[target.'cfg(target_os = "freebsd")'.dependencies]
jaild               = { path = "../portcullis/jaild" }
portcullis-identity = { path = "../portcullis/portcullis-identity" }
portcullis-mounts   = { path = "../portcullis/portcullis-mounts" }
atrium-fdpass       = { path = "../atrium-fdpass" }

[[bin]]
name = "fenestrad"
path = "src/main.rs"

[[bin]]
name = "fenestra-shell"
path = "src/bin/fenestra-shell.rs"
