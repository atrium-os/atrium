[package]
name = "cargo-atrium"
description = "cargo atrium: check, new, run, bundle, cross and fuzz for Atrium apps (dev-tools.md §5.5, app-composition.md §6)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cargo-atrium"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
portcullis-toml   = { path = "../../portcullis/portcullis-toml" }
portcullis-policy = { path = "../../portcullis/portcullis-policy" }
serde_json = "1"
toml = "0.8"
