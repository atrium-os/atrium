[package]
name = "cargo-atrium"
description = "cargo atrium: check, new, run, bundle, cross and fuzz for Atrium apps (dev-tools.md §5.5, app-composition.md §6)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cargo-atrium"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
portcullis-toml   = { path = "../../portcullis/portcullis-toml" }
portcullis-policy = { path = "../../portcullis/portcullis-policy" }
portcullis-sig    = { path = "../../portcullis/portcullis-sig" }
atrium-icon       = { path = "../atrium-icon" }
base64 = "0.22"
flate2 = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
serde_json = "1"
toml = "0.8"
