[package]
name = "atrium-schema"
description = "C header and encoder/decoder from an atrium-message schema file"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "atrium-schema"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[dev-dependencies]
atrium-message = { path = "../atrium-message" }
