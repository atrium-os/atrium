[package]
name = "officina-pdf"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "PDF export for Officina (docs/spec/officina.md §7.4, §14): pages from officina-text's painter, streamed page by page, fonts embedded as TrueType subsets, each picture once, links as annotations."

[features]
default = ["local-decode"]
local-decode = ["dep:navigator-image"]

[dependencies]
officina-draw = { path = "../officina-draw" }
officina-text = { path = "../officina-text" }
# Decks drawn as display lists (printing from Slides).
officina-slides = { path = "../officina-slides" }
# The in-process decoder, used only when the app installed none
# (officina_text::picture): Write installs its worker's and builds without it.
navigator-image = { path = "../navigator-image", features = ["office"], optional = true }
# The shared base with Folium (docs/spec/folium.md §5.1): the object
# writer, the TrueType subsetter and ToUnicode, the content operators.
folium-syntax = { path = "../folium-syntax" }
folium-font = { path = "../folium-font" }
folium-content = { path = "../folium-content" }
# Colour glyphs (emoji) drawn as pictures.
atrium-colr = { path = "../atrium-colr" }

[profile.release]
debug = 1

[dev-dependencies]
png = "0.17"
# Tests read the PDFs back and draw them, as Prelum's render jail does.
folium-doc = { path = "../folium-doc" }
folium-render = { path = "../folium-render" }
