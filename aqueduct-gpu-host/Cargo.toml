[package]
name        = "aqueduct-gpu-host"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
publish     = false
description = "macOS-side aqueduct-gpu host endpoint daemon. Accepts guest connections (from frescod's renderer and from atrium-vk-icd), maintains per-connection resource tables, dispatches frame command streams against MoltenVK. Bring-up-only — D5+ native HW replaces this with direct atrium-gpu kmod submission. See docs/spec/aqueduct-gpu.md §6 and §12."

[lib]
name = "aqueduct_gpu_host"
path = "src/lib.rs"

[[bin]]
name = "aqueduct-gpu-host"
path = "src/bin/main.rs"

# Developer / atrium-pkg tooling. Wraps shader_validator and
# shader_cache for offline use: CI gates, atrium-pkg's install-time
# precompile hook (Phase 2.5), local dev shader-check.
[[bin]]
name = "aqueduct-shader-tool"
path = "src/bin/shader_tool.rs"


[dependencies]
aqueduct       = { path = "../aqueduct" }
aqueduct-gpu   = { path = "../aqueduct-gpu" }
serde          = { version = "1", features = ["derive"] }
postcard       = { version = "1", features = ["use-std"] }
thiserror      = "1"
anyhow         = "1"
log            = "0.4"
env_logger     = "0.11"

# Vulkan / MoltenVK on the macOS host. Phase 1.3 only constructs an
# Instance + lists devices; full pipeline materialisation lands as
# stubs first, real implementation in 1.3b alongside frescod's
# renderer migration.
ash            = "0.38"

# Phase 1.3c: tier-1 SW renderer. Pure-Rust 2D rasterisation,
# permissively licensed (BSD-Zero). Same version Pergola uses to
# keep the workspace coherent.
tiny-skia      = "0.11"

# Phase 2.5: shader_tool CLI uses SHA-256 to key the cache. The
# aqueduct workspace already pulls sha2 in transitively; declaring
# it directly here makes the dep explicit.
sha2           = "0.10"

# Tier-2 rasterizer phase R.7: per-stripe parallel rasterisation
# in fill_image_triangle.  Rayon's global thread pool avoids
# per-draw thread-spawn overhead (a draw can cover hundreds of
# stripes on a 1080p surface) and `par_iter_mut` on a `Vec` of
# pre-split stripe slices Just Works in safe Rust.
rayon          = "1"

# Phase 2.9: shader_tool `verify-bundle` parses bundle manifest.json
# files. serde_json is the standard light JSON parser; adds <100 KB
# to the binary.
serde_json     = "1"

# Tier-2 (v5c+): software shader execution. The loader is responsible
# for SPIR-V → IR → .so AOT compile + dlopen; aqueduct-gpu-host wraps
# it in a Tier-2 shader registry that the eventual Tier2Backend will
# consume.
atrium-spv-loader = { path = "../atrium-spv-loader" }
# Storage-image runtime helpers + descriptor-table builders,
# used by the compute dispatcher to wire OpImageRead/Write.
atrium-spv-runtime = { path = "../atrium-spv-runtime" }

# Carillon transport (T0+): the host endpoint maps the shared-memory
# region (mmap), drives the pipe-backed doorbell (pipe/read/write), and
# queries the host page size (sysconf) via raw libc, mirroring the
# fresco/ivshmem_server.rs reference. See docs/spec/carillon.md.
libc           = "0.2"

# Carillon transport core (shared-mem rings + byte-stream bridge + pumps +
# ivshmem-server host attach). Pure crate, also used by the FreeBSD guest
# pump; the host re-exports it as `aqueduct_gpu_host::carillon`.
carillon-transport = { path = "../carillon-transport" }


[dev-dependencies]
aqueduct-gpu-client = { path = "../aqueduct-gpu-client" }
# Tier-2 registry integration test: build a SPIR-V shader,
# register it via Tier2Registry, dlopen + call.
rspirv          = "0.13"
tempfile        = "3"
atrium-spv-ir   = { path = "../atrium-spv-ir" }
# (libc is a normal dependency now — used by the carillon transport —
# so the perf/energy benchmarks' getrusage calls reuse it from there.)

[features]
default = []
# Phase 2.4 long-tail validator cross-check. Enables a host-side
# test that asserts every SPIR-V our hand validator accepts is also
# accepted by upstream SPIRV-Tools' Validator. Off by default so
# plain `cargo test` doesn't require a C++ toolchain or system
# install of libSPIRV-Tools.
#
# To run:
#   macOS:    brew install spirv-tools
#   FreeBSD:  pkg install spirv-tools
#   then:     cargo test --features spirv-tools-cross-check
spirv-tools-cross-check = ["dep:spirv-tools"]

# Optional only when the feature is enabled (cargo doesn't allow
# optional dev-deps, so this lives in [dependencies] but is gated).
[dependencies.spirv-tools]
version = "0.13"
default-features = false
features = ["use-installed-tools"]
optional = true
