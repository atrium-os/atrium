[package]
name = "atrium-compositor"
version = "0.1.0"
edition = "2021"
description = "First-light native FreeBSD compositor demo for D1 — tiny-skia rendering, atrium-gpu-rs scanout, animated clock"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "atrium-compositor"
path = "src/main.rs"

[features]
default = []
# Accept the vendor-extension `CMD_INJECT_KEY` opcode which lets a
# socket client push synthetic keyboard events into the compositor's
# event broadcast. Real input (D1 step 2c.16+) flows from native HID
# devices, NOT from clients — INJECT exists purely for automation
# harnesses like `atrium-keyboard`. Production builds disable it so
# untrusted clients can't spoof keystrokes.
inject-input = []

[dependencies]
atrium-gpu-rs = { path = "../atrium-gpu-rs" }
fresco-server = { path = "../../fresco", features = ["tiny-skia-backend"] }
tiny-skia = "0.11"
libc = "0.2"
bytemuck = "1"
env_logger = "0.11"
