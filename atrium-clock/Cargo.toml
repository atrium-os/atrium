[package]
name = "atrium-clock"
version = "0.1.0"
edition = "2021"
description = "Analog + digital clock on Fresco — fourth vertical app, exercises animation timers + solid-color geometry + child slots"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "atrium-clock"
path = "src/main.rs"

[dependencies]
fresco-rs = { path = "../fresco-rs" }
libc = "0.2"
swash = "0.1"
ttf-parser = "0.25"
