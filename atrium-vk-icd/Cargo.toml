[package]
name        = "atrium-vk-icd"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
publish     = false
description = "Vulkan ICD (Installable Client Driver) speaking aqueduct-gpu. Translates Vulkan API calls into aqueduct-gpu protocol messages destined for the host endpoint (frescod-aqueduct today; native HW kmod at D5+). This is not a general Vulkan driver — it targets aqueduct-gpu specifically. The Vulkan loader resolves `libvulkan.so.1` lookups against this crate's exported symbols. See `docs/spec/aqueduct-gpu.md` §7.1."

[lib]
name       = "atrium_vk_icd"
# cdylib: so the Vulkan loader can dlopen() us and resolve the
# loader-ICD entry points by symbol name. rlib: so integration
# tests under `tests/` can link our `pub extern "C"` symbols
# directly without going through the dlopen path.
crate-type = ["cdylib", "rlib"]

[dependencies]
aqueduct        = { path = "../aqueduct" }
aqueduct-gpu    = { path = "../aqueduct-gpu" }
aqueduct-gpu-client = { path = "../aqueduct-gpu-client" }
# ash for the raw Vulkan struct + handle types only — disable the
# default `loaded` runtime feature (we don't load libvulkan; we ARE
# libvulkan from the loader's perspective). Saves ~hundreds of
# lines of error-prone hand-defined Vk* structs.
ash             = { version = "0.38", default-features = false }
sha2            = "0.10"
# Postcard-encoding the Tier2PipelineStateBlob carried inside
# OP_GPU_PIPELINE_CREATE state_blob. The aqueduct-gpu wire types
# already serde-derive; this just gives us the encoder.
postcard        = { version = "1", features = ["use-std"] }

[dev-dependencies]
aqueduct-gpu-host = { path = "../aqueduct-gpu-host" }

# Example binaries that drive the ICD through its C ABI without
# the Khronos Vulkan loader.
[[example]]
name = "headless_triangle"
path = "examples/headless_triangle.rs"
