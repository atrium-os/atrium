[package]
name = "prelumd"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Prelum's daemon (docs/spec/printing.md §6.4): saved printers per person, one queue per printer, the job state machine and spool. Parses no document, no IPP and no mDNS: it starts jailed workers (prelum-render, prelum-ipp) and moves their bytes. Also prelumctl, its console client."

[dependencies]
prelum-proto = { path = "../prelum-proto" }
prelum-dnssd = { path = "../prelum-dnssd", features = ["serde"] }
atrium-netconf = { path = "../../atrium-net/netconf" }
prelum-ipp-codec = { path = "../prelum-ipp-codec", features = ["serde"] }
aqueduct = { path = "../../aqueduct" }
portcullis-peer = { path = "../../portcullis/portcullis-peer" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
toml = "0.8"
sha2 = "0.10"
base64 = "0.22"
libc = "0.2"

[target.'cfg(target_os = "freebsd")'.dependencies]
jaild = { path = "../../portcullis/jaild" }
portcullis-identity = { path = "../../portcullis/portcullis-identity" }
portcullis-mounts = { path = "../../portcullis/portcullis-mounts" }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "atrium-prelumd"
path = "src/bin/prelumd.rs"

[[bin]]
name = "prelumctl"
path = "src/bin/prelumctl.rs"
