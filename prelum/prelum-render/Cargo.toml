[package]
name = "prelum-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Prelum's conversion step (docs/spec/printing.md §6.1): a PDF read by Folium, laid out on the printer's paper and drawn in bands into PWG Raster or URF."

[dependencies]
folium-syntax = { path = "../../folium-syntax" }
folium-doc = { path = "../../folium-doc" }
folium-content = { path = "../../folium-content" }
folium-render = { path = "../../folium-render" }
prelum-raster = { path = "../prelum-raster" }
prelum-proto = { path = "../prelum-proto" }
prelum-ipp-codec = { path = "../prelum-ipp-codec" }
libc = "0.2"


[[bin]]
name = "atrium-prelum-render"
path = "src/bin/prelum-render.rs"
