[package]
name = "prelum-ipp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Prelum's printer connection (docs/spec/printing.md §6.3, §7.3): IPP over HTTP/1.1, plain or TLS, to one printer at an address prelumd resolved, with the printer's pinned key and printer-uuid checked before any job byte. Runs jailed, one per printer connection."

[dependencies]
prelum-ipp-codec = { path = "../prelum-ipp-codec", features = ["serde"] }
prelum-proto = { path = "../prelum-proto" }
navigator-fetch = { path = "../../navigator-fetch" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[[bin]]
name = "atrium-prelum-ipp"
path = "src/bin/prelum-ipp.rs"
