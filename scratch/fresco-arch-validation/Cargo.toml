[workspace]
resolver = "2"
members = [
    "crates/atrium-rpc-display",
    "crates/fresco-bundle",
    "crates/fresco-vulkan",
    "crates/fresco-server-poc",
    "crates/fresco-test-client",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
rust-version = "1.75"
publish      = false

[workspace.dependencies]
# Existing Atrium IPC substrate (per docs/spec/fresco-rendering-stack.md §3.7).
atrium-rpc = { path = "../bsd/atrium-rpc" }

# Internal workspace crates.
atrium-rpc-display = { path = "crates/atrium-rpc-display" }
fresco-bundle      = { path = "crates/fresco-bundle" }
fresco-vulkan      = { path = "crates/fresco-vulkan" }

# Vulkan via ash (low-level, no abstraction we can't see through).
ash       = "0.38"
ash-window = "0.13"

# Window + event loop. Used by fresco-server-poc only.
winit              = "0.30"
raw-window-handle  = "0.6"

# Errors / utility.
anyhow      = "1"
thiserror   = "1"
log         = "0.4"
env_logger  = "0.11"

# JSON for bundle manifests.
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Hashing — sha2 to match atrium-rpc / Tessera (SHA-256 throughout).
sha2        = "0.10"

[profile.release]
lto           = "thin"
codegen-units = 1
opt-level     = 3
