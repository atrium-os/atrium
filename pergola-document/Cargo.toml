[package]
name = "pergola-document"
version = "0.1.0"
edition = "2021"
description = "DocumentView (pergola.md §10.2): the document engine's bands drawn as Pergola nodes inside a ScrollView, for an app's own trusted rich text and for the doc-viewer child."

[features]
default = ["view"]
view = ["dep:navigator-render"]

[dependencies]
pergola = { path = "../pergola" }
# The document engine, for the view itself (feature `view`); `Faces` alone
# needs only the pinned font set.
navigator-render = { path = "../navigator-render", optional = true }
navigator-fontset = { path = "../navigator-fontset" }
atrium-fonts = { path = "../atrium-fonts" }
fresco-protocol = { path = "../fresco-protocol" }

[dev-dependencies]
navigator-style = { path = "../navigator-style" }

# navigator-fonts vendors a one-line fix to pathfinder_simd (see its
# vendor/README.md); a dependent crate must repeat the patch.
[patch.crates-io]
pathfinder_simd = { path = "../navigator-fonts/vendor/pathfinder_simd" }
