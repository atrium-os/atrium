[package]
name = "vinculum-hci"
version = "0.1.0"
description = "Vinculum's transport: owns one controller, frames H4, filters the host's commands (spec §5)"
edition.workspace = true
license.workspace = true

[dependencies]
vinculum-hci-proto = { path = "../vinculum-hci-proto" }
libc = "0.2"

[features]
# The USB transport links the libusb-1.0 API: libusb in FreeBSD base, or
# libusb-1.0 on a macOS/Linux development host. Off, only tcp: and uart: exist.
default = ["usb"]
usb = []
# --serve-tcp, the development bridge: the raw controller with no allowlist
# on loopback. Only for a dev host (RUNBOOK §13.6b); never in a package.
dev-bridge = []

[[bin]]
name = "vinculum-hci"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
