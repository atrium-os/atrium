[package]
name = "atrium-slides"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "atrium-slides, Atrium's presentation app (docs/spec/officina.md §9, O6b–O6d): officina-slides decks edited on a Pergola canvas, a slide strip of thumbnails, files through the system picker (.oslides, .pptx and .odp), an autosave journal for crash recovery, and presenting: the slideshow full screen with transitions and builds run by frescod, the presenter view on another monitor."

[lib]
name = "atrium_slides"
path = "src/lib.rs"

[[bin]]
name = "atrium-slides"
path = "src/bin/atrium_slides.rs"

[features]
local-decode = ["dep:navigator-image"]

[dependencies]
atrium-open = { path = "../atrium-open" }
officina-core = { path = "../officina-core" }
# Writers, protection and the launcher: the readers run in the convert worker.
officina-convert = { path = "../officina-convert", default-features = false }
officina-text = { path = "../officina-text" }
officina-slides = { path = "../officina-slides" }
# Printing: the deck as PDF; pictures through the installed decoder.
officina-pdf = { path = "../officina-pdf", default-features = false }
# Pictures are decoded in the convert worker (officina_convert::pictures);
# `local-decode` decodes them here instead (benchmarks, tests).
navigator-image = { path = "../navigator-image", features = ["office"], optional = true }
pergola = { path = "../pergola" }
pergola-document = { path = "../pergola-document", default-features = false }
fresco-protocol = { path = "../fresco-protocol" }
fresco-client = { path = "../fresco-client" }
limen = { path = "../limen" }
libc = "0.2"
jpeg-encoder = "0.7.1"
# Previews saved as PNG are deflated here (decode::encode_png).
miniz_oxide = "0.8"

# navigator-fonts vendors a one-line fix to pathfinder_simd (see its
# vendor/README.md); a dependent crate must repeat the patch.
[patch.crates-io]
pathfinder_simd = { path = "../navigator-fonts/vendor/pathfinder_simd" }

[profile.release]
# What ships in the bundle: no debug info, symbols stripped.
strip = true

# `--profile profiling`: release code with line tables, for perf and the
# stall probes.
[profile.profiling]
inherits = "release"
debug = 1
strip = false

[dev-dependencies]
png = "0.17"
navigator-image = { path = "../navigator-image", features = ["office"] }
# Tests make foreign sample files with the readers' crate.
officina-convert = { path = "../officina-convert", features = ["read"] }

# Decodes pictures in its own process: `--features local-decode`.
[[example]]
name = "big_deck"
required-features = ["local-decode"]
