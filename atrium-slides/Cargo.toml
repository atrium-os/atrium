[package]
name = "atrium-slides"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "atrium-slides, Atrium's presentation app (docs/spec/officina.md §9, O6b–O6d): officina-slides decks edited on a Pergola canvas, a slide strip of thumbnails, files through the system picker (.oslides, .pptx and .odp), an autosave journal for crash recovery, and presenting: the slideshow full screen with transitions and builds run by frescod, the presenter view on another monitor."

[lib]
name = "atrium_slides"
path = "src/lib.rs"

[[bin]]
name = "atrium-slides"
path = "src/bin/atrium_slides.rs"

[dependencies]
officina-core = { path = "../officina-core" }
officina-convert = { path = "../officina-convert" }
officina-text = { path = "../officina-text" }
officina-slides = { path = "../officina-slides" }
navigator-image = { path = "../navigator-image" }
pergola = { path = "../pergola" }
pergola-document = { path = "../pergola-document" }
fresco-protocol = { path = "../fresco-protocol" }
fresco-client = { path = "../fresco-client" }
limen = { path = "../limen" }
libc = "0.2"

# navigator-fonts vendors a one-line fix to pathfinder_simd (see its
# vendor/README.md); a dependent crate must repeat the patch.
[patch.crates-io]
pathfinder_simd = { path = "../navigator-fonts/vendor/pathfinder_simd" }

[profile.release]
debug = 1

[dev-dependencies]
png = "0.17"
