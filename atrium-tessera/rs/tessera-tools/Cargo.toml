[package]
name        = "tessera-tools"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
description = "CLI tools for Tessera volumes (mkfs-tessera, tessera-debug)."
publish     = false

[[bin]]
name = "mkfs-tessera"
path = "src/bin/mkfs.rs"

[[bin]]
name = "tessera-debug"
path = "src/bin/debug.rs"

[[bin]]
name = "tessera-fsck"
path = "src/bin/fsck.rs"

[[bin]]
name = "tessera-import"
path = "src/bin/import.rs"

[[bin]]
name = "tessera-stat"
path = "src/bin/stat.rs"

[[bin]]
name = "tessera-binsplit"
path = "src/bin/binsplit.rs"

[[bin]]
name = "tessera-repack"
path = "src/bin/repack.rs"

[[bin]]
name = "tessera-defrag"
path = "src/bin/defrag.rs"

[[bin]]
name = "tessera-reindex"
path = "src/bin/reindex.rs"

[dependencies]
tessera-sys = { path = "../tessera-sys" }
libc        = "0.2"
sha2        = "0.10"
# The sealed-volume crypto backend (src/crypt.rs) the C core calls through
# tessera_crypt_set_backend: AES-256 blocks and the two 96-bit-nonce AEADs.
aes              = "0.8"
aes-gcm          = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
getrandom        = "0.2"
object      = { version = "0.36", default-features = false, features = ["read", "elf", "std"] }
iced-x86    = { version = "1.21", default-features = false, features = ["std", "decoder", "intel"] }
