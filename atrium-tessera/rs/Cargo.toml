[workspace]
resolver = "2"
members = [
    "tessera-sys",
    "tessera",
    "tessera-test-harness",
]

[workspace.package]
version       = "0.1.0"
edition       = "2021"
license       = "BSD-2-Clause"
repository    = "https://github.com/atrium-os/atrium"
rust-version  = "1.75"

[profile.release]
lto           = "thin"
codegen-units = 1
opt-level     = 3
