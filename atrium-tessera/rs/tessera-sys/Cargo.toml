[package]
name        = "tessera-sys"
version.workspace     = true
edition.workspace     = true
license.workspace     = true
repository.workspace  = true
description = "Raw FFI bindings to libtessera_core (the canonical C codec)."
links       = "tessera_core"

[lib]
crate-type = ["rlib"]

[build-dependencies]
# Compiles the C core for non-FreeBSD targets (see build.rs): the prebuilt
# archive in the tree is the cross-built one and cannot link on the host.
cc = "1"
# bindgen is added in Phase 1 once the C surface stabilises; for Phase 0
# we hand-write a minimal subset to keep the toolchain dependency light.

[dependencies]
# D3: the C core's on-disk decoders forward to these Rust exports
# (tessera_rs_*, core/src/tessera_rs.h) when it is built with
# -DTESSERA_RUST_DECODE, which is the default (TESSERA_C_DECODE=1 opts out).
# Always linked, so a core archive built either way links.
tessera-decode = { path = "../tessera-decode", features = ["ffi"] }
