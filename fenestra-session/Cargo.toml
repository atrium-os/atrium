[package]
name = "fenestra-session"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "The host's side of a Fenestra session (docs/spec/fenestra.md §3.2, §5): each window's scene stream to each proven viewer, from acked or resumed versions. fenestra-host-sim serves a recorded session over QUIC for gates on any host."

[dependencies]
fenestra-wire      = { path = "../fenestra-wire" }
fenestra-link      = { path = "../fenestra-link" }
fresco-render-core = { path = "../fresco-render-core" }
fresco-scene-server = { path = "../fresco-scene-server" }
fresco-compute     = { path = "../fresco-compute" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
log = "0.4"
