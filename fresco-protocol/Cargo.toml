[package]
name        = "fresco-protocol"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
publish     = false
description = "Display opcode dictionary for aqueduct (CLASS_DISPLAY=1). Control + scene + window-management op families per docs/spec/fresco-rendering-stack.md §3.7-§3.8."

[lib]
name = "fresco_protocol"
path = "src/lib.rs"

[dependencies]
aqueduct = { path = "../aqueduct" }
serde      = { version = "1", features = ["derive"] }
postcard   = { version = "1", features = ["use-std"] }
thiserror  = "1"
