[package]
name        = "atrium-player"
version     = "0.1.0"
edition.workspace = true
license.workspace = true
description = "atrium-player's supervisor: the media-player role's process that never parses media (docs/spec/atrium-player.md §2), and the worker wire."
publish     = false

[lib]
name = "atrium_player"
path = "src/lib.rs"

[[bin]]
name = "atrium-player"
path = "src/bin/atrium-player.rs"

[dependencies]
libc     = "0.2"
fresco-client   = { path = "../../fresco-client" }
fresco-protocol = { path = "../../fresco-protocol" }
# The media-player role's messages and the child's end of limend.
limen           = { path = "../../limen" }
# Sound: choragusd's client and the clock page (lyra-v1.md §5, §6).
lyra-protocol   = { path = "../../lyra-protocol" }
# Text in the controls (subtitles): Pergola's glyph atlas, shaped with swash.
pergola         = { path = "../../pergola" }
swash           = "0.1"
# Only `mime_supported`, a string check: the supervisor parses no media.
atrium-media-demux = { path = "../demux" }
serde    = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
# The system fetcher (nuntius.md §5 client 2): asked of portcullisd when
# the player is an app holding net-fetch.
nuntius  = { path = "../../nuntius" }
# --headless prints frame hashes comparable with ffmpeg's framemd5.
md-5     = "0.10"
hospes-proto = { path = "../../hospes/hospes-proto", features = ["std"] }
# OpenCdm (hospes.md §3): the system's CDM, asked of portcullisd; also the
# stand-in portcullisd in tests/system_fetcher.rs.
portcullis-ipc = { path = "../../portcullis/portcullis-ipc" }

[features]
# Start hospes-codec beside the worker when OpenH264 is installed (hospes.md §9).
h264 = []

[dev-dependencies]
# examples/media_probe.rs: limend in process, and the capture.
aqueduct = { path = "../../aqueduct" }
png      = "0.17"

[[example]]
name = "atrium-audio-play"
path = "examples/audio_play.rs"

[[example]]
name = "atrium-media-probe"
path = "examples/media_probe.rs"

# A test bundle's entry (scripts/hospes-player-jail-vm.sh).
[[example]]
name = "atrium-player-bundle-launch"
path = "examples/bundle_launch.rs"
