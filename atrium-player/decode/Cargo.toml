[package]
name        = "atrium-media-decode"
version     = "0.1.0"
edition.workspace = true
license.workspace = true
description = "atrium-player's decoders: dav1d, libvpx, libopus, libvorbis behind small C shims (docs/spec/atrium-player.md §4). Links into the decode worker only."
publish     = false
links       = "atrium_media_shim"
build       = "build.rs"

[dependencies]
atrium-media-demux = { path = "../demux" }
hospes-codec-wire = { path = "../../hospes/hospes-codec-wire", features = ["std"], optional = true }

[features]
# H.264 through Cisco's OpenH264 binary under Hospes (hospes.md §9; off by default,
# atrium-player.md §9.3).
h264 = ["dep:hospes-codec-wire"]

[build-dependencies]
cc         = "1"
pkg-config = "0.3"

[dev-dependencies]
md-5 = "0.10"
