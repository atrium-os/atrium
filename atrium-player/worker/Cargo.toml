[package]
name        = "atrium-player-decode"
version     = "0.1.0"
edition.workspace = true
license.workspace = true
description = "atrium-player's decode worker: demux and decode in Capsicum capability mode (docs/spec/atrium-player.md §2)."
publish     = false

[[bin]]
name = "atrium-player-decode"
path = "src/main.rs"

[dependencies]
atrium-player       = { path = "../player" }
atrium-media-demux  = { path = "../demux" }
atrium-media-decode = { path = "../decode" }
hospes-proto        = { path = "../../hospes/hospes-proto", features = ["std"] }
libc = "0.2"

[features]
h264 = ["atrium-media-decode/h264", "atrium-player/h264"]

[dev-dependencies]
md-5 = "0.10"
# tests/audio.rs: a stand-in choragusd.
lyra-protocol = { path = "../../lyra-protocol" }
# tests/play.rs: a stand-in portcullisd and Nuntius as a licence server's route.
nuntius = { path = "../../nuntius" }
portcullis-ipc = { path = "../../portcullis/portcullis-ipc" }
