[package]
name        = "aqueduct"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "OS-agnostic IPC substrate: versioned opcode-tagged envelope, content-addressed payloads, async events, fd-passed shm rendezvous. Atrium uses it via Portcullis-mounted UDS sockets, but the substrate itself is portable across BSDs / Linux / non-POSIX hosts."
publish     = false

[lib]
name = "aqueduct"
path = "src/lib.rs"

[dependencies]
sha2  = "0.10"
libc  = "0.2"

[dev-dependencies]
# unit tests use the std stuff that's already in the library
