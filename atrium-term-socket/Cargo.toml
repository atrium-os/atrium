[package]
name = "atrium-term-socket"
version = "0.1.0"
edition = "2021"
description = "Terminal emulator on the Atrium FreeBSD-native stack via fresco-client (envelope wire)."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "atrium-term-socket"
path = "src/main.rs"

[dependencies]
fresco-client   = { path = "../fresco-client" }
fresco-protocol = { path = "../fresco-protocol" }
libc = "0.2"
atrium-open     = { path = "../atrium-open" }
portcullis-ipc  = { path = "../portcullis/portcullis-ipc" }
stoa            = { path = "../stoa/stoa" }
stoa-proto      = { path = "../stoa/stoa-proto" }
stoa-term       = { path = "../stoa/stoa-term" }
vte = "0.13"
# The clipboard (Tabula) for paste and OSC 52, as pergola/src/clipboard.rs.
aqueduct        = { path = "../aqueduct" }
tabula          = { path = "../tabula" }
serde           = { version = "1", features = ["derive"] }
postcard        = { version = "1", features = ["use-std"] }
