[package]
name = "atrium-term-socket"
version = "0.1.0"
edition = "2021"
description = "Terminal emulator on the Atrium FreeBSD-native stack via fresco-socket-rs"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "atrium-term-socket"
path = "src/main.rs"

[dependencies]
fresco-scene-server = { path = "../fresco-scene-server" }
fresco-socket-rs = { path = "../fresco-socket-rs" }
fresco-text = { path = "../fresco-text" }
libc = "0.2"
vte = "0.13"
