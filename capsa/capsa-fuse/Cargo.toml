[package]
name = "capsa-fuse"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Capsa's FUSE server: serves a capsa-fat volume over a /dev/fuse fd it is handed (the FUSE kernel protocol, spoken directly; no libfuse). Runs jailed; jaild mounts from outside. docs/spec/device-assignment.md §4.6."

[dependencies]
capsa-fat = { path = "../capsa-fat" }
libc = "0.2"
# Tessera sticks, read-only, through the Tessera core's reader (its decoders
# are Rust). For FreeBSD, TESSERA_CORE_LIB names the cross-built core.
tessera-sys = { path = "../../atrium-tessera/rs/tessera-sys", optional = true }

[features]
default = ["tessera"]
tessera = ["dep:tessera-sys"]

[[bin]]
name = "atrium-capsa-fuse"
path = "src/bin/capsa-fuse.rs"
