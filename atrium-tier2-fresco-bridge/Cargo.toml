[package]
name        = "atrium-tier2-fresco-bridge"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
publish     = false
description = "Adapter: Tier2Backend::PresentCallback → Fresco texture-slot upload + window_present. Lets a tier-2 daemon push rendered frames onto a Fresco compositor without coupling aqueduct-gpu-host to fresco-client."

[lib]
name = "atrium_tier2_fresco_bridge"
path = "src/lib.rs"

[dependencies]
aqueduct-gpu-host = { path = "../aqueduct-gpu-host" }
fresco-client     = { path = "../fresco-client" }
fresco-protocol   = { path = "../fresco-protocol" }
log               = "0.4"

[dev-dependencies]
aqueduct          = { path = "../aqueduct" }
