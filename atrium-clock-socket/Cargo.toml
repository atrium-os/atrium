[package]
name = "atrium-clock-socket"
version = "0.1.0"
edition = "2021"
description = "Analog clock on the Atrium FreeBSD-native stack via fresco-socket-rs"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "atrium-clock-socket"
path = "src/main.rs"

[dependencies]
fresco-scene-server = { path = "../fresco-scene-server" }
fresco-socket-rs = { path = "../fresco-socket-rs" }
libc = "0.2"
