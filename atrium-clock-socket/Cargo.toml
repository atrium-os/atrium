[package]
name = "atrium-clock-socket"
version = "0.1.0"
edition = "2021"
description = "Analog clock on the Atrium FreeBSD-native stack via fresco-client (envelope wire)."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "atrium-clock-socket"
path = "src/main.rs"

[dependencies]
fresco-client   = { path = "../fresco-client" }
fresco-protocol = { path = "../fresco-protocol" }
libc = "0.2"
