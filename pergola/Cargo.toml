[package]
name        = "pergola"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
publish     = false
description = "Atrium UI toolkit. Sits above Fresco; emits scene-graph deltas via fresco-client. Sync API with signal-based reactive bridge."

[lib]
name = "pergola"
path = "src/lib.rs"

[dependencies]
fresco-client   = { path = "../fresco-client" }
fresco-protocol = { path = "../fresco-protocol" }
futures-signals = "0.3"
unicode-segmentation = "1.12"
# Glyph rastering for app-shaped text (src/glyphs.rs); pure Rust.
swash = "0.1"
# The stroker (strokes and dashes to fills) the Navigator's SVG uses; BSD-3.
tiny-skia-path = "0.12"
log             = "0.4"
taffy = "0.12.2"
# The clipboard service's wire (docs/spec/tabula.md); Pergola is a client.
tabula          = { path = "../tabula" }
limen           = { path = "../limen" }
aqueduct        = { path = "../aqueduct" }
serde           = { version = "1", features = ["derive"] }
postcard        = { version = "1", features = ["use-std"] }

[dev-dependencies]
env_logger = "0.11"
tempfile = "3"
libc = "0.2"

[[example]]
name = "hello"
path = "examples/hello.rs"
