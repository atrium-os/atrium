<html><body>
<style>.row { width: 700px; height: 110px }
.box { position: absolute; top: 20px; width: 80px; height: 40px; background-color: #0969da; color: #ffffff }
.o { position: relative; width: 700px; height: 110px; background-color: #f6f8fa }
.n { left: 10px; transform: none }
.t { left: 110px; transform: translate(0px, 20px) }
.tp { left: 210px; transform: translate(25%, 0px) }
.s { left: 310px; transform: scale(1.5, 0.5) }
.r { left: 430px; transform: rotate(20deg) }
.c { left: 550px; transform: translate(10px, 0px) rotate(20deg) scale(1.2, 1.2) }</style>
<div class="o"><div class="box n">none</div><div class="box t">translate</div><div class="box tp">pct</div>
<div class="box s">scale</div><div class="box r">rotate</div><div class="box c">all three</div></div>
</body></html>
