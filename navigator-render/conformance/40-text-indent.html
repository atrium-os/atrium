<html><body>
<style>p { width: 360px; background-color: #f6f8fa } .a { text-indent: 40px } .b { text-indent: 25% } .c { text-indent: -20px; padding-left: 20px }</style>
<p class="a">text-indent 40px moves only the first line of the paragraph in; the rest start at the edge</p>
<p class="b">text-indent 25% of the containing block's width on the first line only, then back to the edge</p>
<p class="c">a negative indent hangs the first line out into the padding, the classic hanging indent</p>
</body></html>
