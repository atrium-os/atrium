<html><body>
<style>.g { display: grid; width: 420px; margin-bottom: 12px; background-color: #f6f8fa; column-gap: 6px; row-gap: 6px } .g > div { height: 24px; background-color: #0969da } .g > .x { background-color: #cf222e } .g { grid-template-columns: repeat(4, 1fr); grid-template-rows: 24px 24px 24px }
.g > .d { height: auto }
.a { grid-column-start: auto; grid-column-end: auto } .b { grid-column-start: 2; grid-column-end: 4 }
.c { grid-column-start: 1; grid-column-end: span 2; grid-row-start: 2 } .d { grid-row-start: 2; grid-row-end: span 2; grid-column-start: 4 }</style>
<div class="g"><div class="a"></div><div class="b x"></div><div class="c"></div><div class="d x"></div></div>
</body></html>
