<html><body>
<style>p { width: 200px; background-color: #f6f8fa } .n { white-space: normal } .p { white-space: pre } .w { white-space: pre-wrap } .o { white-space: nowrap }</style>
<p class="n">normal   collapses   spaces and wraps at the edge</p><p class="p">pre   keeps
  lines   and spaces</p><p class="w">pre-wrap   keeps and wraps</p><p class="o">nowrap never wraps even past the edge of the box</p>
</body></html>
