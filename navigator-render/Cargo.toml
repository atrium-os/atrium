[package]
name = "navigator-render"
version = "0.1.0"
edition = "2021"
description = "The document lane's pure function: Markdown + viewport + pinned font set -> NSG (Navigator Scene Graph). M0 of navigator-backend.md."

[dependencies]
navigator-fonts = { path = "../navigator-fonts" }
navigator-style = { path = "../navigator-style" }
navigator-dom = { path = "../navigator-dom" }
pulldown-cmark = { version = "0.13", default-features = false }
rustybuzz = "0.20"
ttf-parser = "0.25"
blake3 = { version = "1", features = ["pure"] }
# Review tooling only (nsg-raster): never in the worker's build.
swash = { version = "0.1", optional = true }
png = { version = "0.17", optional = true }
unicode-bidi = "0.3.18"
# ★ Vector SVG (NSG `path` nodes): the shared strict profile and the
# tree-to-fills conversion; and Fresco's OWN checks, so a path the worker
# emits is one frescod takes — fresco-protocol's `FillParams::validate`
# (what the broker runs) and fresco-compute's `fill` (flattening and the
# per-path and per-tile limits, checked at the painted scale), whose CPU
# reference also paints paths in the review rasterizer.
navigator-svg = { path = "../navigator-svg" }
fresco-protocol = { path = "../fresco-protocol" }
fresco-compute = { path = "../fresco-compute" }
# UAX #14 line breaking. Dictionary data only (no `auto`/LSTM): the LSTM
# runs in floating point, and a render must be byte-identical across ISAs.
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }

[features]
raster = ["dep:swash", "dep:png"]

# navigator-fonts vendors a one-line fix to pathfinder_simd (see its
# vendor/README.md); a dependent crate must repeat the patch, because
# [patch] only applies at the root of the build.
[patch.crates-io]
pathfinder_simd = { path = "../navigator-fonts/vendor/pathfinder_simd" }

[[bin]]
name = "nsg-render"
path = "src/main.rs"

[[bin]]
name = "nsg-conformance"
path = "src/bin/nsg-conformance.rs"

[[bin]]
name = "nsg-flag"
path = "src/bin/nsg-flag.rs"

[[bin]]
name = "nsg-raster"
path = "src/bin/nsg-raster.rs"
required-features = ["raster"]

[dev-dependencies]
# The frescod integration test (tests/fresco_integration.rs): Navigator's fills
# through frescod's packing and its real kernels — Tier-2 (Cranelift) and the
# GIR interpreter — against fresco-compute's reference.
fresco-compute = { path = "../fresco-compute", features = ["cranelift"] }
atrium-gir = { path = "../atrium-gir" }
atrium-spv-frontend = { path = "../atrium-spv-frontend" }
tempfile = "3"
