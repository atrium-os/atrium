[package]
name        = "insula-logd"
version     = "0.1.0"
edition     = "2021"
license     = "MIT OR Apache-2.0"
description = "Insula log-forwarding daemon. Listens on a unix socket, accepts Aqueduct connections from libatrium clients, decodes CLASS_ECHO log messages, writes them to a structured log file. The daemon side of the path libatrium opens when $ATRIUM_LOG_SOCKET is set."
publish     = false

[[bin]]
name = "insula-logd"
path = "src/main.rs"

[dependencies]
aqueduct = { path = "../aqueduct" }

[dev-dependencies]
libatrium = { path = "../libatrium" }
tempfile  = "3"
